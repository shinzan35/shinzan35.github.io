<script>
const DATA = {"regions":[{"id":"★京都","slug":"kyoto","entries":[{"area":"北区","name":"わら天神宮","desc":"正式名称は敷地神社。安産のご利益で有名。藁に包まれたお守りを授かり、安産祈願をする文化がある。人生の道を開く、迷いを断ち切るという信仰も。落ち着いた雰囲気の中で、新しい生命の誕生を願う、歴史的な場所である。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://waratenjin.com/&ved=2ahUKEwjYmbCyiNuVAxVrkK8BHU7NBHAQFnoECEgQAQ&usg=AOvVaw3H3l3tbt0R1DOA252c9sFX","map":"https://www.google.com/maps/search/わら天神宮+京都","rate":3,"rg":"★京都","en":{"name":"Waratenjin Shrine (Shikichi-jinja)","desc":"Formally Shikichi Shrine, famous for blessings of safe childbirth: worshipers receive straw-wrapped amulets. A historic place of prayer for the birth of new life and for opening one's path, in a calm, settled atmosphere."}},{"area":"北区","name":"引接寺（千本ゑんま堂）","desc":"閻魔大王を祀る。伝統行事の「ゑんま堂狂言」で知られる。地域の歴史を大切にする、独自の信仰文化が根付いている寺院。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://yenmado.blogspot.com/&ved=2ahUKEwis5b2-ut2VAxV2sFYBHYsXGWcQFnoECEMQAQ&usg=AOvVaw0Pv_H81o-8SjBslotl3Zu_","map":"https://www.google.com/maps/search/千本ゑんま堂+京都","rate":3,"rg":"★京都","en":{"name":"Inju-ji Temple (Senbon Enma-do)","desc":"A temple enshrining the great King Enma, known for its traditional 'Enma-do Kyogen' plays — a temple with its own distinctive culture of faith that treasures local history."}},{"area":"北区","name":"賀茂別雷神社（上賀茂神社）","desc":"京都最古の社の一つ。世界遺産。雷神を祀る。社殿は国宝。境内の立砂は有名。境内を流れるならの小川など、自然と調和した広大な敷地には平安時代以来の格式高い佇まいが残る。歴史的・精神的な価値が非常に高い社である。","url":"https://www.kamigamojinja.jp/","map":"https://www.google.com/maps/search/上賀茂神社+京都","rate":4,"rg":"★京都","en":{"name":"Kamigamo Shrine","desc":"One of Kyoto's oldest shrines, a World Heritage site enshrining the god of thunder. Its halls are National Treasures, the famous standing sand cones mark where the deity descends, and the Mitarashi stream runs through vast grounds of Heian-era dignity."}},{"area":"北区","name":"建勲神社","desc":"織田信長を主祭神として祀る。船岡山に鎮座。信長公の偉業を称える神社。歴史的な視点からも重要な場所。","url":"https://kenkun-jinja.org/","map":"https://www.google.com/maps/search/建勲神社+京都","rate":4,"rg":"★京都","en":{"name":"Kenkun Shrine","desc":"Enshrining Oda Nobunaga as its principal deity on Mt. Funaoka — a shrine honoring Nobunaga's achievements, of importance historically as well."}},{"area":"北区","name":"建勲神社周辺の「船岡山公園」","desc":"（名所として）かつての平安京の基点ともされる山。京都市内を一望できる公園。歴史の重みを感じながら散策できる。","url":"https://kenkun-jinja.org/funaoka/","map":"https://www.google.com/maps/search/船岡山公園+京都","rate":3,"rg":"★京都","en":{"name":"Funaoka-yama Park","desc":"A hill once considered the starting point of ancient Heian-kyo; a park with panoramic views over Kyoto where one can stroll amid the weight of history."}},{"area":"北区","name":"玄武神社","desc":"平安時代の陰陽師・安倍晴明の勧請により創建されたと伝わる。玄武の神を祀り、厄除けの神社として地域に根ざしている。派手さはないが、古からの信仰を守り続ける静かな環境が特徴。","url":"https://kyotolove.kyoto/I0000021/","map":"https://www.google.com/maps/search/玄武神社+京都","rate":2,"rg":"★京都","en":{"name":"Genbu Shrine","desc":"Said to be founded at the behest of the onmyoji Abe no Seimei, enshrining the god Genbu. An unpretentious shrine of warding off misfortune, rooted in the community and keeping old faith alive in quiet surroundings."}},{"area":"北区","name":"光悦寺","desc":"本阿弥光悦の草庵跡。竹林の垣根が有名。庭園からは鷹峯の山並みが美しく、芸術家が愛した風景を今に伝える。静かな環境で心を研ぎ澄ますことができる。","url":"https://oniwa.garden/koetsuji-temple-garden-光悦寺庭園/","map":"https://www.google.com/maps/search/光悦寺+京都","rate":3,"rg":"★京都","en":{"name":"Kouetsu-ji Temple","desc":"On the site of the studio of the artist Hon'ami Koetsu, famous for its bamboo fences. The garden frames the mountains of Takagamine, preserving the scenery the artist loved — a place to sharpen the spirit in quiet."}},{"area":"北区","name":"今宮神社","desc":"疫病除けの神として信仰を集める。境内にある「阿呆賢さん」という石は、願い事を念じて叩くと願いが叶うとされる。名物の「あぶり餅」は古くから参拝客の疲れを癒やしてきた。地域社会の信仰の中心地として親しまれる歴史ある社。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.imamiyajinja.org/&ved=2ahUKEwjN9uqQhtuVAxULm68BHSXvHvUQFnoECB0QAQ&usg=AOvVaw2nS4_QWxqyMwQSd7mg1NhF","map":"https://www.google.com/maps/search/今宮神社+京都","rate":4,"rg":"★京都","en":{"name":"Imamiya Shrine","desc":"A shrine of protection from pestilence. The sacred stone 'Ahou-san' is said to grant wishes when tapped, and the famous aburi-mochi of its gateside shops have soothed pilgrims for centuries — an old shrine at the center of local faith."}},{"area":"北区","name":"上賀茂の社家町：周辺の川沿い","desc":"明神川が流れる景観は、社家の町としての歴史的風格を感じさせる。静かな水の流れが町並みをより美しくしている。","url":"https://furafurakyoto.com/syakemachi/","map":"https://www.google.com/maps/search/上賀茂社家町","rate":3,"rg":"★京都","en":{"name":"Kamigamo Shrine-priests' Town","desc":"The clear Myojin river flows past the historic homes of the shrine priests, lending the townscape a dignified, timeless charm."}},{"area":"北区","name":"上賀茂神社","desc":"正式名称は賀茂別雷神社。雷神を祀る京都最古の社の一つ。世界遺産に登録。社殿は国宝。境内の立砂は神が降臨する場所として有名。境内を流れるならの小川など、自然と調和した広大な敷地には平安時代以来の格式高い佇まいが残る。","url":"https://www.kamigamojinja.jp/","map":"https://www.google.com/maps/search/上賀茂神社+京都","rate":4,"rg":"★京都","en":{"name":"Kamigamo Shrine","desc":"Formally Kamowakeikazuchi Shrine — one of Kyoto's oldest shrines, a World Heritage site venerating the god of thunder, with National Treasure halls, sacred sand cones and the Mitarashi stream through expansive, dignified grounds."}},{"area":"北区","name":"上賀茂神社周辺の「神光院」","desc":"弘法大師ゆかりの寺。厄除けの信仰で知られる。静寂な環境が保たれており、地域の精神的な守り手として大切にされている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kyoto-design.jp/spot/2770&ved=2ahUKEwjzm8O2u92VAxUtsFYBHScrKyMQFnoECDAQAQ&usg=AOvVaw0I8BvNg35i5eO2-nez_a4r","map":"https://www.google.com/maps/search/神光院+京都","rate":3,"rg":"★京都","en":{"name":"Shinko-in Temple","desc":"A temple tied to Kobo Daishi, known for warding off misfortune; kept in tranquil surroundings and cherished as a spiritual guardian of the district."}},{"area":"北区","name":"常照寺","desc":"日蓮宗の寺。鷹峯の地にあり、本阿弥光悦ゆかりの地として知られる。吉野太夫寄進の赤門が有名。境内には茶室があり、静かな時間が流れる。秋の紅葉の名所でもあり、鷹峯の自然とともに、かつての芸術家たちの息吹を感じることができる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://tsakae.justhpbs.jp/joshoji/toppage.html&ved=2ahUKEwiBiraKituVAxV_bPUHHVsSF_YQFnoECEIQAQ&usg=AOvVaw3PMpkI3N0AMIFVdY5l7DIL","map":"https://www.google.com/maps/search/常照寺+京都","rate":3,"rg":"★京都","en":{"name":"Joshi-ji Temple","desc":"A Nichiren temple of Takagamine tied to Hon'ami Koetsu, famous for the red gate donated by the courtesan Yoshino Tayu. Its tea house, autumn foliage and unhurried hours evoke the spirit of the artists who once gathered here."}},{"area":"北区","name":"正伝寺","desc":"臨済宗南禅寺派。比叡山を借景とした枯山水庭園が有名。庭園の白砂とサツキの刈り込み、背後の比叡山の眺望は静寂と調和の極致。歴史的な禅の思想を空間全体で表現しており、禅僧の厳しい修行の場としての風格を今も色濃く残す。","url":"https://oniwa.garden/shodenji-temple-kyoto/","map":"https://www.google.com/maps/search/正伝寺+京都","rate":3,"rg":"★京都","en":{"name":"Shoden-ji Temple","desc":"A Rinzai temple of the Nanzen-ji school, famed for a dry-landscape garden that borrows Mt. Hiei as scenery. White sand, clipped azaleas and the mountain beyond form an epitome of Zen stillness — the temple remains a place of rigorous monastic training."}},{"area":"北区","name":"平野神社","desc":"平野神社：平安時代からの歴史を持つ、桜の名所。境内には多種の桜が植えられ、長く花を楽しむことができる。かつては皇室の崇敬を受け、歴史的な重要な祭礼も行われてきた。地域の文化を守る社。","url":"https://www.hiranojinja.com/","map":"https://www.google.com/maps/search/平野神社+京都","rate":4,"rg":"★京都","en":{"name":"Hirano Shrine","desc":"A shrine of Heian-era history famous for cherry blossoms: many varieties bloom in turn for a long season. Once favored by the Imperial court, it keeps historic festivals and the culture of its district."}},{"area":"北区","name":"大将軍八神社","desc":"方位の神、方除けの神として知られる。かつての平安京の西北の守り。星にまつわる信仰も深い。独自の歴史的背景と信仰を持つ神社。","url":"https://www.daishogun.or.jp/","map":"https://www.google.com/maps/search/大将軍八神社+京都","rate":3,"rg":"★京都","en":{"name":"Daishogun Hachi-jinja Shrine","desc":"A shrine of directional deities guarding the northwest of ancient Heian-kyo, with deep star-related faith and a distinctive history of its own."}},{"area":"北区","name":"大将軍八神社周辺の「一条戻橋」","desc":"（名所として）伝承の多い橋。晴明伝説など、京都の神秘的な歴史を感じさせる場所。街の中に溶け込んだ歴史の断片。","url":"https://kyotolove.kyoto/I0000210/","map":"https://www.google.com/maps/search/一条戻橋+京都","rate":2,"rg":"★京都","en":{"name":"Ichijo Modori-bashi Bridge","desc":"A bridge dense with legend — home of the Seimei stories and more — a fragment of Kyoto's mystical history folded into the modern city."}},{"area":"北区","name":"大徳寺","desc":"臨済宗大徳寺派の大本山。一休宗純ゆかりの寺として知られる。広大な境内には多くの塔頭が並び、それぞれが美しい庭園を持つ。茶の湯の文化と深く関わり、国宝の茶室や襖絵などが数多く残されている。禅寺の格式を色濃く残す歴史的拠点。","url":"https://daitokujidaijiin.com/daitokuji.html","map":"https://www.google.com/maps/search/大徳寺+京都","rate":4,"rg":"★京都","en":{"name":"Daitoku-ji Temple","desc":"The head temple of the Rinzai Daitoku-ji school, long tied to the monk Ikkyu. Its vast precinct holds many sub-temples with beautiful gardens, and its deep bond with the tea ceremony has left National Treasure tea rooms and screen paintings — a historic stronghold of Zen."}},{"area":"北区","name":"大徳寺・高桐院","desc":"大徳寺の塔頭の一つ。細川忠興が建立。楓の参道が非常に有名で、静寂と禅の美学が凝縮された庭園。歴史の重みを感じさせる厳かな雰囲気が漂う場所。","url":"https://oniwa.garden/daitokuji-kotoin-temple-高桐院/","map":"https://www.google.com/maps/search/高桐院+京都","rate":4,"rg":"★京都","en":{"name":"Koto-in Temple (Daitoku-ji)","desc":"A sub-temple of Daitoku-ji founded by Hosokawa Tadaoki, famous for its maple-lined approach — a garden distilling stillness and the aesthetics of Zen."}},{"area":"北区","name":"大徳寺・瑞峯院","desc":"大徳寺塔頭。キリシタン大名・大友宗麟の菩提寺。枯山水庭園「独坐庭」は、荒磯を表現した石組みが力強く、禅の精神を現代にも鮮やかに伝える。","url":"https://oniwa.garden/daitoku-ji-temple-zuihoin-garden-大徳寺瑞峯院庭園/","map":"https://www.google.com/maps/search/瑞峯院+京都","rate":4,"rg":"★京都","en":{"name":"Zuiho-in Temple (Daitoku-ji)","desc":"A Daitoku-ji sub-temple, family temple of the Christian daimyo Otomo Sorin; its dry garden 'Dokuzutei' powerfully evokes a rugged seashore of rocks, conveying the Zen spirit vividly to the present."}},{"area":"北区","name":"大徳寺周辺の「今宮神社」","desc":"「あぶり餅」が有名。疫病退散の神様として信仰される。門前町の風情が今も残る場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.kyoto-jinjacho.or.jp/shrine/03/019/&ved=2ahUKEwj3wpan7d-VAxW-rlYBHa5nFcgQFnoECCYQAQ&usg=AOvVaw2atI1mSgFwW3CgyVXsH5EA","map":"https://www.google.com/maps/search/今宮神社+京都","rate":4,"rg":"★京都","en":{"name":"Imamiya Shrine (near Daitoku-ji)","desc":"Famous for its aburi-mochi and worshiped as a deity of protection from pestilence — a spot that keeps the flavor of the old temple town."}},{"area":"北区","name":"鷹峯（周辺の景観）","desc":"本阿弥光悦が芸術家村を築いた地。京都の北の奥座敷として、独特の文化的な歴史と自然の美しさが残る場所。隠れた名所が多い。","url":"https://www.leafkyoto.net/210612kouetsuji/","map":"https://www.google.com/maps/search/鷹峯","rate":3,"rg":"★京都","en":{"name":"Takagamine (scenic area)","desc":"Where the artist Hon'ami Koetsu built an artists' colony; Kyoto's quiet northern quarter retains a unique cultural history and natural beauty, with many hidden sights."}},{"area":"北区","name":"等持院","desc":"足利将軍家の菩提寺。境内には足利尊氏の墓所がある。庭園は夢窓疎石によるものとされる。歴史的な足利家との関わりを感じさせる場所で、静かで落ち着いた雰囲気を持つ、禅の教えが残る場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://toujiin.jp/&ved=2ahUKEwiI7ozhjduVAxVhgK8BHXh2G8IQFnoECEUQAQ&usg=AOvVaw2mRv07BLvvfNk7quQ2AzwO","map":"https://www.google.com/maps/search/等持院+京都","rate":3,"rg":"★京都","en":{"name":"Toji-in Temple","desc":"The family temple of the Ashikaga shoguns, holding the tomb of Ashikaga Takauji; its garden is attributed to the master Muso Soseki — a calm, settled Zen place steeped in the family's history."}},{"area":"伏見区","name":"月桂冠大倉記念館（周辺の伏見の酒蔵エリアとして）","desc":"伏見の酒造りの歴史と文化を伝える施設。伏見の湧水が酒造りに欠かせない歴史的な背景を学ぶことができる。地域産業と信仰、文化が密接に関わっていることを象徴する場所。","url":"https://www.gekkeikan.co.jp/enjoy/museum/fushimi/","map":"https://www.google.com/maps/search/月桂冠大倉記念館+京都","rate":3,"rg":"★京都","en":{"name":"Gekkeikan Okura Sake Museum","desc":"A museum telling the history and culture of Fushimi sake brewing, where you can learn how the district's famous spring water made its sake possible — a symbol of the bond between local industry, faith and culture."}},{"area":"伏見区","name":"月桂冠大倉記念館周辺の「長建寺」","desc":"伏見にある数少ない寺院の一つ。龍宮門が特徴的で、弁財天を祀る。伏見の酒のまちの歴史と信仰が融合している。","url":"https://www.keihanhotels-resorts.co.jp/the-thousand-kyoto/sight/yamari-fushimi-yamashina/post_13.html","map":"https://www.google.com/maps/search/長建寺+京都","rate":5,"rg":"★京都","en":{"name":"Choken-ji Temple, Fushimi","desc":"One of the few temples of Fushimi, marked by its distinctive dragon-gate; it enshrines Benzaiten, blending the faith and sake-brewing history of the town."}},{"area":"伏見区","name":"御香宮神社","desc":"境内から湧き出る水は「御香水」として名高く、名水百選に選ばれている。安産や子育ての神として信仰される。神社の歴史的環境と自然が一体となり、地域の人々の生活を守り続けている。","url":"https://gokounomiya.kyoto.jp/","map":"https://www.google.com/maps/search/御香宮神社+京都","rate":3,"rg":"★京都","en":{"name":"Gokonomiya Shrine","desc":"Famous for its 'Gokosui' spring, chosen among Japan's top 100 waters, and worshiped as a deity of safe childbirth and child-rearing; the shrine's historic setting and nature continue to watch over local life."}},{"area":"伏見区","name":"三室戸寺","desc":"西国三十三所観音霊場。四季折々の花が有名で、特にアジサイやツツジ、ハスなどが境内を彩る。古くからの信仰の地であり、静寂の中に美しさが共存している。歴史的な伽藍と四季の花々の調和は圧巻。","url":"https://www.mimurotoji.com/","map":"https://www.google.com/maps/search/三室戸寺+京都","rate":4,"rg":"★京都","en":{"name":"Mimuroto-ji Temple","desc":"A temple of the Saigoku Kannon pilgrimage, famous for seasonal flowers — hydrangeas, azaleas and lotus color its grounds. An old place of worship where historic halls and flowers of every season live in harmony."}},{"area":"伏見区","name":"城南宮","desc":"方除けの神として知られる。平安時代の離宮跡にある地で、庭園には様々な草花が咲く。特に交通安全や家相、方位の災難除けへの信仰が非常に篤い。歴史的な場所での祈祷は、新しい環境や変化の中での安定を守るための拠り所となる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.jonangu.com/&ved=2ahUKEwjG06jSiNuVAxVXkq8BHfp0ED8QFnoECEgQAQ&usg=AOvVaw13PVYgmvzQu519VvxX2Z-h","map":"https://www.google.com/maps/search/城南宮+京都","rate":4,"rg":"★京都","en":{"name":"Joju-gu Shrine (Joan-gu)","desc":"Known as a shrine of protection from misfortune of direction, on the site of an ancient imperial villa; its gardens bloom through the seasons, and its prayers for traffic safety and household stability are deeply beloved."}},{"area":"伏見区","name":"大黒寺","desc":"薩摩藩の京都における拠点（藩邸）として使用された寺院。西郷隆盛らが集った歴史的舞台。薩摩藩ゆかりの石碑や史跡が点在する。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kyonoreijo.sakura.ne.jp/sh-te/5fm/st5fm-03.htm&ved=2ahUKEwi8reDe59-VAxVCh1YBHRUAPXAQFnoECDAQAQ&usg=AOvVaw28imSG4M-ZMTzRuliQtcM4","map":"https://www.google.com/maps/search/大黒寺+京都","rate":3,"rg":"★京都","en":{"name":"Daikoku-ji Temple","desc":"A temple that once served as the Kyoto residence of the Satsuma domain, where Saigo Takamori and others gathered — the grounds are dotted with monuments of Satsuma history."}},{"area":"伏見区","name":"醍醐寺","desc":"世界遺産。真言宗醍醐派総本山。広大な境内には五重塔や金堂など国宝の建築が並ぶ。かつては貴族や天皇も深く関わった歴史がある。歴史的な信仰と広大な自然が調和し、密教の深い精神が息づく、京都屈指の格式ある寺院である。","url":"https://www.daigoji.or.jp/","map":"https://www.google.com/maps/search/醍醐寺+京都","rate":5,"rg":"★京都","en":{"name":"Daigo-ji Temple","desc":"A World Heritage site and head temple of the Shingon Daigo school. Its vast grounds hold National Treasure buildings such as a five-story pagoda and the main hall — a temple of the highest standing, where nature and esoteric Buddhism breathe together."}},{"area":"伏見区","name":"桃山天満宮","desc":"伏見桃山城の近くにある神社。地域の信仰を集める場所。歴史ある街並みの中で、静かに佇んでいる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://gokounomiya.kyoto.jp/tenmangu/tenmangu.html&ved=2ahUKEwiBuJ6H6t-VAxWwrVYBHcdtM5MQFnoECD0QAQ&usg=AOvVaw1y54TClPiczTjZRCrh8IUL","map":"https://www.google.com/maps/search/桃山天満宮+京都","rate":2,"rg":"★京都","en":{"name":"Momoyama Tenmangu Shrine","desc":"A shrine near the old Fushimi Momoyama Castle, quietly gathering the devotion of the neighborhood within historic streets."}},{"area":"伏見区","name":"藤森神社","desc":"「学問と勝負の神」として信仰される。かつては伏見の地を守る重要な拠点。境内のアジサイ苑は有名で、歴史的な由緒と自然の美しさが共存している。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://fujinomorijinjya.or.jp/&ved=2ahUKEwiOwPe0tt2VAxWtk1YBHRAbI4MQFnoECFMQAQ&usg=AOvVaw1KrA2ErEIkrVELojCnNMBm","map":"https://www.google.com/maps/search/藤森神社+京都","rate":3,"rg":"★京都","en":{"name":"Fujinomori Shrine","desc":"Worshiped as a god of learning and victory, once a key guardian of Fushimi; its hydrangea garden is famous, where historic pedigree and natural beauty coexist."}},{"area":"伏見区","name":"藤森神社周辺の「墨染寺」","desc":"墨染桜で有名。日蓮宗の寺院。静かな環境の中で歴史的な伝統が受け継がれている。","url":"https://totteoki.kyoto.travel/46962/","map":"https://www.google.com/maps/search/墨染寺+京都","rate":3,"rg":"★京都","en":{"name":"Sumizen-dera Temple","desc":"Famous for its pale 'sumizome-zakura' cherry trees — a quiet Nichiren temple where tradition is passed down in calm surroundings."}},{"area":"伏見区","name":"伏見の酒蔵通り","desc":"伏見の酒造りの歴史を感じさせる通り。運河沿いに酒蔵が立ち並ぶ風景は独特。水の豊かさと酒造りの文化が共存する。","url":"https://sakeworld.jp/special/240319-kyoto-fushimi-kurameguri/","map":"https://www.google.com/maps/search/伏見酒蔵通り","rate":4,"rg":"★京都","en":{"name":"Fushimi Sake Brewery Street","desc":"A street of breweries along the canal, unique in Japan, where the richness of the water and the culture of sake brewing coexist."}},{"area":"伏見区","name":"伏見稲荷大社","desc":"全国稲荷社の総本宮。鮮やかな千本鳥居が連なる景観は世界的に有名。背後の稲荷山全体が聖域とされ、五穀豊穣、商売繁盛の神として厚い信仰を集める。山中の参道には多くの石碑や末社が点在し、歴史の重みを感じさせる厳かな雰囲気を持つ。","url":"https://inari.jp/","map":"https://www.google.com/maps/search/伏見稲荷大社+京都","rate":5,"rg":"★京都","en":{"name":"Fushimi Inari Taisha","desc":"Head shrine of all the Inari shrines of Japan, world-famous for its endless vermilion torii tunnels. The whole of Mt. Inari behind it is sacred ground, revered as a deity of bountiful harvests and business prosperity."}},{"area":"伏見区","name":"伏見桃山城","desc":"（名所として）かつての伏見城跡に建つ。模擬天守からの眺めが良く、歴史的な場所としての風情がある。地域のランドマーク。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kyoto-design.jp/spot/8665&ved=2ahUKEwiWwNPm7t-VAxV-WOsIHbA5HyUQFnoECD8QAQ&usg=AOvVaw1zEgE-0ktOsoedqRj5C1Qd","map":"https://www.google.com/maps/search/伏見桃山城+京都","rate":3,"rg":"★京都","en":{"name":"Fushimi Momoyama Castle","desc":"Standing on the site of the old Fushimi Castle; the view from its reconstructed keep and the air of history make it a local landmark."}},{"area":"伏見区","name":"明治天皇陵（伏見桃山陵）","desc":"明治天皇の御陵。広大な敷地と荘厳な雰囲気が特徴。静寂の中に歴史的な敬意と精神性が込められている。伏見の地にあって、近代日本の歴史を象徴する場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kunaicho.go.jp/visit/ryobo/122.html&ved=2ahUKEwjIh4HIpt2VAxUNr1YBHf6_NeAQFnoECBkQAQ&usg=AOvVaw2s3D2TbJHuZer4noAQYZxu","map":"https://www.google.com/maps/search/明治天皇陵+京都","rate":4,"rg":"★京都","en":{"name":"Mausoleum of Emperor Meiji","desc":"The imperial tomb of Emperor Meiji — a vast, solemn precinct where historical reverence dwells in silence, a place symbolizing the history of modern Japan here in Fushimi."}},{"area":"南区","name":"伏見稲荷大社の奥社（千本鳥居の先）","desc":"伏見稲荷大社の境内深く、稲荷山の登山口に位置する。参拝客が願いを込めて奉納する鳥居が続く道は、神秘的な雰囲気を醸し出す。お山巡りの起点であり、強い信仰のエネルギーを感じさせる場所。","url":"https://jinjafan.jp/2601658/spots/396/#google_vignette","map":"https://www.google.com/maps/search/伏見稲荷大社+奥社","rate":4,"rg":"★京都","en":{"name":"Okusha of Fushimi Inari Taisha","desc":"Set deep in the grounds at the trailhead of Mt. Inari, where worshiper-donated torii gates continue in a mystical procession — the starting point of the mountain circuit, alive with fervent devotion."}},{"area":"東山区","name":"粟田神社","desc":"東山の入り口を守る神社。旅の安全や、厄除けの神として信仰される。近くには粟田口があり、古くから京都への入り口として重要視されてきた。歴史的な守護の役割を今に伝える。","url":"https://awatajinja.jp","map":"https://www.google.com/maps/search/粟田神社+京都","rate":3,"rg":"★京都","en":{"name":"Awata Shrine","desc":"The guardian of the entrance to the Higashiyama hills, worshiped for safety in travel and protection from misfortune — an historic gateway to Kyoto since antiquity, near the old Awataguchi."}},{"area":"東山区","name":"安井金比羅宮","desc":"「縁切り縁結び」で絶大な知名度を誇る神社。碑に開いた穴をくぐり抜けることで、悪縁を切り良縁を結ぶという独特の参拝方法が特徴。常に多くの参拝客で賑わい、祈りのエネルギーが強く感じられる場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.yasui-konpiragu.or.jp/&ved=2ahUKEwjCmNzQtd2VAxXVqVYBHdHaKLIQFnoECEgQAQ&usg=AOvVaw1Vla-7Mlo4bFHQdknoUpSt","map":"https://www.google.com/maps/search/安井金比羅宮+京都","rate":4,"rg":"★京都","en":{"name":"Yasui Konpira-gu Shrine","desc":"A shrine of immense fame for 'cutting bad ties and binding good ones': worshipers crawl through the hole in the towering monument to break off ill fortune and receive good. Always busy with worshipers — a place where the energy of prayer is strongly felt."}},{"area":"東山区","name":"雲龍院","desc":"泉涌寺の塔頭。写経の寺として知られる。美しい窓から眺める庭園や四季の景色は、「悟りの窓」や「迷いの窓」として禅の精神を教えてくれる。","url":"https://www.unryuin.jp/","map":"https://www.google.com/maps/search/雲龍院+京都","rate":3,"rg":"★京都","en":{"name":"Unryu-in Temple","desc":"A sub-temple of Sennyu-ji known for sutra copying. Its famous framed windows — the 'window of enlightenment' and the 'window of illusion' — teach the Zen spirit through garden and seasonal views."}},{"area":"東山区","name":"円山公園","desc":"京都市内で最も古い公園の一つ。枝垂れ桜が有名。歴史的なイベントや、季節の移ろいを楽しむ市民の公園として愛される。","url":"https://www.jalan.net/kankou/spt_26105ah3330043690/","map":"https://www.google.com/maps/search/円山公園","rate":3,"rg":"★京都","en":{"name":"Maruyama Park","desc":"One of the oldest parks in Kyoto, famous for its great weeping cherry — a public park loved for its seasonal beauty and historic events."}},{"area":"東山区","name":"円山公園周辺の「祇園白川」","desc":"（名所として）京都らしい景観を代表する場所。柳と川と古い町並みが美しい。歴史と文化が調和する。","url":"https://souda-kyoto.jp/guide/spot/gionshirakawa.html","map":"https://www.google.com/maps/search/祇園白川","rate":5,"rg":"★京都","en":{"name":"Gion Shirakawa","desc":"One of the scenes that define Kyoto: willows, a clear stream and old townhouses in perfect harmony of history and culture."}},{"area":"東山区","name":"祇園花見小路","desc":"京都の伝統的な遊興の地。お茶屋が建ち並び、舞妓・芸妓の文化を今に伝える。歴史的な街並みと文化が色濃く残る。","url":"https://www.gltjp.com/ja/directory/item/12624/","map":"https://www.google.com/maps/search/花見小路","rate":4,"rg":"★京都","en":{"name":"Hanamikoji Street, Gion","desc":"Kyoto's traditional pleasure quarter, lined with tea houses where the culture of the maiko and geiko lives on — historic streetscapes preserved in depth."}},{"area":"東山区","name":"建仁寺","desc":"京都最古の禅寺。栄西が開山した臨済宗建仁寺派の大本山。法堂の天井画「双龍図」は圧巻。庭園は枯山水「大雄苑」などで有名で、禅僧の修行の場としての静謐さを保ちつつ、芸術的な価値も高い。多くの襖絵が寺の格式と歴史を物語る。","url":"https://www.kenninji.jp/","map":"https://www.google.com/maps/search/建仁寺+京都","rate":4,"rg":"★京都","en":{"name":"Kennin-ji Temple","desc":"The oldest Zen temple in Kyoto, head temple of the Rinzai Kennin-ji school founded by the monk Eisai. The twin-dragon ceiling of the Dharma hall overwhelms; the dry garden Daiyuen and countless screen paintings speak of the temple's rank, history and artistic worth, held in the quiet of a working monastery."}},{"area":"東山区","name":"高台寺","desc":"豊臣秀吉の正室・ねねが秀吉の菩提を弔うために開創。当時の繁栄を伝える豪華な蒔絵（高台寺蒔絵）や、庭園の四季の美しさが特徴。伏見城から移築された茶室や、竹林の小径などが見どころ。秀吉とねねの深い絆を感じさせる歴史の舞台。","url":"https://www.kodaiji.com/","map":"https://www.google.com/maps/search/高台寺+京都","rate":4,"rg":"★京都","en":{"name":"Kodai-ji Temple","desc":"Founded by Nene, wife of Toyotomi Hideyoshi, for his memorial. Famous for the lavish 'Kodai-ji maki-e' lacquer and the beauty of its gardens in every season, with a tea room moved from Fushimi Castle and a bamboo grove path — a stage of history carrying the deep bond of Hideyoshi and Nene."}},{"area":"東山区","name":"三十三間堂","desc":"妙法院境外仏堂。1001体の観音像が並ぶ姿は仏像彫刻の宝庫。平安時代から鎌倉時代にかけての仏像を数多く収蔵している。長大な本堂建築自体も歴史的価値が高く、慈悲の信仰が深く息づく、仏教美術における重要な拠点の一つ。","url":"https://sanjusangendo.jp/","map":"https://www.google.com/maps/search/三十三間堂+京都","rate":5,"rg":"★京都","en":{"name":"Sanjusangen-do Temple","desc":"The outer hall of Myoho-in, home to 1,001 statues of Kannon — a treasury of Buddhist sculpture from the Heian and Kamakura eras, housed within a long historic hall of great architectural value."}},{"area":"東山区","name":"産寧坂（三年坂）","desc":"清水寺への参道として知られる。伝統的な街並みが残り、多くの土産物店や茶屋が並ぶ。京都らしい雰囲気を最も強く感じられる場所の一つ。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.gion.or.jp/around/%23!/%25E4%25BA%258C%25E5%25B9%25B4%25E5%259D%2582%25E3%2583%25BB%25E4%25B8%2589%25E5%25B9%25B4%25E5%259D%2582/&ved=2ahUKEwiI2pH1p92VAxWSgFYBHZQhBAAQFnoFCIEBEAE&usg=AOvVaw1v_Ys1MyiWIsxN4B2njC74","map":"https://www.google.com/maps/search/産寧坂","rate":4,"rg":"★京都","en":{"name":"Sannen-zaka Slope","desc":"The celebrated approach to Kiyomizu-dera, lined with traditional houses, craft shops and tea rooms — one of the places where the atmosphere of Kyoto is felt most strongly."}},{"area":"東山区","name":"新熊野神社","desc":"後白河法皇が熊野の地を模して創建。熊野詣の拠点として歴史を持つ。厄除けや健康長寿の神として親しまれ、境内の大樟が印象的。","url":"https://genpei.sakura.ne.jp/genpei-shiseki/imakumanojinjya/","map":"https://www.google.com/maps/search/新熊野神社+京都","rate":3,"rg":"★京都","en":{"name":"Imakumano Shrine","desc":"Founded by the retired emperor Goshirakawa as a replica of the Kumano holy sites, long a base of Kumano pilgrimage; beloved as a deity of health and longevity, with a great camphor tree dominating the grounds."}},{"area":"東山区","name":"新熊野神社周辺の「泉涌寺」","desc":"皇室ゆかりの「御寺（みてら）」。歴代天皇の陵墓が並ぶ歴史的な格式高い寺院。境内の静けさと、広大な敷地が伝える精神的な重みは格別。","url":"https://www.mitera.org/","map":"https://www.google.com/maps/search/泉涌寺+京都","rate":5,"rg":"★京都","en":{"name":"Sennyu-ji Temple","desc":"The 'Mitera,' a temple deeply tied to the Imperial family, where the tombs of successive emperors lie. The silence and vast grounds convey a singular spiritual weight."}},{"area":"東山区","name":"清水寺","desc":"北法相宗の本山であり世界遺産。懸造りの「清水の舞台」は釘を使わずに建てられた歴史的建築物。音羽山中腹に位置し、音羽の滝の清らかな水が流れ落ちる。平安時代からの参詣の歴史を持ち、古都の景観を一望できる場所として名高い。","url":"https://www.kiyomizudera.or.jp/","map":"https://www.google.com/maps/search/清水寺+京都","rate":5,"rg":"★京都","en":{"name":"Kiyomizu-dera Temple","desc":"A World Heritage temple and head temple of the Hokuso sect, famous for its great wooden stage built without a single nail. Since the Heian era pilgrims have come to its clear Otowa waterfall and sweeping views over the old capital."}},{"area":"東山区","name":"清水寺の周辺（音羽の滝）","desc":"清水寺の境内にある滝。三筋に分かれた水は、それぞれに願いが込められている。歴史ある清水寺の信仰の核心とも言える場所。","url":"https://thegate12.com/jp/article/433","map":"https://www.google.com/maps/search/音羽の滝+京都","rate":5,"rg":"★京都","en":{"name":"Otowa Waterfall","desc":"The waterfall within the grounds of Kiyomizu-dera. Its three streams each carry a different blessing — the very heart of the temple's centuries of devotion."}},{"area":"東山区","name":"青蓮院門跡","desc":"天台宗の門跡寺院。大楠の並ぶ門前は京都のシンボル的な景観の一つ。庭園の美しさと、夜のライトアップの幻想的な雰囲気で人気。歴史的な風格と洗練された美しさが共存する。","url":"https://www.shorenin.com/","map":"https://www.google.com/maps/search/青蓮院門跡+京都","rate":4,"rg":"★京都","en":{"name":"Shoren-in Temple","desc":"A Tendai monzeki temple of imperial lineage; the giant camphor trees before its gate are one of Kyoto's signature views. Popular for its beautiful garden and fantastic evening illuminations — historic dignity and refinement together."}},{"area":"東山区","name":"知恩院","desc":"浄土宗総本山。巨大な三門は国宝。御影堂などの大規模な建築物が並ぶ。広大な境内の各所には歴史的な価値を持つ建造物や庭園が配置されており、浄土宗の信仰の拠点として、多くの人々に門を開いている。徳川家の菩提寺として関わりが深い。","url":"https://www.chion-in.or.jp/","map":"https://www.google.com/maps/search/知恩院+京都","rate":4,"rg":"★京都","en":{"name":"Chion-in Temple","desc":"Head temple of the Jodo school. Its colossal Sanmon gate is a National Treasure, and grand halls such as the Goeido spread across vast grounds — a center of Pure Land faith closely tied to the Tokugawa family, open to all."}},{"area":"東山区","name":"智積院","desc":"真言宗智山派の総本山。長谷川等伯一門による国宝の障壁画が非常に有名。また、境内の広大な庭園は四季折々の風景が楽しめる。","url":"https://souda-kyoto.jp/guide/spot/chishakuin.html","map":"https://www.google.com/maps/search/智積院+京都","rate":4,"rg":"★京都","en":{"name":"Chishaku-in Temple","desc":"Head temple of the Shingon Chizan school, famed for National Treasure screen paintings by the school of Hasegawa Tohaku; its spacious garden is beautiful in every season."}},{"area":"東山区","name":"長楽寺","desc":"平家物語ゆかりの寺。建礼門院が隠棲した場所。庭園の美しさと無常の歴史が重なる場所で、深い静寂を感じさせる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.chorakuji.or.jp/&ved=2ahUKEwj8mOndnt6VAxX_hlYBHa1cLzIQFnoECBcQAQ&usg=AOvVaw3oxldB1cD-DdJFzy_yTK5Z","map":"https://www.google.com/maps/search/長楽寺+京都","rate":3,"rg":"★京都","en":{"name":"Choraku-ji Temple","desc":"A temple tied to the Tale of the Heike, where the nun Kenreimon'in lived in retreat — a place where garden beauty and the pathos of history overlap in deep quiet."}},{"area":"東山区","name":"長楽寺周辺の「安養寺」","desc":"浄土宗の寺院。静かな環境で、歴史的な余韻を感じられる場所。地域の歴史の一部として大切にされている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.bansyouzan-anyouji.info/&ved=2ahUKEwje2LuAnt6VAxWmslYBHb6_K50QFnoECBgQAQ&usg=AOvVaw1NG2QcuD9e4oluN0U2CMVi","map":"https://www.google.com/maps/search/安養寺+京都","rate":3,"rg":"★京都","en":{"name":"Anyo-ji Temple","desc":"A Jodo temple in quiet surroundings, cherished as part of the district's history."}},{"area":"東山区","name":"南禅寺塔頭・天授庵","desc":"南禅寺の塔頭の一つ。書院の前に広がる庭園は、紅葉の名所として知られる。禅寺ならではの静かな環境で、池を囲む美しい空間が特徴。秋の夜間のライトアップも見事。禅の精神と自然の美しさが調和した空間。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://souda-kyoto.jp/guide/spot/nanzenji-tenjuan.html&ved=2ahUKEwidjtWLjNuVAxWYm68BHaU7FXQQFnoECFIQAQ&usg=AOvVaw3LsAWJEPlCkwfp1GU2UrUE","map":"https://www.google.com/maps/search/天授庵+京都","rate":3,"rg":"★京都","en":{"name":"Tenjuan Temple (Nanzen-ji)","desc":"A sub-temple of Nanzen-ji, its garden spreading before the study hall — famed for autumn colors and beautiful evening illuminations, a space where Zen spirit and natural beauty meet."}},{"area":"東山区","name":"日向大神宮","desc":"「京の伊勢」と称される。山間にあり、伊勢神宮と同じ神々を祀る。天の岩戸があり、パワースポットとして知られる。静寂の中で深遠な自然と信仰を感じられる場所。","url":"https://www.leafkyoto.net/store/221222-kyoto-himukaidaijingu/","map":"https://www.google.com/maps/search/日向大神宮+京都","rate":3,"rg":"★京都","en":{"name":"Hyuga Daijingu","desc":"Called 'the Ise of Kyoto,' a mountain shrine enshrining the same deities as Ise Jingu, with its Ama-no-Iwato rock — a secluded place of deep nature and faith."}},{"area":"東山区","name":"八坂神社","desc":"素戔嗚尊を祀る、全国の祇園社の総本社。大晦日の「をけら詣り」では、境内の灯籠の火を吉兆縄に移して持ち帰り、その火で雑煮を炊くと無病息災で過ごせると伝わる。厄除けの信仰が篤く、朱塗りの西楼門は京都の景観を象徴する。古くから「祇園さん」として親しまれる。7月の祇園祭は平安時代から続く疫病退散を祈る祭礼。厄除け・疫病退散の信仰が非常に強く、街の守り神として絶大な信頼を寄せられている。","url":"https://www.yasaka-jinja.or.jp/","map":"https://www.google.com/maps/search/八坂神社+京都","rate":5,"rg":"★京都","en":{"name":"Yasaka Shrine","desc":"Head shrine of the Yasaka (Gion) shrines of Japan, enshrining Susanoo. Deeply revered as the guardian of the city, its vermilion west gate is an icon of Kyoto, and its Gion Matsuri in July — a plague-quelling festival dating to the Heian era — is among the great festivals of the world."}},{"area":"東山区","name":"法観寺（八坂の塔）","desc":"聖徳太子が創建したと伝わる臨済宗建仁寺派の寺院。五重塔は「八坂の塔」として親しまれ、東山の街並みを象徴する景観。塔の内部を拝観することができ、木造の構造を間近で見ることができる。歴史的な街並みとの調和が非常に美しい。","url":"https://www.uniquevenuesofjapan.com/blog/place_list/houkanji/","map":"https://www.google.com/maps/search/法観寺+京都","rate":3,"rg":"★京都","en":{"name":"Hokan-ji (Yasaka Pagoda)","desc":"A Rinzai temple of the Kennin-ji school said to be founded by Prince Shotoku. Its five-story pagoda, beloved as 'Yasaka-no-to,' is the symbol of the Higashiyama skyline; the interior is open, letting you see the wooden structure up close in beautiful harmony with the old streets."}},{"area":"東山区","name":"法住寺","desc":"後白河法皇の院御所「法住寺殿」があった場所。法皇ゆかりの歴史が色濃く残る。平家物語の舞台としても有名。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://hojyuji.jp/&ved=2ahUKEwjVkLfl6N-VAxULk1YBHe5wGxoQFnoECD8QAQ&usg=AOvVaw3CLqxl2x5k47T74PoFl4qV","map":"https://www.google.com/maps/search/法住寺+京都","rate":3,"rg":"★京都","en":{"name":"Hoji-ji Temple","desc":"The site of Hojuji-den, the palace of the retired emperor Goshirakawa — steeped in his history and famous as a stage of the Tale of the Heike."}},{"area":"東山区","name":"豊国神社","desc":"豊臣秀吉を祀る。豪華な唐門は国宝。伏見城の遺構と伝えられる。秀吉の栄華を今に伝える場所であり、歴史的な威厳を感じさせる。秀吉ファンや歴史好きが訪れる聖地の一つ。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://toyokuni-kyoto.jp/&ved=2ahUKEwj6vuCupt2VAxVEjVYBHVMSLaMQFnoECBwQAQ&usg=AOvVaw2sTAcNKvNanUaRAypU9vYx","map":"https://www.google.com/maps/search/豊国神社+京都","rate":3,"rg":"★京都","en":{"name":"Hokoku Shrine","desc":"Enshrining Toyotomi Hideyoshi; its lavish kara-mon gate is a National Treasure said to be a remnant of Fushimi Castle — a place conveying Hideyoshi's glory and dignity, a mecca for his admirers."}},{"area":"東山区","name":"養源院","desc":"豊臣秀吉の正室・淀殿が父・浅井長政を弔うために建立。俵屋宗達による障壁画が有名。血天井と呼ばれる悲劇の歴史も伝える場所。歴史の重みと芸術が同居する独特の空間。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://yougenin.jp/index.html&ved=2ahUKEwidgK-bpt2VAxVDrlYBHTgiBYwQFnoECEwQAQ&usg=AOvVaw0Dfy7dcWu6GrgMo88G2gvl","map":"https://www.google.com/maps/search/養源院+京都","rate":3,"rg":"★京都","en":{"name":"Yogen-in Temple","desc":"Founded by Yodo-dono, wife of Hideyoshi, in memory of her father Azai Nagamasa; famous for screen paintings by Tawaraya Sotatsu and the 'blood-stained ceiling' of a tragic past — a space where art and the weight of history coexist."}},{"area":"東山区","name":"六道珍皇寺","desc":"小野篁が冥界へ通ったとされる井戸がある。独特の信仰の物語を持つ。歴史的な神秘性と静寂が同居する。","url":"https://www.rokudou.jp/","map":"https://www.google.com/maps/search/六道珍皇寺+京都","rate":4,"rg":"★京都","en":{"name":"Rokudo Chinno-ji Temple","desc":"Home to the well through which the courtier Ono no Takamura was said to travel to the underworld — a temple of unique legend, mystery and quiet."}},{"area":"東山区","name":"六道珍皇寺周辺の「建仁寺」再掲調整：周辺の「六波羅蜜寺」","desc":"空也上人ゆかりの寺。歴史的な仏像が多く安置されている。地域の深い信仰を今に伝える。","url":"https://rokuhara.or.jp/","map":"https://www.google.com/maps/search/六波羅蜜寺+京都","rate":4,"rg":"★京都","en":{"name":"Rokuharamitsu-ji Temple","desc":"A temple of the priest Kuya, housing many historic Buddhist statues and conveying the district's deep faith."}},{"area":"東山区","name":"六波羅蜜寺","desc":"空也上人が開創。運慶・快慶らによる仏像彫刻が多く伝わる。口から念仏が出る「空也上人像」が有名。かつては平家の邸宅があった地であり、中世の信仰と文化の足跡を感じさせる。病気平癒や難局を乗り越えるための信仰の場として知られる。","url":"https://rokuhara.or.jp/","map":"https://www.google.com/maps/search/六波羅蜜寺+京都","rate":4,"rg":"★京都","en":{"name":"Rokuharamitsu-ji Temple","desc":"Founded by the priest Kuya, preserving statues by Unkei and Kaikei, including the famous Kuya portrait with Buddhas streaming from his mouth. Once the site of Taira mansions, it carries the traces of medieval faith and culture, and is known as a place of prayer for healing."}},{"area":"中京区","name":"京都御所","desc":"明治維新まで歴代天皇の居住地。広大な敷地内には紫宸殿や清涼殿など、平安時代の内裏の格式を伝える建築物が並ぶ。伝統的な建築様式と庭園美が調和しており、古都の中枢として、かつての皇室の生活と歴史を色濃く残している。","url":"https://sankan.kunaicho.go.jp/","map":"https://www.google.com/maps/search/京都御所+京都","rate":3,"rg":"★京都","en":{"name":"Kyoto Imperial Palace","desc":"Residence of the emperors until the Meiji Restoration; the Shishinden and Seiryoden convey the dignity of the ancient imperial palace amid traditional architecture and gardens — the historic heart of the old capital."}},{"area":"中京区","name":"京都国際マンガミュージアム（旧龍池小学校）","desc":"廃校となった小学校を利用した施設。近代的な日本の文化であるマンガをテーマにした拠点。歴史的な建物と新しい文化の融合を見せる場所。","url":"https://kyotomm.jp/","map":"https://www.google.com/maps/search/京都国際マンガミュージアム","rate":3,"rg":"★京都","en":{"name":"Kyoto International Manga Museum","desc":"A museum in a former elementary school, a hub for manga — a modern Japanese culture — where a historic building and new culture meet."}},{"area":"中京区","name":"京都府庁旧本館","desc":"（名所として）明治時代の歴史的な洋風建築。美しい中庭と建築様式が特徴的。京都のモダンな歴史の面影を残す。","url":"https://www.pref.kyoto.jp/qhonkan/1214473296472.html","map":"https://www.google.com/maps/search/京都府庁旧本館","rate":3,"rg":"★京都","en":{"name":"Former Kyoto Prefectural Office","desc":"A historic Meiji-era Western-style building, noted for its beautiful courtyard and architecture — a remnant of Kyoto's modern history."}},{"area":"中京区","name":"京都文化博物館（旧日本銀行京都支店）","desc":"（名所として）近代建築の傑作。京都の文化と歴史を学ぶ拠点。建物自体に歴史的な価値がある。","url":"https://www.bunpaku.or.jp/","map":"https://www.google.com/maps/search/京都文化博物館","rate":4,"rg":"★京都","en":{"name":"The Museum of Kyoto","desc":"Housed in a masterpiece of modern architecture (the former Bank of Japan Kyoto branch), a place to learn Kyoto's culture and history — the building itself is of historic value."}},{"area":"中京区","name":"錦市場","desc":"「京都の台所」として知られる。歴史は古く、多くの食文化を支えてきた。地域の食文化と人々の生活の活気を今に伝える。","url":"https://www.kyoto-nishiki.or.jp/","map":"https://www.google.com/maps/search/錦市場","rate":4,"rg":"★京都","en":{"name":"Nishiki Market","desc":"Known as 'Kyoto's kitchen,' with roots reaching far back and supporting the city's food culture — a lively market conveying the vitality of local life and cuisine."}},{"area":"中京区","name":"錦天満宮","desc":"錦市場の商店街の中に位置するユニークな神社。菅原道真公を祀り、多くの商売人や観光客が参拝する。市場の活気と信仰が一体化した場所。","url":"https://nishikitenmangu.or.jp/","map":"https://www.google.com/maps/search/錦天満宮+京都","rate":3,"rg":"★京都","en":{"name":"Nishiki Tenmangu Shrine","desc":"A unique shrine within the Nishiki market arcade, enshrining Sugawara no Michizane; merchants and travelers alike worship here, where market bustle and faith merge."}},{"area":"中京区","name":"元離宮二条城（二の丸御殿・庭園）","desc":"世界遺産。徳川家康が築城した、江戸幕府の象徴。壮大な建築と庭園は、権力と美の融合。歴史の舞台となった場所であり、古都・京都の歴史的景観の核を成す。","url":"https://nijo-jocastle.city.kyoto.lg.jp/introduction/highlights/teien/","map":"https://www.google.com/maps/search/二条城+京都","rate":5,"rg":"★京都","en":{"name":"Nijo Castle","desc":"A World Heritage castle built by Tokugawa Ieyasu, the symbol of the Edo shogunate. Its grand palace and gardens fuse power and beauty, and its halls staged the great turning points of Japanese history."}},{"area":"中京区","name":"御金神社","desc":"金属・金運の神を祀る。金色に輝く鳥居が目印。資産運用や商売繁盛を願う多くの参拝客で賑わう。現代社会における金銭的な平穏を願う場として、独自の信仰を集めている。","url":"https://mikane-jinja.or.jp/","map":"https://www.google.com/maps/search/御金神社+京都","rate":4,"rg":"★京都","en":{"name":"Mikane Shrine","desc":"A shrine of metals and good fortune in money, marked by its gilded torii — busy with worshipers praying for financial well-being and business prosperity."}},{"area":"中京区","name":"神泉苑","desc":"平安京の禁苑であった場所。かつては広大な池で雨乞いの儀式が行われた。現在は水神を祀り、願い事を一つだけ叶えてくれるという伝説がある。都会の真ん中にありながら古の儀式の気配が残り、歴史的・信仰的な神秘性を色濃く持っている。","url":"https://www.shinsenen.org/","map":"https://www.google.com/maps/search/神泉苑+京都","rate":3,"rg":"★京都","en":{"name":"Shinsen-en Garden","desc":"The former forbidden garden of Heian-kyo, once the site of rain-making rites on its great pond. Now a shrine of the water god with a legend of granting one wish — a pocket of ancient mystery in the very center of the city."}},{"area":"中京区","name":"壬生寺","desc":"新選組ゆかりの寺として非常に有名。幕末には境内で兵法調練が行われた。節分会などの伝統行事も活発で、歴史的な物語と地域コミュニティの信仰が調和している。壬生狂言は重要無形民俗文化財。","url":"https://www.mibudera.com/","map":"https://www.google.com/maps/search/壬生寺+京都","rate":4,"rg":"★京都","en":{"name":"Mibu-dera Temple","desc":"Famed for its ties to the Shinsengumi, who drilled in its grounds at the end of the Edo era. Active traditional events such as Setsubun, and the Mibu Kyogen — an Important Intangible Folk Cultural Property — blend historic story and community faith."}},{"area":"中京区","name":"壬生寺周辺の「元祇園 梛神社」","desc":"祇園祭のルーツの一つとも伝わる歴史ある神社。地域の守り神として大切にされている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://motogion-nagijinja.or.jp/&ved=2ahUKEwiur-qn69-VAxX_m1YBHQdLGbsQFnoECEEQAQ&usg=AOvVaw24bOmGNW1gudI_VHucx2Y7","map":"https://www.google.com/maps/search/梛神社+京都","rate":3,"rg":"★京都","en":{"name":"Motoyasaka Nagi Shrine","desc":"An old shrine said to be one of the roots of the Gion Matsuri, cherished as the guardian deity of its neighborhood."}},{"area":"中京区","name":"誓願寺","desc":"浄土宗西山深草派の総本山。落語家などが参拝する「芸の神」としても有名。観阿弥、世阿弥ゆかりの場所でもあり、伝統芸能との繋がりが深い。信仰の場としてだけでなく、文化芸術の発展を支えてきた歴史がある。","url":"https://go-seiganji.or.jp","map":"https://www.google.com/maps/search/誓願寺+京都","rate":3,"rg":"★京都","en":{"name":"Seigan-ji Temple","desc":"Head temple of the Jodo Seizan Fukakusa school, famous as a shrine of the arts visited by rakugo performers; tied to the performers Kan'ami and Zeami — a temple that has long supported traditional performing arts."}},{"area":"中京区","name":"先斗町","desc":"鴨川と高瀬川の間に位置する歴史ある歓楽街。独特の風情ある路地は、夜の京都を彩る重要な景観となっている。","url":"https://sakuto.jp/blog/pontocho/","map":"https://www.google.com/maps/search/先斗町","rate":4,"rg":"★京都","en":{"name":"Pontocho","desc":"A historic entertainment quarter between the Kamo and Takase rivers; its distinctive atmospheric alleys are an essential nightscape of Kyoto."}},{"area":"中京区","name":"頂法寺（六角堂）","desc":"聖徳太子が創建。本堂が六角形をしていることから六角堂と呼ばれる。華道家元池坊の発祥の地としても知られる。街の中心部にありながら、静かな空間を保っている。隣接するビルとのコントラストが現代の京都を象徴する光景となっている。","url":"https://www.ikenobo.jp/rokkakudo/","map":"https://www.google.com/maps/search/六角堂+京都","rate":3,"rg":"★京都","en":{"name":"Choho-ji (Rokkaku-do)","desc":"Founded by Prince Shotoku and named Rokkaku-do for its hexagonal main hall; also the birthplace of the Ikenobo school of flower arrangement. It keeps a quiet calm in the very center of town — its contrast with the neighboring buildings a symbol of Kyoto today."}},{"area":"中京区","name":"二条城","desc":"徳川家康が築城した城郭。二の丸御殿は国宝であり、豪華絢爛な障壁画や彫刻で飾られている。大政奉還の舞台として、日本の歴史が大きく動いた場所。江戸時代の武家文化の頂点を体現する建築群と庭園は、世界遺産として名高い。","url":"https://nijo-jocastle.city.kyoto.lg.jp/","map":"https://www.google.com/maps/search/二条城+京都","rate":4,"rg":"★京都","en":{"name":"Nijo Castle","desc":"The castle built by Tokugawa Ieyasu; the National Treasure Ninomaru Palace glitters with screen paintings and carvings, and its halls staged the return of power to the emperor — a World Heritage embodying the summit of Edo-period warrior culture."}},{"area":"中京区","name":"二条陣屋","desc":"二条城の近くにある歴史的な町家。江戸時代の建築や歴史を色濃く残す。かつての京都の暮らしの様相を伝える貴重な文化遺産。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://nijyojinya.net/&ved=2ahUKEwjdoISGut2VAxVusVYBHTEQAOAQFnoECEIQAQ&usg=AOvVaw3CtEWZi9H3RO6mbBf1SB-S","map":"https://www.google.com/maps/search/二条陣屋+京都","rate":3,"rg":"★京都","en":{"name":"Nijo Jinya (Ogi House)","desc":"A historic merchant house near Nijo Castle, preserving Edo-period architecture and the atmosphere of old Kyoto life — a precious cultural heritage."}},{"area":"中京区","name":"武信稲荷神社","desc":"平安時代創建。境内の榎は樹齢約800年。坂本龍馬ゆかりの地として歴史ファンに知られる。住宅街の中にありながら、地域の守り神として深く愛されている。","url":"https://takenobuinari.jp/","map":"https://www.google.com/maps/search/武信稲荷神社+京都","rate":3,"rg":"★京都","en":{"name":"Takeshin Inari Shrine","desc":"Founded in the Heian era; its grounds hold an elm about 800 years old. Known to history fans for its ties to Sakamoto Ryoma, it is deeply loved as a local guardian amid a residential district."}},{"area":"中京区","name":"本能寺","desc":"織田信長ゆかりの寺。本能寺の変の舞台。歴史の激動を感じさせる場所であり、現在は信長公廟所が置かれている。街中にありながら、歴史の重層的な記憶を留める地として、多くの参拝者が訪れる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kyoto-honnouji.jp/&ved=2ahUKEwi7x7vbjtuVAxVQgK8BHVMCLp8QFnoECCUQAQ&usg=AOvVaw2outo89U4eSCWMe1nbtGnq","map":"https://www.google.com/maps/search/本能寺+京都","rate":4,"rg":"★京都","en":{"name":"Honno-ji Temple","desc":"The temple of Oda Nobunaga and the stage of the Honno-ji Incident — a place that stirs the sense of history's turning points, now holding Nobunaga's memorial, drawing many worshipers even in the middle of town."}},{"area":"中京区","name":"六角堂（頂法寺）","desc":"生け花発祥の地。聖徳太子ゆかりの寺で、街の真ん中に位置する。本堂が六角形をしているのが特徴。都市の風景の中にありながら、歴史と伝統を今に伝える重要な場所。","url":"https://www.ikenobo.jp/rokkakudo/","map":"https://www.google.com/maps/search/六角堂+京都","rate":4,"rg":"★京都","en":{"name":"Rokkaku-do (Choho-ji)","desc":"The birthplace of ikebana — a temple tied to Prince Shotoku in the middle of the city, its hexagonal main hall its mark: an important place carrying history and tradition within the urban landscape."}},{"area":"西京区","name":"華厳寺（鈴虫寺）","desc":"臨済宗の寺院。一年を通じて鈴虫の音色を聞くことができる。住職のユニークな説法が非常に人気。幸福を授かる「幸福地蔵」が有名で、願い事をするために多くの人が訪れる。独自の工夫で人々の心に寄り添う、新しい形の信仰の場所。","url":"https://www.takenotera-jizoin.jp","map":"https://www.google.com/maps/search/鈴虫寺+京都","rate":4,"rg":"★京都","en":{"name":"Suzumushi-dera Temple","desc":"A Rinzai temple where the song of bell crickets sounds all year round; the head priest's lively talks are hugely popular. Its 'happy Jizo' grants wishes, drawing many visitors — a place of faith with a warm, original touch."}},{"area":"西京区","name":"月読神社","desc":"日本最古の月神の社と伝わる。安産や縁結びの神として知られる。松尾大社の摂社であり、歴史的な関わりが深い。","url":"https://k-saaya.com/月読神社/","map":"https://www.google.com/maps/search/月読神社+京都","rate":3,"rg":"★京都","en":{"name":"Tsukiyomi Shrine","desc":"Said to be Japan's oldest shrine of the moon deity, known for blessings of childbirth and matchmaking — a massha of Matsuo Taisha with deep historic ties."}},{"area":"西京区","name":"松尾大社","desc":"酒造りの神として有名。境内からは雄大な嵐山の自然を背景に、神聖な空気が漂う。京都最古級の神社の一つとして歴史的価値が高い。","url":"https://www.matsunoo.or.jp/","map":"https://www.google.com/maps/search/松尾大社+京都","rate":5,"rg":"★京都","en":{"name":"Matsuo Taisha","desc":"Famous as the shrine of sake brewing, set against the grand nature of Arashiyama — one of the oldest shrines of Kyoto, of high historic value."}},{"area":"西京区","name":"松尾大社周辺の「月読神社」","desc":"再掲調整：周辺の「鈴虫寺（華厳寺）」。四季を通じて鈴虫の鳴き声が聞こえることで有名な寺院。説法が人気で、多くの参拝客が訪れる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.matsunoo.or.jp/tukiyomi/index/&ved=2ahUKEwjB4prk7N-VAxUaslYBHTriCtYQFnoECCoQAQ&usg=AOvVaw0fST1rihmXiPVuKZMT9-Bi","map":"https://www.google.com/maps/search/鈴虫寺+京都","rate":4,"rg":"★京都","en":{"name":"Tsukiyomi Shrine (near Matsuo Taisha)","desc":"The entry also points to the nearby Suzumushi-dera (Kegon-ji), a temple famous for the song of bell crickets through the seasons, whose popular talks draw many worshipers."}},{"area":"西京区","name":"正法寺","desc":"真言宗の寺院。石庭が美しく、「鳥獣の石庭」と呼ばれる。静寂の中に禅の心を感じる場所。周囲の自然環境と調和した佇まいが魅力。","url":"https://kyoto-shoboji.com","map":"https://www.google.com/maps/search/正法寺+京都","rate":3,"rg":"★京都","en":{"name":"Shobo-ji Temple","desc":"A Shingon temple with a beautiful rock garden called the 'garden of birds and beasts' — a place to feel Zen stillness amid harmonious nature."}},{"area":"西京区","name":"西芳寺（苔寺）","desc":"世界遺産。事前予約制で、庭園を埋め尽くす苔の美しさは「緑の絨毯」と称される。精神統一の写経の時間が、より一層静寂を深める。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://saihoji-kokedera.com/&ved=2ahUKEwichpLo6d-VAxXCr1YBHRfyCYEQFnoECEoQAQ&usg=AOvVaw1P7V7w6sBkJXWBM1q2gIRc","map":"https://www.google.com/maps/search/西芳寺+京都","rate":5,"rg":"★京都","en":{"name":"Saiho-ji 'Moss Temple'","desc":"A World Heritage temple visited by reservation only; its gardens, carpeted in moss, are celebrated as a 'green velvet,' deepened in stillness by a session of sutra copying."}},{"area":"西京区","name":"善峯寺","desc":"西山の中腹に位置する山寺。広大な境内からは京都市内を一望できる。五葉松や長い参道が有名。歴史的な修験の山としての風格を持ち、自然の厳しさと美しさが同居する。","url":"https://www.yoshiminedera.com/","map":"https://www.google.com/maps/search/善峯寺+京都","rate":4,"rg":"★京都","en":{"name":"Yoshimine-dera Temple","desc":"A mountain temple on the slopes of the western hills, with vast grounds overlooking the whole city, famous for its five-needled pines and long approach — a historic mountain of ascetic practice where harsh nature and beauty coexist."}},{"area":"西京区","name":"苔寺（西芳寺）","desc":"世界遺産。庭園一面を覆う苔の美しさで有名。現在は事前申し込み制での拝観となっている。禅の精神を具現化した庭園は、静寂の中で深い精神性を感じさせる。苔の緑と季節の移ろいが見せる美しさは、他に比べるものがない。","url":"https://saihoji-kokedera.com/","map":"https://www.google.com/maps/search/西芳寺+京都","rate":5,"rg":"★京都","en":{"name":"Koke-dera (Saiho-ji)","desc":"A World Heritage temple famous for the moss that covers its entire garden (viewing by advance reservation). Its Zen garden embodies quiet spiritual depth — a beauty of moss and seasons without equal."}},{"area":"西京区","name":"大原野神社","desc":"春日大社の分霊を祀る。京の春日と称される。広大な境内は四季折々の自然に彩られ、特に紅葉が美しい。歴史的な由緒と自然が調和する名社。","url":"https://oharano-jinja.jp/","map":"https://www.google.com/maps/search/大原野神社+京都","rate":3,"rg":"★京都","en":{"name":"Oharano Shrine","desc":"Enshrining a divided spirit of Kasuga Taisha, honored as 'the Kasuga of Kyoto'; its spacious grounds are colored through the seasons, especially beautiful in autumn — a great shrine where history and nature blend."}},{"area":"西京区","name":"地蔵院（竹の寺）","desc":"臨済宗の寺院。境内には美しい竹林があり、「竹の寺」として知られる。一休宗純が幼少期を過ごした場所とも伝えられる。静寂の中で竹の揺れる音を聞きながら、禅の教えに浸ることができる場所。","url":"https://takenotera-jizoin.jp/","map":"https://www.google.com/maps/search/地蔵院+京都","rate":3,"rg":"★京都","en":{"name":"Jizo-in 'Bamboo Temple'","desc":"A Rinzai temple known as the 'bamboo temple' for the lovely grove in its grounds, said to be where the young Ikkyu spent time — a place to steep in Zen teaching to the sound of swaying bamboo."}},{"area":"右京区","name":"法輪寺","desc":"虚空蔵菩薩を祀り、知恵を授かる寺として有名。「十三まいり」の場所として知られ、知恵や幸運を願う参拝客が絶えない。嵐山の高台に位置し、市内を一望できる景観が美しい。知的な成長や学問成就の信仰が非常に篤い。","url":"https://www.kokuzohourinji.com/","map":"https://www.google.com/maps/search/法輪寺+京都","rate":3,"rg":"★京都","en":{"name":"Horin-ji Temple (Arashiyama)","desc":"A temple of Kokuzo Bosatsu famed for granting wisdom and the home of the 'thirteen-visit' coming-of-age custom, always busy with prayers for intelligence and luck. On a rise above Arashiyama with beautiful views over the city — faith in learning runs deep."}},{"area":"西京区","name":"嵐山の法輪寺周辺（嵐山公園）","desc":"桂川沿いの公園。嵐山の風景を一望でき、四季を通じて自然を楽しめる。人々の憩いの場所としての歴史が浅からぬ。","url":"https://www.pref.kyoto.jp/koen-annai/ara.html","map":"https://www.google.com/maps/search/嵐山公園","rate":3,"rg":"★京都","en":{"name":"Arashiyama Park (near Horin-ji)","desc":"A park along the Katsura river with sweeping views of Arashiyama — long a favorite retreat where nature can be enjoyed in every season."}},{"area":"上京区","name":"京都御苑","desc":"京都御所を囲む広大な公園。かつての貴族の邸宅跡や、歴史的な樹木が残る。市民の憩いの場でありながら、歴史の重みを感じさせる。","url":"https://fng.or.jp/kyoto/","map":"https://www.google.com/maps/search/京都御苑","rate":4,"rg":"★京都","en":{"name":"Kyoto Imperial Garden","desc":"A vast park surrounding the Kyoto Imperial Palace, retaining traces of noble residences and historic trees — a place of public repose that still carries the weight of history."}},{"area":"上京区","name":"護王神社","desc":"和気清麻呂公を祀る。足腰の守護神として有名。境内には猪の像が多く並び、ユニークな雰囲気がある。健康を願う多くの参拝客が訪れる。","url":"https://www.gooujinja.or.jp/","map":"https://www.google.com/maps/search/護王神社+京都","rate":3,"rg":"★京都","en":{"name":"Go-o Shrine","desc":"Enshrining the statesman Wake no Kiyomaro, famous as guardian of legs and health; rows of boar statues give it a unique charm, drawing worshipers praying for well-being."}},{"area":"上京区","name":"上品蓮台寺","desc":"真言宗智山派の寺院。境内に数多くの石仏や石塔が並び、独特の雰囲気が漂う。静かな環境で、古の信仰の形を今に伝える。地元の人々に寄り添う寺として大切にされている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kyoto-hana.net/sakura1082.html&ved=2ahUKEwilqrjqo92VAxVUulYBHeEgEC8QFnoECG8QAQ&usg=AOvVaw1CVgXgLw28NymAZIwvhKqb","map":"https://www.google.com/maps/search/上品蓮台寺+京都","rate":3,"rg":"★京都","en":{"name":"Johonrendai-ji Temple","desc":"A Shingon Chizan temple lined with numerous stone Buddhas and stupas, with a distinctive air; a quiet place preserving the old forms of faith, cherished by locals."}},{"area":"上京区","name":"水火天満宮","desc":"日本最古の水難除けの天満宮。人々の安全を守る神として信仰される。街の中に静かに佇む。","url":"https://kyoto-design.jp/spot/34217","map":"https://www.google.com/maps/search/水火天満宮+京都","rate":3,"rg":"★京都","en":{"name":"Suika Tenmangu","desc":"Japan's oldest Tenmangu for protection from water and fire disasters — a guardian of people's safety, standing quietly in the city."}},{"area":"上京区","name":"水火天満宮周辺の「本法寺」","desc":"本阿弥光悦ゆかりの寺。庭園が美しく、歴史と芸術が融合した静かな場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://eishouzan.honpouji.nichiren-shu.jp/&ved=2ahUKEwjihL-E7d-VAxVdp1YBHVd2A3wQFnoECEEQAQ&usg=AOvVaw3D0W1iIHSILPWzUW0TnZD2","map":"https://www.google.com/maps/search/本法寺+京都","rate":3,"rg":"★京都","en":{"name":"Honpo-ji Temple (near Suika Tenmangu)","desc":"A temple tied to Hon'ami Koetsu, with beautiful gardens — a quiet spot where history and art merge."}},{"area":"上京区","name":"菅原院天満宮神社周辺の「護王神社」","desc":"（再掲調整：周辺の「御所八幡宮」）足利尊氏ゆかりの神社。地域の歴史を今に伝える。静かな雰囲気の中で信仰が守られている。","url":"https://www.gooujinja.or.jp","map":"https://www.google.com/maps/search/御所八幡宮+京都","rate":2,"rg":"★京都","en":{"name":"Gosho Hachimangu","desc":"A shrine tied to Ashikaga Takauji, quietly keeping the local faith and conveying the area's history."}},{"area":"上京区","name":"晴明神社","desc":"陰陽師・安倍晴明を祀る。魔除け、厄除けの神として知られる。境内には晴明ゆかりの「晴明井」や「厄除桃」があり、古の陰陽道の神秘的な空気が漂う。現代においても方位や運勢を気にする人々の篤い信仰を集めている。","url":"https://www.seimeijinja.jp/","map":"https://www.google.com/maps/search/晴明神社+京都","rate":4,"rg":"★京都","en":{"name":"Seimei Shrine","desc":"The shrine of the onmyoji Abe no Seimei, known as a power against evil and misfortune. Its grounds hold the 'Seimei-i' well and the warding peach, breathing the mystique of ancient onmyodo — still drawing deep devotion from those mindful of luck and directions."}},{"area":"上京区","name":"千本釈迦堂（大報恩寺）","desc":"京都市内最古の木造建築である本堂は、応仁の乱の戦火を免れた歴史的奇跡の建物。おかめ伝説でも知られ、信仰と伝説が深く結びついた場所。宝物殿には運慶・快慶一門の仏像が安置され、彫刻芸術の粋を感じることができる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://cb.bunka.go.jp/ja/contents/ec9d72b1-12de-4c06-b75e-b8c8f71f3b04&ved=2ahUKEwjl1eXQtN2VAxULl1YBHUPROxAQFnoECHkQAQ&usg=AOvVaw2DYWX-DgDl_fWH8KY7pvo4","map":"https://www.google.com/maps/search/千本釈迦堂+京都","rate":4,"rg":"★京都","en":{"name":"Senbon Shakado (Daiho-on-ji)","desc":"Its main hall — the oldest wooden building in Kyoto, miraculously spared in the Onin War — is tied to the Okame legend. The treasure hall holds statues by the schools of Unkei and Kaikei, the pinnacle of Buddhist sculpture."}},{"area":"上京区","name":"相国寺","desc":"臨済宗相国寺派大本山。足利義満が創建。境内には法堂（重要文化財）や巨大な伽藍が並ぶ。承天閣美術館では国宝や重要文化財の絵画を収蔵・展示しており、禅の精神と美術工芸の美が融合した歴史的拠点。","url":"https://www.shokoku-ji.jp/","map":"https://www.google.com/maps/search/相国寺+京都","rate":4,"rg":"★京都","en":{"name":"Shokoku-ji Temple","desc":"Head temple of the Rinzai Shokoku-ji school, founded by Ashikaga Yoshimitsu; the Hatto (Important Cultural Property) and vast cloisters fill the grounds, and the Shokoku-ji Treasures Museum exhibits National Treasures — a historic center where Zen meets art."}},{"area":"上京区","name":"釘抜地蔵（石像寺）","desc":"弘法大師ゆかりの寺。苦しみを抜く（釘を抜く）という信仰で、病気平癒を願う人々が釘を打ち付ける独特の儀式が行われる。地域の深い信仰が息づく場所。","url":"https://kuginuki.jp/","map":"https://www.google.com/maps/search/石像寺+京都","rate":3,"rg":"★京都","en":{"name":"Kukurizaru (Sekizo-ji)","desc":"A temple of Kobo Daishi, where people drive nails into a great ball of rope to 'pull out' their pains — a unique ritual of prayer for healing, alive with local devotion."}},{"area":"上京区","name":"同志社大学今出川キャンパス（明治期の洋風建築群）","desc":"寺社ではないが、歴史的な洋風建築が建ち並ぶエリア。新島襄によって設立された歴史を持つ。京都の近代化の象徴的な場所として、その景観の価値は高い。","url":"https://www.doshisha.ac.jp/","map":"https://www.google.com/maps/search/同志社大学+今出川キャンパス","rate":3,"rg":"★京都","en":{"name":"Doshisha University Imadegawa Campus","desc":"Though not a temple or shrine, an area of historic Western-style buildings, founded by Joseph Hardy Neesima — a landscape of high value as a symbol of Kyoto's modernization."}},{"area":"左京区","name":"白峯神宮","desc":"崇徳天皇と淳仁天皇を祀る。蹴鞠の神として知られ、スポーツ上達の祈願で有名。境内にはサッカーや野球のボールが奉納されている。現代のスポーツ文化と古の伝統が融合しているユニークな神社。","url":"https://sugawarain.jp/","map":"https://www.google.com/maps/search/白峯神宮+京都","rate":3,"rg":"★京都","en":{"name":"Shiramine Jingu","desc":"Enshrining emperors Sutoku and Junnin, known as the shrine of kemari (ancient football); famous for prayers of success in sports — soccer and baseball balls are dedicated there, a unique blend of modern sport and ancient tradition."}},{"area":"上京区","name":"報恩寺","desc":"「鳴虎」の伝承で知られる寺院。豊臣秀吉ゆかりの品々も伝わる。地域の信仰を大切にする落ち着いた環境にある、歴史の深さを感じさせる場所。","url":"https://tusyoji.wixsite.com/tusyojinokai/nakitora","map":"https://www.google.com/maps/search/報恩寺+京都","rate":3,"rg":"★京都","en":{"name":"Hoon-ji Temple","desc":"A temple known for the legend of the 'roaring tiger,' also preserving mementos of Toyotomi Hideyoshi — a calm place of deep history that treasures local faith."}},{"area":"上京区","name":"北野天満宮","desc":"全国天満宮の総本社。菅原道真公を祀り、学問の神様として知られる。境内には梅林があり、梅の名所としても有名。歴史的な格式を持ち、多くの受験生や参拝客が訪れる。天神信仰の中心地としての重みがある。","url":"https://www.kitanotenmangu.or.jp/","map":"https://www.google.com/maps/search/北野天満宮+京都","rate":5,"rg":"★京都","en":{"name":"Kitano Tenmangu Shrine","desc":"Head shrine of all the Tenmangu shrines of Japan, enshrining Sugawara no Michizane as the god of learning. Its plum grove makes it a famous blossom site, drawing countless students and worshipers to this center of Tenjin faith."}},{"area":"上京区","name":"本法寺","desc":"日蓮宗の本山。長谷川等伯の作品を多く所蔵し、特に庭園「尊氏公庭園」は歴史的な価値が高い。禅と日蓮宗の精神が融合した、美意識の高い空間。京都の文化・芸術の一翼を担う寺院。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://eishouzan.honpouji.nichiren-shu.jp/&ved=2ahUKEwj__PCUpd2VAxU1slYBHSxVClAQFnoECDwQAQ&usg=AOvVaw3D0W1iIHSILPWzUW0TnZD2","map":"https://www.google.com/maps/search/本法寺+京都","rate":3,"rg":"★京都","en":{"name":"Honpo-ji Temple (Kamigyo)","desc":"A head temple of the Nichiren school holding many works of Hasegawa Tohaku; its garden 'Takauji-ko Teien' is of high historic value — a space where Nichiren faith and beauty merge, a pillar of Kyoto's art."}},{"area":"上京区","name":"廬山寺","desc":"天台圓淨宗の総本山。紫式部が「源氏物語」を執筆した邸宅跡とされる。境内の桔梗庭園が美しく、四季の移ろいを感じさせる。歴史と文学が交差する地であり、静かな空間が訪れる人の心を癒やす。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www7a.biglobe.ne.jp/~rozanji/&ved=2ahUKEwiAm9j8pN2VAxXiqVYBHVTIMwYQFnoECEgQAQ&usg=AOvVaw37vwqA1GilDb-aS68ydo9R","map":"https://www.google.com/maps/search/廬山寺+京都","rate":3,"rg":"★京都","en":{"name":"Rozan-ji Temple","desc":"Head temple of the Tendai Enju school, on the site said to be the residence where Murasaki Shikibu wrote the Tale of Genji. Its bellflower garden is beautiful through the seasons — a place where history and literature cross, healing visitors with its quiet."}},{"area":"山科区","name":"安祥寺","desc":"弘法大師ゆかりの古寺。静寂に包まれた境内には歴史が刻まれている。山科の隠れた名所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://anshouji.or.jp/&ved=2ahUKEwj536r139-VAxVvplYBHSPQEzcQFnoECEkQAQ&usg=AOvVaw2XlQbQIfZvaKCc1IhJQMbQ","map":"https://www.google.com/maps/search/安祥寺+京都","rate":3,"rg":"★京都","en":{"name":"Ansho-ji Temple","desc":"An old temple tied to Kobo Daishi, its quiet grounds engraved with history — a hidden gem of Yamashina."}},{"area":"山科区","name":"勧修寺","desc":"真言宗山階派大本山。醍醐天皇が母の菩提を弔うために開創した門跡寺院。広大な池を中心とした庭園は四季折々の花が楽しめる。かつての貴族の生活を彷彿とさせる優雅な雰囲気が特徴。静寂の中で歴史の深さを感じられる場所である。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://souda-kyoto.jp/guide/spot/kajuji.html&ved=2ahUKEwjw6-zkituVAxWRi68BHcqXFSYQFnoECEQQAQ&usg=AOvVaw03cA7pNxD6UDvuRhC3oZgq","map":"https://www.google.com/maps/search/勧修寺+京都","rate":3,"rg":"★京都","en":{"name":"Kanshin-ji Temple","desc":"Head temple of the Shingon Yamashina school, a monzeki temple founded by Emperor Daigo in memory of his mother. Its garden around a great pond blooms through the seasons, retaining the elegance of aristocratic life — deep history in profound quiet."}},{"area":"山科区","name":"勧修寺周辺の「随心院」","desc":"小野小町ゆかりの寺。優雅な雰囲気と静寂が特徴。特に梅の季節は美しい。","url":"https://www.zuishinin.or.jp/","map":"https://www.google.com/maps/search/随心院+京都","rate":4,"rg":"★京都","en":{"name":"Zuishin-in Temple","desc":"A temple tied to the poet Ono no Komachi, of elegant air and quiet, especially beautiful in plum season."}},{"area":"山科区","name":"諸羽神社","desc":"平安時代からの歴史を持ち、地域を見守る神社。山科の地元の信仰が色濃く残る。境内の静かな雰囲気と歴史的な格式が調和している。","url":"https://kyoto-design.jp/spot/11527#google_vignette","map":"https://www.google.com/maps/search/諸羽神社+京都","rate":2,"rg":"★京都","en":{"name":"Moroha Shrine","desc":"A shrine watching over the district since the Heian era, where local Yamashina faith runs deep — quiet dignity in harmony with its historic setting."}},{"area":"山科区","name":"疎水沿いの道（山科疏水）","desc":"明治期の土木事業の成果。桜や菜の花の名所としても有名。静かな水辺の道は、人々の憩いの場として親しまれる。","url":"https://biwakososui.city.kyoto.lg.jp/place/#area-all","map":"https://www.google.com/maps/search/山科疏水","rate":3,"rg":"★京都","en":{"name":"Yamashina Sosui Canal Path","desc":"The fruit of Meiji-era civil engineering, famous for cherry blossoms and rapeseed flowers — a quiet waterside walk loved as a place of repose."}},{"area":"山科区","name":"大石神社","desc":"忠臣蔵で知られる大石内蔵助ゆかりの神社。地域の歴史を大切にする場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://ooishijinja.com/&ved=2ahUKEwjWj8zB7N-VAxXGqFYBHTpkGb8QFnoECEAQAQ&usg=AOvVaw1zN8uQpP2-_SwIdwWse2wS","map":"https://www.google.com/maps/search/大石神社+京都","rate":3,"rg":"★京都","en":{"name":"Oishi Shrine","desc":"A shrine tied to Oishi Kuranosuke of the Chushingura story — a place that treasures the district's history."}},{"area":"山科区","name":"天智天皇陵","desc":"歴史的な大王の陵。広大な森に囲まれ、非常に神聖な雰囲気が漂う。古代日本の歴史と精神性を今に伝える場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kunaicho.go.jp/visit/ryobo/038.html&ved=2ahUKEwjJ5sWZu92VAxVPmVYBHU2eIUIQFnoECGcQAQ&usg=AOvVaw2_2flcWzNpffmj8rEx4xp9","map":"https://www.google.com/maps/search/天智天皇陵+京都","rate":3,"rg":"★京都","en":{"name":"Mausoleum of Emperor Tenji","desc":"The tomb of a great ancient sovereign amid vast woods, breathing profound sanctity — conveying the history and spirituality of ancient Japan."}},{"area":"山科区","name":"毘沙門堂","desc":"天台宗の門跡寺院。春の桜や秋の紅葉の名所として知られる。本堂の天井画や、襖絵などは見どころの一つ。山の中腹に位置し、静寂に包まれた環境の中で、静かな信仰の時間が流れている。歴史的な門跡寺院の風格と自然が調和している。","url":"https://bishamon.or.jp/","map":"https://www.google.com/maps/search/毘沙門堂+京都","rate":4,"rg":"★京都","en":{"name":"Bishamon-do Temple","desc":"A Tendai monzeki temple, famous for spring cherry and autumn maple; its ceiling paintings and screens are highlights. Set on a mountainside, it keeps quiet hours of faith where the dignity of an imperial temple and nature are in harmony."}},{"area":"山科区","name":"本圀寺","desc":"日蓮宗の大本山。非常に広大な境内を持ち、赤い多宝塔が印象的。山科の丘陵地にあり、京都盆地を望む眺望も素晴らしい。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://temple.nichiren.or.jp/5011092-honkokuji/&ved=2ahUKEwisyL__59-VAxX4XusIHQfPJasQFnoECDQQAQ&usg=AOvVaw03rIkF_Yxq8XJzZqeqvnL6","map":"https://www.google.com/maps/search/本圀寺+京都","rate":3,"rg":"★京都","en":{"name":"Honkoku-ji Temple","desc":"A head temple of the Nichiren school with vast grounds and a striking red tahoto pagoda, on the hills of Yamashina with superb views over the Kyoto basin."}},{"area":"左京区","name":"永観堂禅林寺","desc":"浄土宗西山禅林寺派総本山。古来より「紅葉の永観堂」として知られる。本尊の「見返り阿弥陀」は顔を左に振り返る珍しい姿で有名。山の中腹の斜面に沿って建てられた多宝塔からの市内眺望は絶景で、四季を通じて庭園の風情が楽しめる。","url":"https://www.eikando.or.jp/","map":"https://www.google.com/maps/search/永観堂+京都","rate":4,"rg":"★京都","en":{"name":"Eikando Zenrin-ji Temple","desc":"Head temple of the Jodo Seizan Zenrin-ji school, known since old as 'Eikando of the autumn leaves.' Its 'looking-back Amida' statue is famous for the head turned to the left; the tahoto on the hillside offers superb city views, and the garden charms in every season."}},{"area":"左京区","name":"下鴨神社（賀茂御祖神社）","desc":"正式名称は賀茂御祖神社。糺の森に囲まれ、世界遺産にも登録。東西両本殿は国宝で、流造の形式を伝える。古代より続く神事や祭礼が継承されており、古都の信仰の原点としての歴史的価値が極めて高い。森の静寂が信仰の深さを物語る。世界遺産。平安京造営以前から続く歴史を持つ。糺の森に囲まれた境内は神聖な空気が漂う。縁結びや安産など多岐にわたる信仰を集める。日本最古の神社建築様式のひとつである流造の社殿は、格式と歴史を今に伝えている。","url":"https://www.shimogamo-jinja.or.jp/","map":"https://www.google.com/maps/search/下鴨神社+京都","rate":5,"rg":"★京都","en":{"name":"Shimogamo Shrine","desc":"A World Heritage shrine formally called Kamomioya-jinja, standing within the sacred Tadasu-no-mori forest. Its twin main halls, National Treasures in the ancient nagare style, carry forward rites and festivals unbroken since before the founding of Kyoto — the very origin of the capital's faith."}},{"area":"左京区","name":"京都府立植物園","desc":"日本で最も古い公立植物園。歴史ある樹木や四季の花々を楽しむことができる。京都の自然と文化を学ぶ拠点。","url":"https://www.kyotobotanicalgardens.jp","map":"https://www.google.com/maps/search/京都府立植物園","rate":3,"rg":"★京都","en":{"name":"Kyoto Botanical Garden","desc":"Japan's oldest public botanical garden, with historic trees and seasonal flowers — a place to learn the nature and culture of Kyoto."}},{"area":"左京区","name":"金戒光明寺","desc":"浄土宗の最初の念仏道場。幕末には会津藩の本陣が置かれ、新選組ゆかりの地としても有名。境内には多くの墓所があり、歴史の転換点を感じさせる場所。山門からは京都市内を一望でき、歴史的な景観と静寂が共存している。","url":"https://www.kurodani.jp/","map":"https://www.google.com/maps/search/金戒光明寺+京都","rate":4,"rg":"★京都","en":{"name":"Konkai-komyo-ji Temple","desc":"The first nembutsu training hall of the Jodo school; at the end of the Edo era it hosted the Aizu clan headquarters and is tied to the Shinsengumi. Its many graves mark turning points of history, and the gate commands sweeping views over Kyoto — history and quiet together."}},{"area":"左京区","name":"百萬遍知恩寺","desc":"百萬遍知恩寺：浄土宗の寺院。念仏を唱えて疫病を退散させたという伝承がある。手づくり市などが開かれることでも有名で、現代と古い信仰が融合している場所。地域の歴史を大切にする拠点。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://chionji.jp/&ved=2ahUKEwix7dKbj9uVAxWGm68BHbHcLtkQFnoECEgQAQ&usg=AOvVaw30bul85rOVa5X6s5tj4bhK","map":"https://www.google.com/maps/search/知恩寺+京都","rate":3,"rg":"★京都","en":{"name":"Hyakumanben Chion-ji Temple","desc":"A Jodo temple whose chanting is said to have driven off a medieval plague; famous too for its handicraft markets, where modern life and old faith merge — a hub that treasures local history."}},{"area":"左京区","name":"金戒光明寺周辺の「栄摂院」","desc":"紅葉の名所として知られる真如堂の近く。静かな境内で四季折々の表情が楽しめる。隠れた名所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://oniwa.garden/eishoin-temple-kyoto/&ved=2ahUKEwjItpvS39-VAxUZklYBHYgiLLAQFnoECDwQAQ&usg=AOvVaw20fLs65ibsdR_CMt4t9YtS","map":"https://www.google.com/maps/search/栄摂院+京都","rate":2,"rg":"★京都","en":{"name":"Eisho-in Temple","desc":"Near the famous autumn leaves of Shinnyo-do; a quiet temple with seasonal charm — a hidden gem."}},{"area":"左京区","name":"金戒光明寺周辺の「真如堂（真正極楽寺）」","desc":"紅葉の名所。広大な境内に堂宇が点在し、歴史の重みと静寂を感じる。信仰の対象としての厳かな雰囲気が漂う。","url":"https://shin-nyo-do.jp/","map":"https://www.google.com/maps/search/真如堂+京都","rate":4,"rg":"★京都","en":{"name":"Shinnyo-do (Shinsho-gokuraku-ji)","desc":"Famed for autumn colors; halls dot its spacious grounds, breathing the weight of history and solemn devotion."}},{"area":"左京区","name":"銀閣寺","desc":"正式名称は慈照寺。足利義政が隠居所として建てた山荘が起源。東山文化を象徴する「銀閣（観音殿）」は素朴な佇まいが特徴。庭園には銀沙灘や向月台があり、わびさびの精神を具現化した国宝の建築と庭園美は後世に大きな影響を与えた。","url":"https://www.shokoku-ji.jp/ginkakuji/","map":"https://www.google.com/maps/search/銀閣寺+京都","rate":4,"rg":"★京都","en":{"name":"Ginkaku-ji (Silver Pavilion)","desc":"Formally Jisho-ji, born as the retirement villa of Ashikaga Yoshimasa. The Silver Pavilion, symbol of Higashiyama culture, has a plain, wabi-sabi beauty; the garden's silver-sand cone and moon platform, with the National Treasure buildings, profoundly influenced later garden art."}},{"area":"左京区","name":"熊野若王子神社","desc":"京都三熊野の一つ。哲学の道の起点近くに位置する。縁結びや厄除けの信仰が篤い。緑豊かな境内に歴史の重みを感じる。","url":"https://kyoto-16sha.jp/kumanonyakuojijinja/","map":"https://www.google.com/maps/search/熊野若王子神社+京都","rate":3,"rg":"★京都","en":{"name":"Kumano Nyaku-oji Shrine","desc":"One of the three Kumano shrines of Kyoto, near the start of the Philosopher's Path — deeply worshiped for matchmaking and protection, amid rich green and historic weight."}},{"area":"左京区","name":"鷺森神社","desc":"修学院の鎮守。深い緑に囲まれた神社で、非常に静かで落ち着いている。地域の人々が守る伝統と信仰が息づく場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kyotorakuhoku.net/%25E7%25A4%25BE%25E5%25AF%25BA%25E3%2581%25AE%25E3%2581%2594%25E6%25A1%2588%25E5%2586%2585/%25E2%2591%25A3%25E9%25B7%25BA%25E6%25A3%25AE%25E7%25A5%259E%25E7%25A4%25BE/&ved=2ahUKEwjnvPzVut2VAxVvplYBHSPQEzcQFnoECGQQAQ&usg=AOvVaw3K5S7SIP_xOQzaJiH3W9jk","map":"https://www.google.com/maps/search/鷺森神社+京都","rate":3,"rg":"★京都","en":{"name":"Sagimori Shrine","desc":"The guardian shrine of Shugakuin, wrapped in deep green — very quiet and settled, a place where local tradition and faith live on."}},{"area":"左京区","name":"詩仙堂","desc":"石川丈山が晩年を過ごした山荘。四季折々の庭園と、特に「ししおどし」の音が静寂を引き立てる。文人趣味が色濃く残る、京都の中でも独特の風情を持つ場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kyoto-shisendo.net/&ved=2ahUKEwj4lsC9ud2VAxVSklYBHaH9F3QQFnoECFwQAQ&usg=AOvVaw3UWmGQZ0t3iNKQSJ7dNo_Q","map":"https://www.google.com/maps/search/詩仙堂+京都","rate":4,"rg":"★京都","en":{"name":"Shisen-do","desc":"The villa where the scholar Ishikawa Jozan spent his last years, with gardens of every season and the famous shishi-odoshi deer-scarer whose sound deepens the silence — a place of literary taste unique in Kyoto."}},{"area":"左京区","name":"修学院の周辺（圓通寺）","desc":"比叡山を借景とした枯山水庭園は、その景観の完成度が非常に高い。静寂の中で庭園と比叡山の眺望を一人占めできるような、洗練された空間。","url":"https://www.kyotorakuhoku.net/社寺のご案内/②圓通寺/","map":"https://www.google.com/maps/search/圓通寺+京都","rate":4,"rg":"★京都","en":{"name":"Entsu-ji Temple","desc":"Its dry garden borrowing Mt. Hiei is of astonishing perfection — a refined space where one can seemingly have the garden and the mountain view all to oneself in silence."}},{"area":"左京区","name":"修学院離宮","desc":"後水尾上皇によって造営された広大な離宮。借景を巧みに取り入れた庭園と池、建築群の調和は傑出している。自然の風景を庭園の一部として取り込む手法は、日本の造園美の極致とも言える。皇室の気品と静謐な空間が守られている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kyoto-gosho.kunaicho.go.jp/shugakuin-rikyu&ved=2ahUKEwiyoJroi9uVAxWFkK8BHeQvDkkQFnoECEcQAQ&usg=AOvVaw0PFfQQnze9tOZTIa5cnbVZ","map":"https://www.google.com/maps/search/修学院離宮+京都","rate":5,"rg":"★京都","en":{"name":"Shugakuin Imperial Villa","desc":"A vast imperial villa built by the retired emperor Gomizuno'o. Its gardens, pools and buildings — masterfully composed with borrowed scenery — are held to be the summit of Japanese landscape art, preserved in noble serenity."}},{"area":"左京区","name":"真如堂（真正極楽寺）","desc":"天台宗の寺院。広大な境内は四季折々の風景が美しく、特に紅葉の名所として知られる。本尊は阿弥陀如来。落ち着いた環境で、地元の人々からも大切にされている歴史ある寺院。","url":"https://shin-nyo-do.jp/","map":"https://www.google.com/maps/search/真如堂+京都","rate":3,"rg":"★京都","en":{"name":"Shinnyo-do Temple","desc":"A Tendai temple with beautiful seasonal grounds, famed especially for autumn colors; its principal image is Amida. A calm, treasured historic temple loved by locals."}},{"area":"左京区","name":"赤山禅院","desc":"比叡山延暦寺の塔頭。京都の表鬼門を守る社として、古来より厄除けの信仰を集める。境内にある「還念珠」をくぐると厄が落ちるとされる。寒行で知られる厳しい信仰の場でもあり、静かな環境で強い信仰の力を感じさせる寺院。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://rakuhoku-sekizanzenin.org/&ved=2ahUKEwjOyLCWhduVAxVJdfUHHTgePL0QFnoECDoQAQ&usg=AOvVaw38vQfKbCRjSRnTL-4ESLhX","map":"https://www.google.com/maps/search/赤山禅院+京都","rate":4,"rg":"★京都","en":{"name":"Sekizan Zen-in","desc":"A sub-temple of Enryaku-ji guarding Kyoto's northeast demon gate, long a focus of protection from misfortune; passing through the 'gan-juzu' bead ring is said to remove bad luck — also known for its severe winter asceticism, radiating strong faith in quiet surroundings."}},{"area":"左京区","name":"赤山禅院周辺の「修学院離宮」","desc":"（名所として）徳川家康の孫である後水尾天皇によって造営された離宮。洗練された庭園と建物は、日本美の極致。予約制だが、一見の価値がある。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kyoto-gosho.kunaicho.go.jp/shugakuin-rikyu&ved=2ahUKEwin6_i659-VAxVJmFYBHW4GI_wQFnoECFIQAQ&usg=AOvVaw0PFfQQnze9tOZTIa5cnbVZ","map":"https://www.google.com/maps/search/修学院離宮+京都","rate":5,"rg":"★京都","en":{"name":"Shugakuin Imperial Villa","desc":"An imperial villa built by Emperor Gomizuno'o, grandson of Tokugawa Ieyasu. Its refined gardens and buildings are the height of Japanese beauty — worth a visit, though reservation is required."}},{"area":"左京区","name":"大原三千院","desc":"天台宗の門跡寺院。往生極楽院を中心に、苔むした庭園と「わらべ地蔵」が特徴的な空間。四季を通じて自然の美しさを堪能でき、阿弥陀三尊像は国宝。静寂の中で信仰に触れられる場所として知られ、歴史的な庭園美と静謐さが共存する。","url":"https://www.sanzenin.or.jp/","map":"https://www.google.com/maps/search/大原三千院+京都","rate":4,"rg":"★京都","en":{"name":"Sanzen-in Temple, Ohara","desc":"A Tendai monzeki temple centered on the Ojo Gokuraku-in, with moss gardens and the charming 'warabe Jizo' statues. The National Treasure Amida Triad presides over beauty enjoyed in every season — historic garden art and serenity together."}},{"area":"左京区","name":"哲学の道","desc":"銀閣寺から南禅寺へと続く静かな散策路。西田幾多郎らが思索に耽ったとされる。四季の自然と静寂を楽しみながら歩くことができる。精神的な充足感を得られる道。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kyoto-walks.com/deta/sakyo/tetsugaku.html&ved=2ahUKEwjM2-ihqd2VAxXMtlYBHeziHDwQFnoECDYQAQ&usg=AOvVaw3rVWndNZ-CLuPV2iZolLj3","map":"https://www.google.com/maps/search/哲学の道","rate":4,"rg":"★京都","en":{"name":"Philosopher's Path","desc":"A quiet walking path from Ginkaku-ji to Nanzen-ji, where the philosopher Nishida Kitaro is said to have pondered — a road of nature, stillness and spiritual refreshment in every season."}},{"area":"左京区","name":"南禅寺","desc":"臨済宗南禅寺派大本山。亀山法皇が離宮を寄進し開創。巨大な三門は歌舞伎でも有名。境内には水路閣というレンガ造りのアーチ橋があり、明治期の土木遺産と古い禅寺の建築が混在する景観が独特。広大な敷地には多くの塔頭が点在する。","url":"https://nanzenji.or.jp/","map":"https://www.google.com/maps/search/南禅寺+京都","rate":5,"rg":"★京都","en":{"name":"Nanzen-ji Temple","desc":"The head temple of the Rinzai Nanzen-ji school, founded on the site of a retired emperor's villa. Its great Sanmon gate is famed even in kabuki; the brick aqueduct of the Meiji era mingles with the ancient Zen halls across grounds scattered with sub-temples."}},{"area":"左京区","name":"南禅寺周辺の「天授庵」","desc":"南禅寺の塔頭。庭園の美しさは格別で、特に紅葉の時期の風景は多くの人を魅了する。","url":"https://oniwa.garden/nanzenji-tenjuan-kyoto-天授庵/","map":"https://www.google.com/maps/search/天授庵+京都","rate":4,"rg":"★京都","en":{"name":"Tenjuan (Nanzen-ji)","desc":"A sub-temple of Nanzen-ji with an exceptionally beautiful garden, especially enchanting in autumn."}},{"area":"左京区","name":"平安神宮","desc":"明治28年、平安遷都1100年を記念して創建。桓武天皇と孝明天皇を祀る。社殿は平安京の正庁を模した朱塗りの壮大な造りで、約3万平方メートルの神苑には四季折々の風情が漂う。京都の歴史と文化を象徴する華やかな格式を持つ社である。","url":"https://www.heianjingu.or.jp/","map":"https://www.google.com/maps/search/平安神宮+京都","rate":5,"rg":"★京都","en":{"name":"Heian Jingu Shrine","desc":"Founded in 1895 to mark 1,100 years since the capital's move to Kyoto, enshrining Emperors Kammu and Komei. Its vermilion halls re-create the great court of Heian-kyo, and its 30,000-square-meter gardens bloom in beauty through the seasons."}},{"area":"左京区","name":"法然院","desc":"（法然院）静寂を極める寺院。茅葺きの山門が非常に印象的。哲学の道の近くにありながら、独自の穏やかな時間が流れている。四季の自然と静けさを愛する人々の心の場所。","url":"http://www.honen-in.jp/","map":"https://www.google.com/maps/search/法然院+京都","rate":4,"rg":"★京都","en":{"name":"Honen-in Temple","desc":"A temple of utter stillness, marked by its thatched gate; near the Philosopher's Path yet flowing with its own calm time — a place of nature and quiet for those who seek it."}},{"area":"左京区","name":"梨木神社","desc":"京都御所の東側に位置する。境内に湧く「染井の水」は京都三名水の一つとして有名。萩の名所としても知られ、静かな環境で心身を清める場所。歴史ある神社として、地域の人々からの崇敬を集める。","url":"https://nashinoki.jp/","map":"https://www.google.com/maps/search/梨木神社+京都","rate":3,"rg":"★京都","en":{"name":"Nashinoki Shrine","desc":"On the east side of the Imperial Palace; its 'Somei water' ranks among Kyoto's three famous springs, and it is known too for its bush clover — a quiet place of purification treasured by locals."}},{"area":"左京区","name":"曼殊院門跡","desc":"比叡山の麓にある格式高い門跡寺院。枯山水庭園や書院の美しさは「小さな桂離宮」とも称される。古来より皇室や公家との関わりが深く、その雅な雰囲気は比類がない。","url":"https://www.manshuinmonzeki.jp/","map":"https://www.google.com/maps/search/曼殊院門跡+京都","rate":4,"rg":"★京都","en":{"name":"Manshu-in Monzeki","desc":"A distinguished imperial temple at the foot of Mt. Hiei, whose dry garden and study are called 'a small Katsura Imperial Villa'; long tied to the court and nobility, its elegance is beyond compare."}},{"area":"下京区","name":"京都駅ビル","desc":"近代建築の象徴。駅自体が巨大な空間として京都の玄関口。伝統的な街の風景とのコントラストが際立つ現代のランドマーク。","url":"https://www.kyoto-station-building.co.jp/","map":"https://www.google.com/maps/search/京都駅ビル","rate":4,"rg":"★京都","en":{"name":"Kyoto Station Building","desc":"A symbol of modern architecture — the station itself is a vast space serving as Kyoto's gateway, a contemporary landmark strikingly contrasted with the traditional cityscape."}},{"area":"下京区","name":"高瀬川","desc":"森鴎外の小説の舞台としても有名。かつての物流の要所。現在は静かな川沿いの散策路として、人々の生活に溶け込んでいる。","url":"https://co-trip.jp/article/722031","map":"https://www.google.com/maps/search/高瀬川","rate":3,"rg":"★京都","en":{"name":"Takase River","desc":"Famous as a setting of Ogai Mori's fiction and once a key artery of freight; today a quiet waterside walk woven into daily life."}},{"area":"下京区","name":"市比賣神社","desc":"女性の守り神として信仰される。珍しい「姫だるま」みくじがある。古くから女性の健康や幸福を願う場所として大切にされている。","url":"https://ichihime.net/","map":"https://www.google.com/maps/search/市比賣神社+京都","rate":3,"rg":"★京都","en":{"name":"Ichihime Shrine","desc":"A shrine of protection for women, with unusual 'hime daruma' fortunes — long cherished as a place to wish for women's health and happiness."}},{"area":"下京区","name":"若一神社","desc":"平清盛ゆかりの神社。境内にある大きなクスノキがシンボル。西大路通りに面しているが、足を踏み入れると静寂が広がる。商売繁盛や開運の神として地元で愛されている。","url":"https://note.com/ueda_akio/n/n25d90bb301e2","map":"https://www.google.com/maps/search/若一神社+京都","rate":3,"rg":"★京都","en":{"name":"Nichiichi Shrine","desc":"A shrine tied to Taira no Kiyomori, marked by a great camphor tree; step off Nishioji street and quiet spreads around you — loved locally as a deity of prosperity."}},{"area":"下京区","name":"渉成園","desc":"東本願寺の飛地境内。枳殻邸とも呼ばれる。美しい庭園と建物は、江戸時代の文人たちの交流の場だった。現在は静謐なオアシスとして親しまれる。建築や庭園美、茶の湯など、日本の伝統文化が結実した場所としての歴史的な価値を持つ。","url":"https://www.higashihonganji.or.jp/about/guide/shoseien/","map":"https://www.google.com/maps/search/渉成園+京都","rate":4,"rg":"★京都","en":{"name":"Shosei-en Garden","desc":"The detached garden of Higashi Hongwan-ji, also called Kikoku-tei; its beautiful garden and buildings were once a salon of Edo literati — now a tranquil oasis, a distillation of traditional culture from architecture to the tea ceremony."}},{"area":"下京区","name":"西本願寺","desc":"浄土真宗本願寺派の本山。世界遺産。桃山文化を代表する唐門や書院、御影堂など、国宝級の建築物群が建ち並ぶ。建築だけでなく、鑓水や庭園も美しく、信仰の場としてだけでなく、日本建築美術の宝庫として高い評価を得ている。","url":"https://www.hongwanji.kyoto/","map":"https://www.google.com/maps/search/西本願寺+京都","rate":4,"rg":"★京都","en":{"name":"Nishi Hongwan-ji Temple","desc":"The head temple of the Jodo Shinshu Hongwan-ji school, a World Heritage site. National Treasure buildings — the kara-mon, study halls and Goeido — line the grounds; the water features and gardens are beautiful too, treasured as a treasury of Japanese architecture."}},{"area":"下京区","name":"西本願寺・東本願寺周辺の「渉成園」","desc":"渉成園は東本願寺の飛地境内の庭園です。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi
