 his exile on Sado and based his teaching — an important sanctuary of the Nichiren school."}},{"area":"石川県珠洲市","name":"羽黒神社（奥能登の古社と火山岩の景観）","desc":"（名所として）奥能登の厳しい自然と海を見守るように鎮座する古社。能登半島の先端に宿る独自の信仰と歴史的景観を伝える。","url":"https://www.city.suzu.lg.jp/","map":"https://www.google.com/maps/search/羽黒神社+珠洲","rate":3,"rg":"中部地方","en":{"name":"Haguro Shrine, Oku-Noto","desc":"An old shrine watching over the harsh nature and the sea of Oku-Noto, conveying the unique faith and historic scenery found at the peninsula's tip."}},{"area":"山梨県富士吉田市","name":"北口本宮冨士浅間神社","desc":"富士山の北側（吉田口）の登山口に鎮座し、古くから多くの修験者や富士講の信者たちに崇敬されてきた荘厳な古社。","url":"https://sengenjinja.jp/","map":"https://www.google.com/maps/search/北口本宮冨士浅間神社","rate":5,"rg":"中部地方","en":{"name":"Kitaguchi Hongu Fuji Sengen Shrine","desc":"The solemn shrine at the northern (Yoshida) entrance to Mt. Fuji, long revered by Shugendo ascetics and the devotees of the Fuji-ko confraternities."}},{"area":"岐阜県大垣市","name":"美濃路 大垣宿（及び大垣城）","desc":"（名所として）水都として知られる大垣の城下町と、江戸と京都を結ぶ美濃路の歴史的要衝。関ヶ原の戦いの舞台としても重要。","url":"https://www.city.ogaki.lg.jp/0000000577.html","map":"https://www.google.com/maps/search/大垣城","rate":4,"rg":"中部地方","en":{"name":"Ogaki-juku on the Minoji","desc":"The castle town of Ogaki, the 'city of water' — a historic key point on the Minoji linking Edo and Kyoto, and a stage of the Battle of Sekigahara."}},{"area":"静岡県浜松市中央区","name":"浜松城（浜松城公園）","desc":"（名所として）徳川家康が若い頃に約17年間過ごし、「出世城」の異名を持つ城。武田軍との戦いの歴史や城下町の礎を伝える。","url":"https://www.entetsuassist-dms.com/hamamatsu-jyo/","map":"https://www.google.com/maps/search/浜松城","rate":4,"rg":"中部地方","en":{"name":"Hamamatsu Castle","desc":"The 'Castle of Success' where Tokugawa Ieyasu spent some seventeen years of his youth, conveying the history of his struggles with the Takeda and the foundations of his castle town."}},{"area":"愛知県一宮市","name":"国宝 妙興寺（一宮市）※エリア調整","desc":"鎌倉時代末期に創建された臨済宗妙心寺派の古刹。尾張における禅宗の拠点として極めて高い格式と多くの文化財を持つ。","url":"https://www.city.ichinomiya.aichi.jp/","map":"https://www.google.com/maps/search/妙興寺+一宮","rate":4,"rg":"中部地方","en":{"name":"Myoko-ji Temple (National Treasure)","desc":"A Rinzai Myoshin-ji temple founded in the late Kamakura period — a Zen stronghold of Owari of the highest standing, holding many cultural properties."}},{"area":"新潟県新潟市","name":"北方文化博物館","desc":"豪農・伊藤家の大邸宅であり、越後の豪農文化と見事な回遊式庭園を伝える歴史的建造物群。","url":"https://www.hoppou-bunka.com/","map":"https://www.google.com/maps/search/北方文化博物館","rate":5,"rg":"中部地方","en":{"name":"Northern Culture Museum","desc":"The grand estate of the wealthy Ito farming family, conveying the culture of Echigo's rich farmers and a splendid strolling garden."}},{"area":"富山県富山市","name":"岩瀬の町並み（北前船の歴史）","desc":"（名所として）江戸時代から明治時代にかけて北前船の寄港地として栄えた、歴史的な商家や廻船問屋が残る港町。","url":"https://www.info-toyama.com/attractions/80026","map":"https://www.google.com/maps/search/岩瀬の町並み","rate":5,"rg":"中部地方","en":{"name":"Iwase Port Townscape","desc":"A port town that flourished from the Edo to Meiji eras as a port of call for the kitamaebune cargo ships, with historic merchant houses and shipping agents."}},{"area":"石川県輪島市","name":"白米千枚田","desc":"（名所として）日本海に面した急斜面に小さな田んぼが幾重にも重なる、世界農業遺産の棚田景観。日本の原風景を伝える。","url":"https://www.wajimanavi.jp/","map":"https://www.google.com/maps/search/白米千枚田","rate":5,"rg":"中部地方","en":{"name":"Shiroyone Senmaida","desc":"Thousands of tiny rice terraces layered on the steep slopes above the Sea of Japan — a Globally Important Agricultural Heritage landscape of Japan's original scenery."}},{"area":"福井県三方上中郡若狭町","name":"若狭国分寺跡 / 史跡巡り","desc":"（名所として）奈良時代に聖武天皇の詔によって建立された若狭国の国分寺跡。若狭地方の仏教文化の根底を伝える史跡。","url":"https://www1.city.obama.fukui.jp/obm/rekisi/sekai_isan/Japanese/data/118.htm","map":"https://www.google.com/maps/search/若狭国分寺跡","rate":5,"rg":"中部地方","en":{"name":"Ruins of Wakasa Kokubun-ji","desc":"The Nara-period provincial temple of Wakasa founded by decree of Emperor Shomu — a historic site at the root of the region's Buddhist culture."}},{"area":"岐阜県中津川市","name":"馬籠宿（中山道）","desc":"（名所として）木曽路の宿場町の一つであり、石畳と江戸時代の面影を残す古い町並みがそのまま保存された歴史的景観。","url":"http://kiso-magome.com/","map":"https://www.google.com/maps/search/馬籠宿","rate":5,"rg":"中部地方","en":{"name":"Magome-juku Post Town","desc":"A post town of the Kiso road, its stone-paved streetscape preserving the atmosphere of the Edo period exactly as it was."}},{"area":"静岡県静岡市葵区","name":"久能山東照宮","desc":"徳川家康公の遺命により創建された最初の東照宮。権現造りの壮麗な社殿と国宝の指定を受ける建築群が広がる聖地。","url":"https://www.toshogu.or.jp/","map":"https://www.google.com/maps/search/久能山東照宮","rate":5,"rg":"中部地方","en":{"name":"Kunozan Toshogu Shrine","desc":"The first Toshogu shrine, built by the dying wish of Tokugawa Ieyasu — a sacred place of splendid gongen-zukuri halls and National Treasure buildings."}}]},{"id":"関東地方","slug":"kanto","entries":[{"area":"東京都千代田区","name":"神田明神","desc":"天平2年創建と伝わる古社。江戸総鎮守として、江戸城の鬼門守護や江戸庶民の信仰の中心を担ってきた歴史を持つ。","url":"https://www.kandamyoujin.or.jp/","map":"https://www.google.com/maps/search/神田明神","rate":5,"rg":"関東地方","en":{"name":"Kanda Myojin Shrine","desc":"An old shrine said to date to 730. As the great guardian of Edo it watched over the city's northeast gate and stood at the center of Edo townsfolk's faith."}},{"area":"東京都千代田区","name":"皇居外苑・江戸城跡","desc":"（名所として）江戸幕府の居城であり、現在は皇居。広大な敷地に遺る石垣や門、見事な松の景観は日本の歴史の象徴。","url":"https://www.env.go.jp/garden/kokyogaien/1_intro/his_01.html","map":"https://www.google.com/maps/search/江戸城跡+皇居","rate":5,"rg":"関東地方","en":{"name":"Imperial Palace & Edo Castle Ruins","desc":"The residence of the Tokugawa shoguns and today the Imperial Palace; the vast grounds of stone walls, gates and pines are the very symbol of Japan's history."}},{"area":"東京都台東区","name":"浅草寺","desc":"都内最古の寺院。推古天皇の時代に創建されたと伝わる。雷門と仲見世、壮麗な本堂が織りなす下町の中心地にして日本を代表する聖地。","url":"https://www.senso-ji.jp/","map":"https://www.google.com/maps/search/浅草寺","rate":5,"rg":"関東地方","en":{"name":"Senso-ji Temple","desc":"The oldest temple in Tokyo, founded in the age of Empress Suiko. The Kaminarimon gate, Nakamise arcade and grand main hall make Asakusa the beating heart of the old downtown and a shrine of Japan itself."}},{"area":"東京都台東区","name":"上野東照宮","desc":"徳川家康公を祀る神社。江戸時代の豪華絢爛な社殿や唐門が奇跡的に戦災を免れて現存し、歴史的・建築的価値が極めて高い。","url":"https://www.uenotoshogu.com/","map":"https://www.google.com/maps/search/上野東照宮","rate":4,"rg":"関東地方","en":{"name":"Ueno Toshogu","desc":"Enshrining Tokugawa Ieyasu; its lavish Edo-period buildings and kara-mon miraculously survived the war fires — of the highest historic and architectural value."}},{"area":"東京都渋谷区","name":"明治神宮","desc":"大正9年に創建された、明治天皇と昭憲皇太后を祀る神社。都心にありながら人工の豊かな森（杜）に囲まれ、厳かな空気が漂う。","url":"https://www.meijijingu.or.jp/","map":"https://www.google.com/maps/search/明治神宮","rate":5,"rg":"関東地方","en":{"name":"Meiji Jingu Shrine","desc":"Founded in 1920, enshrining Emperor Meiji and Empress Shoken. Amid a man-made forest deep in the heart of Tokyo, a solemn air prevails."}},{"area":"神奈川県鎌倉市","name":"鶴岡八幡宮","desc":"源頼朝が現在地に幕府の中心的社殿として整備した鎌倉の精神的中心。武家政権の歴史を色濃く残す。","url":"https://www.hachimangu.or.jp/","map":"https://www.google.com/maps/search/鶴岡八幡宮+鎌倉","rate":5,"rg":"関東地方","en":{"name":"Tsurugaoka Hachimangu","desc":"The spiritual center of Kamakura, established by Minamoto no Yoritomo as the shrine of his shogunate — a place steeped in the history of warrior rule."}},{"area":"神奈川県鎌倉市","name":"高徳院（鎌倉大仏）","desc":"国宝の阿弥陀如来坐像（鎌倉大仏）で知られる寺院。中世の鋳造技術の高さと、屋外に鎮座する圧倒的な存在感が魅力。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kotoku-in.jp/&ved=2ahUKEwiW8OyNpuaVAxV9mFYBHR2cBgwQFnoECF0QAQ&usg=AOvVaw1OC0BTvdOgL5nkcJhd_3D3","map":"https://www.google.com/maps/search/高徳院+鎌倉","rate":5,"rg":"関東地方","en":{"name":"Kotoku-in (Great Buddha of Kamakura)","desc":"A temple famous for its National Treasure bronze Amida Buddha, the Great Buddha of Kamakura — a marvel of medieval casting, sitting in the open air."}},{"area":"神奈川県鎌倉市","name":"建長寺","desc":"日本最初の禅宗の専門道場であり、鎌倉五山第一位の名刹。重厚な総門や三門、広大な境内に禅の厳かな雰囲気が満ちる。","url":"https://www.kenchoji.com/","map":"https://www.google.com/maps/search/建長寺+鎌倉","rate":5,"rg":"関東地方","en":{"name":"Kencho-ji Temple","desc":"Japan's first Zen training monastery and the top of the Five Mountains of Kamakura; its weighty gates and vast grounds breathe the solemn air of Zen."}},{"area":"神奈川県鎌倉市","name":"長谷寺（長谷観音）","desc":"境内から相模湾を望む景勝地。日本最大級の木造観音菩薩立像を安置し、四季折々の花（特にアジサイ）が美しい寺院。","url":"https://www.hasedera.jp/","map":"https://www.google.com/maps/search/長谷寺+鎌倉","rate":4,"rg":"関東地方","en":{"name":"Hase-dera 'Hase Kannon' (Kamakura)","desc":"A scenic temple overlooking Sagami Bay, housing one of Japan's largest wooden Kannon statues, beautiful with seasonal flowers — especially hydrangeas."}},{"area":"神奈川県小田原市","name":"小田原城址公園","desc":"（名所として）北条氏の居城であり、のちに江戸時代の防衛拠点となった難攻不落の城。天守からの眺望と歴史的遺構が見事。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://odawaracastle.com/Overview/&ved=2ahUKEwi1zKiypuaVAxUrh1YBHTYRPPwQFnoECEUQAQ&usg=AOvVaw2w2gnWm1Vz0V-HURrVk9If","map":"https://www.google.com/maps/search/小田原城","rate":4,"rg":"関東地方","en":{"name":"Odawara Castle Park","desc":"The seat of the Hojo clan and later an Edo-period bulwark — an impregnable castle with fine views from the keep and impressive remains."}},{"area":"千葉県成田市","name":"成田山新勝寺","desc":"真言宗智山派の大本山。全国屈指の初詣客を誇る不動尊の霊場。広大な境内に総門や三重塔、江戸時代の歴史的建造物が並ぶ。","url":"https://www.naritasan.or.jp/","map":"https://www.google.com/maps/search/成田山新勝寺","rate":5,"rg":"関東地方","en":{"name":"Naritasan Shinsho-ji","desc":"The head temple of the Shingon Chizan school and a Fudo sanctuary drawing one of Japan's largest New Year crowds; gates, pagodas and Edo-period buildings spread across vast grounds."}},{"area":"千葉県香取市","name":"香取神宮","desc":"下総国の一宮であり、全国約400ある香取神社の総本社。日本書紀の経津主大神を祀る、古代からの東国鎮護の要所。","url":"https://katori-jingu.or.jp/","map":"https://www.google.com/maps/search/香取神宮","rate":5,"rg":"関東地方","en":{"name":"Katori Jingu Shrine","desc":"The ichinomiya of Shimosa Province and head of some 400 Katori shrines nationwide, enshrining the deity Futsunushi of the Nihon Shoki — a bulwark of the east since antiquity."}},{"area":"埼玉県秩父市","name":"秩父神社","desc":"秩父地方の総鎮守。徳川家康が再建した社殿には「つなぎの龍」などの見事な彫刻が施されている。秩父夜祭の舞台。","url":"https://www.chichibu-jinja.or.jp/","map":"https://www.google.com/maps/search/秩父神社","rate":4,"rg":"関東地方","en":{"name":"Chichibu Shrine","desc":"The great guardian shrine of the Chichibu region; its halls, rebuilt under Tokugawa Ieyasu, bear superb carvings such as the 'chained dragon' — home of the Chichibu Night Festival."}},{"area":"埼玉県川越市","name":"川越氷川神社","desc":"縁結びの神として知られる古社。江戸の北の守りとして栄えた川越の歴史を伝え、見事な彫刻の本殿は県の文化財。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kawagoehikawa.jp/&ved=2ahUKEwiDp7DPpuaVAxVHiFYBHdj2B0IQFnoECFkQAQ&usg=AOvVaw0lZI6S_rVTXiXRL-yiB4jF","map":"https://www.google.com/maps/search/川越氷川神社","rate":4,"rg":"関東地方","en":{"name":"Kawagoe Hikawa Shrine","desc":"An old shrine famous for matchmaking that conveys the history of Kawagoe as guardian of northern Edo; the richly carved main hall is a prefectural cultural property."}},{"area":"茨城県鹿嶋市","name":"鹿島神宮","desc":"全国にある鹿島神社の総本社であり、東国最古の古社。日本建国・武道の神を祀り、豊かな森に包まれた神域が広がる。","url":"https://kashimajingu.jp/","map":"https://www.google.com/maps/search/鹿島神宮","rate":5,"rg":"関東地方","en":{"name":"Kashima Jingu Shrine","desc":"Head of the Kashima shrines across Japan and the oldest shrine of the east, enshrining gods of the nation's founding and of martial arts amid rich sacred forest."}},{"area":"茨城県水戸市","name":"偕楽園（および弘道館）","desc":"（名所として）日本三名園の一つ。水戸藩主・徳川斉昭によって造営された。歴史的な学びの場である弘道館とともに水戸の象徴。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://ibaraki-kairakuen.jp/history/&ved=2ahUKEwjQ_76Fp-aVAxV5sVYBHatyC5QQFnoECE0QAQ&usg=AOvVaw3DpYqU7tbcRSxher81pLfJ","map":"https://www.google.com/maps/search/偕楽園+水戸","rate":5,"rg":"関東地方","en":{"name":"Kairaku-en Garden","desc":"One of Japan's three great gardens, built by the Mido lord Tokugawa Nariaki — together with the historic Kodo-kan academy, the symbol of Mito."}},{"area":"栃木県日光市","name":"日光東照宮","desc":"世界遺産。徳川家康を祀る神社。日本建築の粋を集めた絢爛豪華な社殿群（陽明門や眠り猫など）は世界的に有名。","url":"https://www.toshogu.jp/","map":"https://www.google.com/maps/search/日光東照宮","rate":5,"rg":"関東地方","en":{"name":"Nikko Toshogu Shrine","desc":"A World Heritage shrine enshrining Tokugawa Ieyasu, world-famous for its lavish buildings — the Yomei-mon gate, the sleeping cat and more — the crowning glory of Japanese craftsmanship."}},{"area":"栃木県日光市","name":"日光二荒山神社","desc":"世界遺産。男体山をご神体とする下野国の一宮。日光の社寺の起点であり、深い自然と古代からの山岳信仰を伝える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.futarasan.jp/&ved=2ahUKEwiGptetp-aVAxXjsFYBHd6zBmAQFnoECBsQAQ&usg=AOvVaw01XN5oeJoycIo9TMmXdxrB","map":"https://www.google.com/maps/search/日光二荒山神社","rate":5,"rg":"関東地方","en":{"name":"Futarasan Shrine, Nikko","desc":"A World Heritage shrine, ichinomiya of Shimotsuke Province venerating Mt. Nantai as its deity — the origin of Nikko's shrines and temples, and of deep nature worship since antiquity."}},{"area":"群馬県富岡市","name":"貫前神社（一之宮貫前神社）","desc":"上野国の一宮。全国でも珍しい「下り宮（社殿が石段を下った谷間にある）」の構造を持ち、独特の荘厳な雰囲気を醸す古社。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://nukisaki.or.jp/&ved=2ahUKEwjhnsS-p-aVAxV0sVYBHQA4DmgQFnoECEQQAQ&usg=AOvVaw1O_v0lN1wEZj3yFOBB5Bhs","map":"https://www.google.com/maps/search/貫前神社+群馬","rate":4,"rg":"関東地方","en":{"name":"Nukisaki Shrine (Ichinomiya)","desc":"The ichinomiya of Kozuke, with the rare 'descending shrine' layout — halls reached by descending a valley stair — an old shrine of unique solemnity."}},{"area":"東京都港区","name":"増上寺","desc":"浄土宗の大本山。徳川家康の菩提寺であり、徳川家康公ゆかりの黒本尊を祀る。東京タワーを背景に広大な伽藍がそびえる。","url":"https://www.zojoji.or.jp/","map":"https://www.google.com/maps/search/増上寺","rate":5,"rg":"関東地方","en":{"name":"Zojo-ji Temple","desc":"The head temple of the Jodo school and family temple of Tokugawa Ieyasu, enshrining the Black Buddha; its grand halls rise with Tokyo Tower behind."}},{"area":"東京都墨田区","name":"隅田公園周辺の「浅草神社」","desc":"（名所として）三社祭で知られる神社。浅草寺の創建に関わった漁師ら3人を祀り、下町の歴史と信仰を今に伝える。","url":"https://www.asakusajinja.jp/","map":"https://www.google.com/maps/search/浅草神社","rate":4,"rg":"関東地方","en":{"name":"Asakusa Shrine","desc":"The shrine of the Sanja Matsuri, enshrining the three fishermen linked to Senso-ji's founding — conveying the faith and history of the downtown."}},{"area":"東京都府中市","name":"大國魂神社","desc":"武蔵国の総社（一宮から六宮までの神々を合祀）。東京都心近郊でありながら、武蔵野の歴史と厳かな雰囲気を色濃く残す古社。","url":"https://www.ookunitamajinja.or.jp/","map":"https://www.google.com/maps/search/大國魂神社+府中","rate":5,"rg":"関東地方","en":{"name":"Okunitama Shrine","desc":"The general shrine of Musashi Province, uniting its six great shrines. Close to central Tokyo yet steeped in the history and solemnity of Musashino."}},{"area":"東京都文京区","name":"湯島天満宮（湯島天神）","desc":"学問の神様・菅原道真を祀る関東を代表する天満宮。受験シーズンをはじめ、多くの参拝客でにぎわう歴史ある神社。","url":"https://www.yushimatenjin.or.jp/","map":"https://www.google.com/maps/search/湯島天神","rate":4,"rg":"関東地方","en":{"name":"Yushima Tenmangu","desc":"A representative Tenmangu of the Kanto region venerating Sugawara no Michizane; busy with students and worshipers, especially in exam season — a historic shrine."}},{"area":"神奈川県鎌倉市","name":"円覚寺","desc":"鎌倉五山第二位の名刹。臨済宗円覚寺派の大本山。国宝の舎利殿や広大な境内に禅の深い精神性が漂う。","url":"https://www.engakuji.or.jp/","map":"https://www.google.com/maps/search/円覚寺+鎌倉","rate":5,"rg":"関東地方","en":{"name":"Engaku-ji Temple","desc":"The second of the Five Mountains of Kamakura and head temple of the Rinzai Engaku-ji school; the National Treasure Shariden and vast grounds breathe deep Zen spirit."}},{"area":"神奈川県鎌倉市","name":"極楽寺","desc":"鎌倉時代に忍性によって開かれた真言律宗の古刹。静寂な境内に歴史の深い物語と美しい自然が調和する。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.trip-kamakura.com/facility/detail.php%3Fid%3D26&ved=2ahUKEwj33ND9p-aVAxWigFYBHTBTPP8QFnoECB4QAQ&usg=AOvVaw2yN6PZBZCHD7X9ijY5MkDB","map":"https://www.google.com/maps/search/極楽寺+鎌倉","rate":4,"rg":"関東地方","en":{"name":"Gokuraku-ji Temple","desc":"A Shingon Ritsu temple opened by the monk Ninsho in the Kamakura era — history's deep stories and beautiful nature in harmony within quiet grounds."}},{"area":"神奈川県藤沢市","name":"江島神社","desc":"日本三大弁財天の一つに数えられる神社。江の島の島内全体を神域とし、海の神・弁財天信仰の中心として栄えてきた。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://enoshimajinja.or.jp/&ved=2ahUKEwjNt6mSqOaVAxX5s1YBHVszDVcQFnoECB8QAQ&usg=AOvVaw3uzjsfNs0it8EIhHP4jwa_","map":"https://www.google.com/maps/search/江島神社","rate":4,"rg":"関東地方","en":{"name":"Enoshima Shrine","desc":"Counted among Japan's three great Benzaiten shrines; the whole island of Enoshima is sacred ground, long the center of faith in the sea goddess Benzaiten."}},{"area":"神奈川県中郡大磯町","name":"高来神社","desc":"相模国の古社。高麗山を背負い、高麗からの渡来人の歴史や山岳信仰の面影を色濃く残す由緒ある神社。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://takakujinja.jp/&ved=2ahUKEwi4h8fHqOaVAxX7k1YBHcCBEwkQFnoECEwQAQ&usg=AOvVaw0kDkz6K7x8nOUvXURmrjEn","map":"https://www.google.com/maps/search/高来神社","rate":3,"rg":"関東地方","en":{"name":"Takaku Shrine","desc":"An old shrine of Sagami Province below Mt. Kora, colored with the history of immigrants from Koguryo and mountain worship — a shrine of pedigree."}},{"area":"千葉県佐倉市","name":"佐倉城址公園（佐倉城跡）","desc":"（名所として）江戸時代の譜代大名・土井氏や堀田氏の居城。日本の100名城の一つであり、広大な敷地に土塁や空堀の遺構が残る。","url":"https://www.sakurashi-kankou.or.jp/facility/kouen/","map":"https://www.google.com/maps/search/佐倉城址公園","rate":4,"rg":"関東地方","en":{"name":"Sakura Castle Park","desc":"The seat of the Doi and Hotta lords of the Edo era, one of Japan's Top 100 castles — earthworks and dry moats remain across the broad grounds."}},{"area":"千葉県富津市","name":"鋸山（日本寺）」","desc":"（名所として）奈良時代に聖徳太子が28体もの仏像を刻んだと伝わる霊山。切り立った岩肌に巨大な日本寺大仏や百尺観音像が彫られている。","url":"https://www.nihonji.jp/","map":"https://www.google.com/maps/search/鋸山日本寺","rate":4,"rg":"関東地方","en":{"name":"Mt. Nokogiri (Nihon-ji)","desc":"A holy mountain where Prince Shotoku is said to have carved 28 Buddhas in the Nara era; the giant Nihon-ji Great Buddha and Hyakushaku Kannon are cut into the sheer rock face."}},{"area":"埼玉県川越市","name":"喜多院","desc":"天台宗の古刹。徳川家康の側近・天海大僧正が住職を務めた。江戸城の紅葉山御殿の一部（家光誕生の間など）が移築され現存する。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kitain.net/&ved=2ahUKEwjzqPubqeaVAxUYs1YBHaUFN3wQFnoECEMQAQ&usg=AOvVaw0hCTPCdQI1xDQ_UsucQRd3","map":"https://www.google.com/maps/search/喜多院+川越","rate":4,"rg":"関東地方","en":{"name":"Kitain Temple","desc":"An old Tendai temple once led by the high priest Tenkai, confidant of Tokugawa Ieyasu; buildings of Edo Castle — including the room of shogun Iemitsu's birth — were moved here and survive."}},{"area":"埼玉県行田市","name":"埼玉古墳群（稲荷山古墳など）","desc":"（名所として）日本最大の古墳群の一つ。国宝の金錯銘鉄剣が出土したことで有名。古代日本の東国の政治力を示す歴史的遺産。","url":"https://note.com/fujiiman/n/n4c5c2e642cb0","map":"https://www.google.com/maps/search/埼玉古墳群","rate":4,"rg":"関東地方","en":{"name":"Sakitama Kofun Group","desc":"One of Japan's greatest groups of ancient tombs, famous for the National Treasure iron sword with a gilt inscription — evidence of the eastern provinces' political power."}},{"area":"茨城県ひたちなか市","name":"水戸東照宮","desc":"徳川家康を祀る神社。水戸藩主・徳川斉昭らによって崇敬され、江戸初期の権現造りの社殿建築が歴史を伝える。","url":"https://gongensan-mito-toshogu.jp","map":"https://www.google.com/maps/search/水戸東照宮","rate":4,"rg":"関東地方","en":{"name":"Mito Toshogu","desc":"A shrine of Tokugawa Ieyasu honored by the Mito lords such as Tokugawa Nariaki; its early-Edo gongen-zukuri buildings convey history."}},{"area":"茨城県つくば市","name":"筑波山神社","desc":"筑波山をご神体とする、関東でも屈指の古社。古代から「西の富士、東の筑波」と称され、山岳信仰の聖地として広く知られる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://tsukubasanjinja.jp/&ved=2ahUKEwiI6uSpquaVAxU1slYBHUPQLugQFnoECEgQAQ&usg=AOvVaw3GPMPmd2pF-xO-P2yallkv","map":"https://www.google.com/maps/search/筑波山神社","rate":5,"rg":"関東地方","en":{"name":"Tsukubasan Shrine","desc":"An old shrine venerating Mt. Tsukuba itself as its deity — paired with Fuji since antiquity as 'Fuji in the west, Tsukuba in the east,' a holy mountain of worship."}},{"area":"栃木県足利市","name":"足利学校（史跡足利学校）","desc":"（名所として）日本最古の学校として知られる中世の最高学府。白亜の塀や講堂が復元され、室町時代の儒学教育の歴史を今に伝える。","url":"https://www.tochigiji.or.jp/spot/s3691","map":"https://www.google.com/maps/search/足利学校","rate":5,"rg":"関東地方","en":{"name":"Ashikaga Gakko","desc":"Known as Japan's oldest academy, a medieval seat of Confucian learning; its white walls and lecture hall have been restored to convey the education of the Muromachi era."}},{"area":"栃木県足利市","name":"鑁阿寺（足利氏宅跡）","desc":"足利氏の氏寺であり、足利尊氏の祖先ゆかりの史跡。国宝の本堂（大日堂）をはじめ、周囲に巡らされた水堀や土塁が中世武家屋敷の面影を残す。","url":"https://www.city.ashikaga.tochigi.jp/education/000029/000169/000627/p001273.html","map":"https://www.google.com/maps/search/鑁阿寺","rate":4,"rg":"関東地方","en":{"name":"Banna-ji Temple","desc":"The family temple of the Ashikaga clan and heritage of Ashikaga Takauji's ancestors; the National Treasure main hall, moats and earthworks recall a medieval warrior residence."}},{"area":"群馬県高崎市","name":"榛名神社","desc":"榛名山の中腹に鎮座する古社。奇岩・巨岩に囲まれた厳かな境内に、歴史ある社殿や本殿が深く溶け込むパワースポット。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.haruna.or.jp/&ved=2ahUKEwjfnNWOq-aVAxX1glYBHclZHXcQFnoECE4QAQ&usg=AOvVaw2qBFXpduqR0zlbGlIOhBbO","map":"https://www.google.com/maps/search/榛名神社","rate":4,"rg":"関東地方","en":{"name":"Haruna Shrine","desc":"An old shrine on the slopes of Mt. Haruna, its historic halls set among strange great rocks — a power spot where nature and faith merge."}},{"area":"東京都墨田区","name":"回向院","desc":"明暦の大火の犠牲者を弔うために建立された浄土宗の寺院。また、大相撲発祥の地としても歴史的に非常に著名。","url":"https://www.ekoin.or.jp/","map":"https://www.google.com/maps/search/回向院+両国","rate":4,"rg":"関東地方","en":{"name":"Ekoin Temple","desc":"A Jodo temple founded to mourn the victims of the Great Meireki Fire — historically renowned too as the birthplace of professional sumo."}},{"area":"東京都台東区","name":"寛永寺","desc":"徳川将軍家の菩提寺（増上寺とともに二大菩提寺）。かつては上野の山一帯を境内とする広大無辺な寺院であった。","url":"https://kaneiji.jp/","map":"https://www.google.com/maps/search/寛永寺+上野","rate":4,"rg":"関東地方","en":{"name":"Kan'ei-ji Temple","desc":"Family temple of the Tokugawa shoguns together with Zojo-ji, once a vast temple commanding the whole of Ueno hill."}},{"area":"東京都目黒区","name":"目黒不動尊（龍泉寺）","desc":"日本三大不動の一つ。天台宗の古刹で、平安時代の慈覚大師が開いたと伝わる。江戸の五色不動の一つとして庶民信仰を集めた。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://megurofudo.jp/&ved=2ahUKEwjrw8Onq-aVAxUHsFYBHcWJCT4QFnoECEUQAQ&usg=AOvVaw0jAL9nadfG5KcI4qsOpnPK","map":"https://www.google.com/maps/search/目黒不動尊","rate":4,"rg":"関東地方","en":{"name":"Meguro Fudoson (Ryusen-ji)","desc":"One of Japan's three great Fudo temples — an old Tendai temple said to be founded by the monk Jikaku Daishi in the Heian era; as one of Edo's Five-Colored Fudo it gathered the faith of the townsfolk."}},{"area":"神奈川県鎌倉市","name":"鎌倉宮（大塔宮護良親王）","desc":"明治天皇の勅命により創建された神社。後醍醐天皇の皇子である護良親王を祀り、建武の新政と中世動乱の歴史を伝える。","url":"https://www.kamakuraguu.jp/","map":"https://www.google.com/maps/search/鎌倉宮","rate":4,"rg":"関東地方","en":{"name":"Kamakura-gu Shrine","desc":"Founded by decree of Emperor Meiji, enshrining Prince Morinaga, son of Emperor Go-daigo — conveying the Kenmu Restoration and the turmoil of the middle ages."}},{"area":"神奈川県鎌倉市","name":"浄妙寺","desc":"鎌倉五山第五位の寺院。臨済宗建長寺派の名刹で、美しい庭園や鎌倉唯一の境内での「お抹茶」体験でも知られる。","url":"https://www.tokasan-jomyoji.com/","map":"https://www.google.com/maps/search/浄妙寺+鎌倉","rate":4,"rg":"関東地方","en":{"name":"Jomyo-ji Temple","desc":"The fifth of the Five Mountains of Kamakura, a Rinzai Kencho-ji school temple known for its beautiful garden and for matcha served in its grounds — unique in Kamakura."}},{"area":"神奈川県横浜市金沢区","name":"金沢文庫周辺の「称名寺」","desc":"北条実時が創建した武家文化の拠点で、中世の仏教文化を伝える名刹。朱塗りの赤門と平庭式浄土庭園が美しい。","url":"https://yokokanaguide.org/?page_id=19438","map":"https://www.google.com/maps/search/称名寺+横浜","rate":4,"rg":"関東地方","en":{"name":"Shomyo-ji Temple","desc":"Founded by Hojo Sanetoki as a hub of warrior culture, conveying medieval Buddhist art — its vermilion gate and pure-land garden are beautiful."}},{"area":"神奈川県平塚市","name":"平塚八幡宮","desc":"仁徳天皇の時代に創建されたと伝わる相模国の古社。地域の鎮守として、長い歴史と格式を持つ。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.hachiman.org/&ved=2ahUKEwjLlda8reeVAxWMjq8BHe2LLqoQFnoECE8QAQ&usg=AOvVaw0NbRpk9EZv3zJ60T23E6Yi","map":"https://www.google.com/maps/search/平塚八幡宮","rate":3,"rg":"関東地方","en":{"name":"Hiratsuka Hachimangu","desc":"An old shrine of Sagami said to be founded in the age of Emperor Nintoku — the district's guardian with long history and dignity."}},{"area":"千葉県館山市","name":"安房神社","desc":"安房国の一宮。日本産業・忌部氏の祖神を祀り、古代から東国の発展を支えた極めて格式の高い古社。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://awajinjya.org/&ved=2ahUKEwia4P3RreeVAxUvh1YBHc9xB8YQFnoECFIQAQ&usg=AOvVaw1-zhMdOe_6bHptHQQF775t","map":"https://www.google.com/maps/search/安房神社","rate":4,"rg":"関東地方","en":{"name":"Awa Shrine","desc":"The ichinomiya of Awa Province, enshrining the ancestral god of the Inbe clan, key to the eastern provinces since antiquity — a shrine of the highest pedigree."}},{"area":"千葉県木更津市","name":"吾妻神社","desc":"日本武尊の東征伝説において弟橘媛が身を投げた伝説に由来する、ロマンあふれる房総の古社。","url":"https://www.warinomiya.org","map":"https://www.google.com/maps/search/吾妻神社+木更津","rate":3,"rg":"関東地方","en":{"name":"Azuma Shrine","desc":"An old shrine of Boso full of romance, arising from the legend of Princess Ototachibana, who leapt into the sea during Yamato Takeru's eastern campaign."}},{"area":"埼玉県飯能市","name":"能仁寺","desc":"室町時代に創建された曹洞宗の名刹。美しい庭園や、黒田官房ゆかりの伝承、武蔵野の豊かな自然が調和する寺院。","url":"https://www.noninji.com/","map":"https://www.google.com/maps/search/能仁寺+飯能","rate":3,"rg":"関東地方","en":{"name":"Nōnin-ji Temple","desc":"A Soto temple founded in the Muromachi era, where beautiful gardens, lore tied to the Kuroda family and the rich nature of Musashino are in harmony."}},{"area":"茨城県笠間市","name":"笠間稲荷神社","desc":"日本三大稲荷の一つに数えられる古社。重厚な江戸末期の社殿彫刻が見事で、五穀豊穣・商売繁盛の信仰を集める。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.kasama.or.jp/&ved=2ahUKEwjb_ZPdrueVAxXSqVYBHUwtGLEQFnoECFMQAQ&usg=AOvVaw1vv1AkaiHPv9_6WKqB6SvJ","map":"https://www.google.com/maps/search/笠間稲荷神社","rate":4,"rg":"関東地方","en":{"name":"Kasama Inari Shrine","desc":"Counted among Japan's three great Inari shrines; its weighty late-Edo carvings are superb, drawing faith in bountiful harvests and business prosperity."}},{"area":"茨城県桜川市","name":"雨引観音（和順山法起院）","desc":"西国三十三所に準じられる坂東三十三観音の第24番札所。安産子育ての霊場として名高く、境内には美しい孔雀やアジサイが広がる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.amabiki.or.jp/&ved=2ahUKEwijttSMr-eVAxVlr1YBHSi5HqAQFnoECFgQAQ&usg=AOvVaw2ahBE-m6v5GmevZOEh7Sjr","map":"https://www.google.com/maps/search/雨引観音","rate":4,"rg":"関東地方","en":{"name":"Amabiki Kannon","desc":"The 24th temple of the Bando Kannon pilgrimage, famed for safe childbirth and child-rearing, with peacocks and hydrangeas gracing its grounds."}},{"area":"栃木県宇都宮市","name":"二荒山神社（下野国一之宮）","desc":"宇都宮の名の由来ともなった下野国の一宮。1600年以上の歴史を持ち、北関東の政治・信仰の中心として栄えた。","url":"https://www.google.com/url?sa=i&source=web&rct=j&url=http://futaarayamajinja.jp/&ved=2ahUKEwjfhcjeseeVAxWTsFYBHXNdNaIQy_kOegYIAQgPEAI&opi=89978449&cd&psig=AOvVaw0CCQsPyRN0T-o2T6FniNB4&ust=1784847641741000","map":"https://www.google.com/maps/search/宇都宮二荒山神社","rate":4,"rg":"関東地方","en":{"name":"Futarasan Shrine (Utsunomiya)","desc":"The ichinomiya of Shimotsuke, origin of the name 'Utsunomiya'; with over 1,600 years of history as the political and spiritual center of northern Kanto."}},{"area":"栃木県下野市","name":"国分寺跡（下野国分寺・薬師寺跡）","desc":"（名所として）奈良時代に聖武天皇の詔によって建立された下野国の国分寺・国分尼寺の跡。天平の歴史ロマンを伝える史跡公園。","url":"https://www.city.shimotsuke.lg.jp/0393/info-0000000641-3.html","map":"https://www.google.com/maps/search/下野国分寺跡","rate":3,"rg":"関東地方","en":{"name":"Ruins of Shimotsuke Kokubun-ji","desc":"The Nara-era provincial temple and nunnery founded by decree of Emperor Shomu — a historic park of Tenpyo romance."}},{"area":"東京都新宿区","name":"赤城神社","desc":"神楽坂に鎮座する、Kengo Kuma（隈研吾）氏がデザインを手掛けた近代的な社殿が特徴の古社。スタイリッシュな空間と歴史が見事に融合。","url":"https://www.akagi-jinja.jp/","map":"https://www.google.com/maps/search/赤城神社+神楽坂","rate":4,"rg":"関東地方","en":{"name":"Akagi Shrine","desc":"An old shrine in the Kagurazaka district, notable for its modern hall designed by the architect Kengo Kuma — stylish design and history in striking harmony."}},{"area":"東京都台東区","name":"小野照崎神社","desc":"平安時代の歌人・学者である小野篁を祀る古社。渥美清ゆかりの神社としても知られ、学問や芸能の信仰を集める。","url":"https://onoteru.or.jp/","map":"https://www.google.com/maps/search/小野照崎神社","rate":4,"rg":"関東地方","en":{"name":"Onoterusaki Shrine","desc":"An old shrine of the Heian poet-scholar Ono no Takamura, also tied to the actor Kiyoshi Atsumi — worshiped for learning and the arts."}},{"area":"東京都世田谷区","name":"世田谷代官屋敷（大場家住宅）","desc":"（名所として）彦根藩世田谷領の代官を世襲した大場家の宅地。江戸時代の代官屋敷として都内に現存する唯一の貴重な史跡。","url":"https://www.city.setagaya.lg.jp/02059/3563.html","map":"https://www.google.com/maps/search/世田谷代官屋敷","rate":3,"rg":"関東地方","en":{"name":"Setagaya Daikanyashiki","desc":"The residence of the Oba family, hereditary stewards of Setagaya for the Hikone domain — the only surviving Edo-era daikanyashiki in Tokyo, a precious site."}},{"area":"神奈川県鎌倉市","name":"宝戒寺","desc":"北条氏の執権屋敷跡に建てられた天台宗の寺院。萩の寺としても知られ、中世滅亡の歴史を弔う深い祈りの場。","url":"https://hokaiji.com","map":"https://www.google.com/maps/search/宝戒寺+鎌倉","rate":4,"rg":"関東地方","en":{"name":"Hokai-ji Temple","desc":"A Tendai temple on the former residence of the Hojo regents, known as the temple of bush clover — a place of deep prayer mourning the fall of the medieval regime."}},{"area":"神奈川県鎌倉市","name":"覚園寺","desc":"源頼朝が建てた大倉薬師堂を起源とする古刹。薬師三尊像をはじめとする重厚な仏像と、深い谷戸の原生林に囲まれた神秘的な雰囲気。","url":"https://kakuenji.com/","map":"https://www.google.com/maps/search/覚園寺+鎌倉","rate":4,"rg":"関東地方","en":{"name":"Kakuen-ji Temple","desc":"An old temple originating in the Okura Yakushi-do founded by Minamoto no Yoritomo, with weighty Buddhist statues and a mystical air of the deep forested valley."}},{"area":"神奈川県中郡大磯町","name":"旧島崎藤村邸周辺の「大磯宿（東海道宿場町跡）」","desc":"（名所として）東海道の宿場町として栄えた歴史あるエリア。多くの文豪が愛した歴史的景観が残る。","url":"https://www.town.oiso.kanagawa.jp/isotabi/meguru/pagedate/14423.html","map":"https://www.google.com/maps/search/大磯宿","rate":3,"rg":"関東地方","en":{"name":"Oiso-juku (Tokaido Post Town)","desc":"A historic area that flourished as a post town on the Tokaido, retaining streetscapes beloved by many literary greats."}},{"area":"千葉県成田市","name":"宗吾霊堂（鳴鐘山東勝寺）","desc":"江戸時代に農民救済のために命を捧げた佐倉惣五郎（木内惣五郎）を祀る寺院。義民の精神を伝える歴史の舞台。","url":"https://sougoreidou.or.jp/","map":"https://www.google.com/maps/search/宗吾霊堂","rate":4,"rg":"関東地方","en":{"name":"Sogu Reido (Toshun-zan Tosho-ji)","desc":"A temple enshrining Sakura Sogoro, who gave his life for oppressed farmers in the Edo era — the stage of a story of righteous spirit."}},{"area":"千葉県館山市","name":"城山公園（館山城跡・里見氏博物館）","desc":"（名所として）戦国時代の名門・里見氏の居城跡。滝沢馬琴の『南総里見八犬伝』の舞台となった歴史とロマンが息づくスポット。","url":"https://tateyamacastle.jp","map":"https://www.google.com/maps/search/館山城跡","rate":4,"rg":"関東地方","en":{"name":"Shiroyama Park (Tateyama Castle)","desc":"The seat of the Satomi clan, great Sengoku family of Boso and stage of the Nanso Satomi Hakkenden — a place of history and romance."}},{"area":"埼玉県本庄市","name":"金鑚神社","desc":"本殿を持たせず、御嶽山そのものを神体として拝する古代からの自然信仰の形を色濃く残す武蔵国の古社。国の重要文化財の多宝塔も立つ。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kanasana.jp/&ved=2ahUKEwjP9PXLteiVAxVNXesIHd_ZFT8QFnoECEMQAQ&usg=AOvVaw3OCErZhb1KEUPjL51AcQrL","map":"https://www.google.com/maps/search/金鑚神社","rate":4,"rg":"関東地方","en":{"name":"Kanasana Shrine","desc":"An old shrine of Musashi preserving ancient nature worship, venerating the mountain itself as its deity without a main hall; an Important Cultural Property pagoda also stands."}},{"area":"埼玉県春日部市","name":"牛島藤花園周辺の「古利根川周辺の歴史的町並み」","desc":"（名所として）江戸時代の利根川水運の要所として栄えた歴史的背景を持つエリア。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://machinagi.com/kasukabe-furutone-river-ushijima-fuji-walk/&ved=2ahUKEwjzmJT8teiVAxUM5DQHHfCVBrQQFnoECCwQAQ&usg=AOvVaw2tX2pLQ2T68jOz63gmdlNk","map":"https://www.google.com/maps/search/春日部市","rate":3,"rg":"関東地方","en":{"name":"Historic Streets along the Old Tone River","desc":"An area with the history of a key point of Edo-period Tone river transport."}},{"area":"茨城県常陸太田市","name":"常陸太田の旧城下町周辺の「久昌寺」","desc":"水戸徳川家の菩提寺の一つ。徳川光圀（水戸黄門）が建立に関わった歴史を持ち、壮麗な山門や重厚な建物が並ぶ。","url":"https://www.kanko-hitachiota.com/page/page000044.html","map":"https://www.google.com/maps/search/久昌寺+常陸太田","rate":4,"rg":"関東地方","en":{"name":"Kyusho-ji Temple","desc":"A family temple of the Mito Tokugawa, built with the involvement of Tokugawa Mitsukuni of 'Mito Komon' fame — stately gates and weighty buildings."}},{"area":"茨城県下妻市","name":"大宝八幡宮","desc":"大宝元年創建の関東最古の八幡宮。平将門の乱の際にもゆかりがあり、歴史の重みを伝える風格ある神社。","url":"https://www.daiho.or.jp/index.html","map":"https://www.google.com/maps/search/大宝八幡宮","rate":4,"rg":"関東地方","en":{"name":"Daiho Hachimangu","desc":"The oldest Hachiman shrine of the Kanto, founded in 701, with ties to Taira no Masakado's revolt — a shrine of historic weight."}},{"area":"栃木県日光市","name":"中禅寺湖・立木観音（輪王寺別院）","desc":"坂東三十三観音の第18番札所。中禅寺湖畔の巨木（立木のままの桂）に彫られた千手観音を安置する、日光の霊場。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.rinnoji.or.jp/history/temple/chuzenji/&ved=2ahUKEwjS0NL9tuiVAxVwl1YBHRVsCMQQFnoECBoQAQ&usg=AOvVaw3t0OysnXsD5pcApA_BEXEV","map":"https://www.google.com/maps/search/立木観音+日光","rate":4,"rg":"関東地方","en":{"name":"Lake Chuzenji & Tachiki Kannon","desc":"The 18th temple of the Bando Kannon pilgrimage — a Nikko sanctuary by Lake Chuzenji housing the thousand-armed Kannon carved into a living tree."}},{"area":"栃木県真岡市","name":"大前神社","desc":"恵比寿様を祀る日本一大きな「日本一えびす様」の銅像で知られる、1500年以上の歴史を持つ下野国の古社。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://oosakijinja.com/&ved=2ahUKEwjQ8rWRt-iVAxVEs1YBHda6JGoQFnoECBkQAQ&usg=AOvVaw147B95H9_VWwoCqlpXdi-z","map":"https://www.google.com/maps/search/大前神社","rate":3,"rg":"関東地方","en":{"name":"Omae Shrine","desc":"A shrine of Shimotsuke with over 1,500 years of history, known for Japan's largest statue of the god Ebisu."}},{"area":"群馬県安中市","name":"妙義神社","desc":"妙義山の険しい山容を背負い、江戸時代に再建された絢爛豪華な社殿が並ぶ古社。独特の圧倒的な景観と歴史的価値を誇る。","url":"https://myougi.or.jp/","map":"https://www.google.com/maps/search/妙義神社","rate":4,"rg":"関東地方","en":{"name":"Myogi Shrine","desc":"An old shrine backed by the craggy peaks of Mt. Myogi, with lavish halls rebuilt in the Edo era — a landscape and historic value all its own."}},{"area":"東京都千代田区","name":"靖国神社","desc":"近代日本の歴史において重要な役割を果たした神社。広大な境内と遊就館（歴史博物館）を有し、深い歴史的背景を持つ。","url":"https://www.yasukuni.or.jp/","map":"https://www.google.com/maps/search/靖国神社","rate":5,"rg":"関東地方","en":{"name":"Yasukuni Shrine","desc":"A shrine that has played a major role in the history of modern Japan, with vast grounds and the Yushukan history museum carrying deep historical meaning."}},{"area":"埼玉県秩父市","name":"三峯神社","desc":"標高約1100mの山中に鎮座する関東屈指の古社。日本武尊の創祀と伝わり、オオカミ信仰（大口真神）と厳かな気高い気で知られる聖地。","url":"https://www.mitsuminejinja.or.jp/","map":"https://www.google.com/maps/search/三峯神社","rate":5,"rg":"関東地方","en":{"name":"Mitsumine Shrine","desc":"A foremost old shrine of the Kanto region at about 1,100m in the mountains, traditionally founded by Yamato Takeru and famous for its wolf (Ookami Inu) faith and solemn dignity."}},{"area":"茨城県水戸市","name":"弘道館","desc":"（名所として）日本最大規模の藩校であり、幕末の文武修行の場。水戸の歴史と日本の近代化への道筋を伝える最高学府の遺構。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kodokan-ibaraki.jp/&ved=2ahUKEwihhvPut-iVAxUGrlYBHc0NMLIQFnoECCEQAQ&usg=AOvVaw3jLaWN3ZUoqGrGka6dtsSn","map":"https://www.google.com/maps/search/弘道館+水戸","rate":5,"rg":"関東地方","en":{"name":"Kodo-kan Academy","desc":"The largest domain school in Japan and a place of letters and arms at the end of the Edo era — the remains of a great academy on the road to Japan's modernization."}},{"area":"栃木県日光市","name":"日光山輪王寺（三仏堂・大猷院）","desc":"世界遺産。天台宗の別格本山。日光三山の仏を祀る三仏堂や、徳川家光公の廟所である絢爛豪華な大猷院が並ぶ最高峰の霊場。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.rinnoji.or.jp/history/temple/taiyuuin.html&ved=2ahUKEwjtp-2OuOiVAxWItlYBHWkENTUQFnoECEUQAQ&usg=AOvVaw3fejkLHkXW_V04gAP0yrDz","map":"https://www.google.com/maps/search/日光山輪王寺","rate":5,"rg":"関東地方","en":{"name":"Rinno-ji Temple, Nikko","desc":"A World Heritage temple, the special head temple of the Tendai school: the Sanbutsudo enshrining the gods of Nikko's three mountains, and the gorgeous Taiyu-in mausoleum of shogun Tokugawa Iemitsu."}},{"area":"群馬県甘楽郡下仁田町","name":"一之宮貫前神社（社殿・国宝重要文化財エリア）","desc":"上野国の一宮。全国でも極めて珍しい「下り宮」の構造を持ち、桃山〜江戸初期の粋を集めた絢爛豪華な本殿等が国指定重要文化財。","url":"https://www.google.com/url?sa=i&source=web&rct=j&url=http://www.nukisaki.or.jp/&ved=2ahUKEwjfhcjeseeVAxWTsFYBHXNdNaIQy_kOegYIAQgPECg&opi=89978449&cd&psig=AOvVaw0CCQsPyRN0T-o2T6FniNB4&ust=1784847641741000","map":"https://www.google.com/maps/search/貫前神社","rate":5,"rg":"関東地方","en":{"name":"Ichinomiya Nukisaki Shrine","desc":"The ichinomiya of Kozuke Province, with the extremely rare 'descending shrine' layout; its lavish Momoyama-to-Edo era halls are Important Cultural Properties."}},{"area":"東京都品川区","name":"品川神社","desc":"源頼朝が海上安全と祈願の願いを込めて創建した古社。東海七福神の一つであり、品川の宿場町の歴史を今に伝える。","url":"https://shinagawajinja.tokyo/","map":"https://www.google.com/maps/search/品川神社","rate":4,"rg":"関東地方","en":{"name":"Shinagawa Shrine","desc":"An old shrine founded by Minamoto no Yoritomo with prayers for safety at sea; one of the Tokaido Seven Gods of Fortune, conveying the history of the Shinagawa post town."}},{"area":"東京都板橋区","name":"板橋宿（平尾一里塚など）","desc":"（名所として）中山道の江戸から最初の宿場町。往時の名残をとどめる一里塚が国の史跡として現存する。","url":"https://smtrc.jp/town-archives/city/itabashi/index.html","map":"https://www.google.com/maps/search/板橋宿","rate":3,"rg":"関東地方","en":{"name":"Itabashi-juku","desc":"The first post town out of Edo on the Nakasendo; its milestone survives as a National Historic Site."}},{"area":"神奈川県中郡大磯町","name":"照ヶ崎海岸周辺の「東海道松並木（大磯）」","desc":"（名所として）江戸時代からの東海道の面影を残す松並木。相模湾を望む歴史的な街道景観が広がる。","url":"https://www.oiso-kankou.or.jp/?p=we-page-entry&spot=27590&cat=19117&pageno=3&type=list","map":"https://www.google.com/maps/search/大磯の松並木","rate":3,"rg":"関東地方","en":{"name":"Tokaido Pine Rows (Oiso)","desc":"Pine rows preserving the legacy of the Edo-period Tokaido, along historic road scenery facing Sagami Bay."}},{"area":"神奈川県小田原市","name":"小田原の報徳二宮神社","desc":"農政家・思想家として知られる二宮尊徳（金次郎）を祀る神社。小田原城址公園内に鎮座し、勤勉と報徳の精神を伝える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.ninomiya.or.jp/&ved=2ahUKEwj6uriwueiVAxU7sVYBHbP1EewQFnoECEoQAQ&usg=AOvVaw3k9wdRItUKNznIkQlO0l12","map":"https://www.google.com/maps/search/報徳二宮神社+小田原","rate":4,"rg":"関東地方","en":{"name":"Hotoku Ninomiya Shrine","desc":"A shrine of Ninomiya Sontoku, the agrarian reformer and thinker, in Odawara Castle Park — conveying the spirit of diligence and repaying virtue."}},{"area":"千葉県佐倉市","name":"国立歴史民俗博物館周辺の「佐倉武家屋敷群」","desc":"（名所として）江戸時代に佐倉藩の武士たちが暮らした武家屋敷がそのまま保存されている貴重な歴史的エリア。","url":"https://www.rekihaku.ac.jp/","map":"https://www.google.com/maps/search/佐倉武家屋敷","rate":4,"rg":"関東地方","en":{"name":"Sakura Samurai Residences","desc":"The samurai residences of the Sakura domain preserved as they were in the Edo era — a precious historic area near the National Museum of Japanese History."}},{"area":"埼玉県比企郡嵐山町","name":"杉山城跡","desc":"（名所として）中世の山城の構造がほぼ完全に残る、「城マニアの聖地」とも称される国史跡の要所。","url":"http://ranzan-sugiyama.jp","map":"https://www.google.com/maps/search/杉山城跡","rate":4,"rg":"関東地方","en":{"name":"Sugiyama Castle Ruins","desc":"A National Historic Site with the structure of a medieval mountain castle almost perfectly intact — called a 'mecca for castle fans.'"}},{"area":"茨城県結城市","name":"結城の歴史的町並み（弘経寺など）","desc":"（名所として）結城紬の産地として知られ、中世から続く寺社や古い町家が点在する歴史的風情のある街。","url":"https://www.ibatabi.com/yuuki/kougyou.html","map":"https://w ":"北海道開拓の村","desc":"明治期の建物を移築復元した野外博物館。開拓の息吹を体感できる名所。","url":"https://www.kaitaku.or.jp/","map":"https://www.google.com/maps/search/%E5%8C%97%E6%B5%B7%E9%81%93%E9%96%8B%E6%8B%93%E3%81%AE%E6%9D%91%20%E6%9C%AD%E5%B9%8C%E5%B8%82%E6%9D%B1%E5%8C%BA","rate":4,"rg":"北海道","en":{"name":"Historical Village of Hokkaido","desc":"An open-air museum of relocated and restored Meiji-era buildings — the breath of the pioneering era made tangible."}},{"area":"小樽市","name":"小樽運河","desc":"明治期の運河。石造倉庫とガス灯が残す港町の叙情。","url":"https://www.otaru.gr.jp/","map":"https://www.google.com/maps/search/%E5%B0%8F%E6%A8%BD%E9%81%8B%E6%B2%B3%20%E5%B0%8F%E6%A8%BD%E5%B8%82","rate":5,"rg":"北海道","en":{"name":"Otaru Canal","desc":"A Meiji-era canal where stone warehouses and gas lamps keep the lyricism of an old port town."}},{"area":"函館市","name":"五稜郭公園","desc":"星形要塞で知られる幕末の西洋式城郭。箱館戦争の舞台。","url":"https://www.goryokaku-tower.co.jp/","map":"https://www.google.com/maps/search/%E4%BA%94%E7%A8%9C%E9%83%AD%E5%85%AC%E5%9C%92%20%E5%87%BD%E9%A4%A8%E5%B8%82","rate":5,"rg":"北海道","en":{"name":"Goryokaku Park","desc":"A star-shaped Western fortress of the late Edo era and the stage of the Battle of Hakodate."}},{"area":"函館市","name":"函館奉行所","desc":"五稜郭内に復元された幕末の幕府出先機関。歴史の舞台を伝える。","url":"https://hakodate-bugyosho.jp/","map":"https://www.google.com/maps/search/%E5%87%BD%E9%A4%A8%E5%A5%89%E8%A1%8C%E6%89%80%20%E5%87%BD%E9%A4%A8%E5%B8%82","rate":4,"rg":"北海道","en":{"name":"Hakodate Magistrate's Office","desc":"The restored Edo-era shogunate office within Goryokaku — the stage of history brought back to life."}},{"area":"函館市","name":"函館元町（教会群と坂道）","desc":"港を見下ろす坂道と異国情緒あふれる教会群の景観。","url":"https://www.hakodate.travel/","map":"https://www.google.com/maps/search/%E5%87%BD%E9%A4%A8%E5%85%83%E7%94%BA%EF%BC%88%E6%95%99%E4%BC%9A%E7%BE%A4%E3%81%A8%E5%9D%82%E9%81%93%EF%BC%89%20%E5%87%BD%E9%A4%A8%E5%B8%82","rate":4,"rg":"北海道","en":{"name":"Motomachi, Hakodate","desc":"Slopes overlooking the harbor and a church district full of exotic charm.     return hay.includes(q);
  });
  if (state.sort === 'rate'){ out.sort((a,b) => (b.rate||0)-(a.rate||0) || a.name.localeCompare(b.name,'ja')); }
  else { out.sort((a,b) => entryName(a).localeCompare(entryName(b), lang === 'en' ? 'en' : 'ja')); }
  return out;
}
function renderTabs(){
  const tabs = [null, ...DATA.regions];
  $('tabs').innerHTML = tabs.map(r => {
    const slug = r ? r.slug : '__all__';
    const active = state.region === (r ? r.id : '__all__');
    const label = r ? regionLabel(r.id) : t('allRegions');
    return '<button data-tab="' + esc(slug) + '" class="shrink-0 rounded-full border px-4 py-1.5 text-sm font-medium whitespace-nowrap ' + (active ? 'tab-active' : 'tab-inactive') + '">' + esc(label) + '</button>';
  }).join('');
}
let areaOptions = [];
function renderControls(){
  $('search').placeholder = t('searchPh');
  const areas = [...new Set(allEntriesOf(state.region).map(e => e.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  if (state.area && !areas.includes(state.area)) state.area = '';
  areaOptions = areas;
  $('areaSel').innerHTML = '<option value="-1">' + esc(t('allAreas')) + '</option>' + areas.map((a, i) => '<option value="' + i + '"' + (a === state.area ? ' selected' : '') + '>' + esc(areaLabel(a)) + '</option>').join('');
  $('rateSel').innerHTML = [['0','rateAll'],['3','rate3'],['4','rate4'],['5','rate5']].map(x => '<option value="' + x[0] + '"' + (String(state.rate) === x[0] ? ' selected' : '') + '>' + esc(t(x[1])) + '</option>').join('');
  $('sortSel').innerHTML = '<option value="rate"' + (state.sort === 'rate' ? ' selected' : '') + '>' + esc(t('sortRate')) + '</option><option value="name"' + (state.sort === 'name' ? ' selected' : '') + '>' + esc(t('sortName')) + '</option>';
}
function renderCards(){
  const list = currentEntries();
  $('count').textContent = list.length + ' ' + t('showing');
  const el = $('cards');
  $('empty').classList.toggle('hidden', list.length > 0);
  $('empty').textContent = t('empty');
  el.innerHTML = list.map(e => {
    const d = entryDesc(e);
    const rate = e.rate || 0;
    const badge = rate >= 5 ? '<span class="inline-block rounded bg-gold/15 text-gold border border-gold/40 px-2 py-0.5 text-[11px] font-bold tracking-wider">' + esc(t('featured')) + '</span>' : '';
    const jaNote = d.jaOnly ? '<p class="text-[11px] text-sumi/40 italic mt-2">' + esc(t('jaOnlyNote')) + '</p>' : '';
    return '<article class="card bg-paper border border-sumi/10 rounded-xl overflow-hidden flex flex-col">' +
      '<div class="h-1 ' + (rate >= 5 ? 'bg-gold' : rate >= 4 ? 'bg-aka/70' : 'bg-sumi/20') + '"></div>' +
      '<div class="p-5 flex-1 flex flex-col">' +
        '<div class="flex items-start justify-between gap-2 mb-1">' +
          '<h3 class="font-serifjp font-bold text-lg leading-snug">' + esc(entryName(e)) + '</h3>' +
          (rate ? '<span class="shrink-0 text-gold text-sm whitespace-nowrap" title="' + rate + '/5">' + stars(rate) + '</span>' : '') +
        '</div>' +
        '<div class="flex items-center gap-2 flex-wrap mb-3">' + badge +
          '<span class="inline-block rounded bg-ai/10 text-ai px-2 py-0.5 text-[11px]">' + esc(areaLabel(e.area)) + '</span>' +
        '</div>' +
        '<p class="clamp text-sm leading-relaxed text-sumi/80" title="' + esc(d.text) + '">' + esc(d.text) + '</p>' + jaNote +
        '<div class="mt-auto pt-4 border-t border-sumi/10 flex gap-2">' +
          '<a href="' + esc(encodeURI(e.url)) + '" target="_blank" rel="noopener noreferrer" class="flex-1 text-center rounded-lg border border-aka text-aka px-3 py-2 text-xs font-semibold hover:bg-aka hover:text-paper transition">' + esc(t('official')) + ' ↗</a>' +
          '<a href="' + esc(encodeURI(e.map)) + '" target="_blank" rel="noopener noreferrer" class="flex-1 text-center rounded-lg bg-sumi text-paper px-3 py-2 text-xs font-semibold hover:bg-ai transition">' + esc(t('map')) + ' ↗</a>' +
        '</div>' +
      '</div></article>';
  }).join('');
}
function applyStatic(){
  const L = I18N[lang];
  document.documentElement.lang = lang === 'ja' ? 'ja' : 'en';
  document.title = lang === 'ja' ? '日本の社寺・名所ガイド | Japan Shrines & Temples Guide' : 'Japan Shrines & Temples Guide — \"Jinja\" & \"Jiin\" of Japan';
  $('siteTitle').textContent = L.siteTitle;
  $('heroKicker').textContent = L.kicker;
  $('heroTitle').textContent = L.heroTitle;
  $('heroSub').textContent = L.heroSub;
  $('footerNote').textContent = L.footer;
  $('footerTagline').textContent = L.tagline;
  $('langJa').className = 'px-3 py-1.5 font-medium ' + (lang === 'ja' ? 'bg-sumi text-paper' : 'hover:bg-washi');
  $('langEn').className = 'px-3 py-1.5 font-medium border-l border-sumi/15 ' + (lang === 'en' ? 'bg-sumi text-paper' : 'hover:bg-washi');
}
function renderAll(){ applyStatic(); renderTabs(); renderControls(); renderCards(); }
$('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('[data-tab]');
  if (!b) return;
  const slug = b.getAttribute('data-tab');
  const r = regionBySlug(slug);
  state.region = r ? r.id : '__all__';
  state.area = '';
  renderTabs(); renderControls(); renderCards();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
$('search').addEventListener('input', ev => { state.q = ev.target.value; renderCards(); });
$('areaSel').addEventListener('change', ev => {
  const i = parseInt(ev.target.value, 10);
  state.area = (i >= 0 && i < areaOptions.length) ? areaOptions[i] : '';
  renderCards();
});
$('rateSel').addEventListener('change', ev => { state.rate = parseInt(ev.target.value, 10) || 0; renderCards(); });
$('sortSel').addEventListener('change', ev => { state.sort = ev.target.value; renderCards(); });
$('langJa').addEventListener('click', () => { lang = 'ja'; localStorage.setItem('shaji-lang', 'ja'); renderAll(); });
$('langEn').addEventListener('click', () => { lang = 'en'; localStorage.setItem('shaji-lang', 'en'); renderAll(); });
renderAll();
</script>
</body>
</html>
