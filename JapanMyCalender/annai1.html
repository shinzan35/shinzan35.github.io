=89978449&url=https://www.higashihonganji.or.jp/about/guide/shoseien/&ved=2ahUKEwjh9c38m96VAxVRgFYBHeI2K10QFnoECGEQAQ&usg=AOvVaw1V8R0_hZTIZUHyNlioaUR8","map":"https://www.google.com/maps/search/東本願寺+阿弥陀堂門","rate":3,"rg":"★京都","en":{"name":"Shosei-en Garden","desc":"Shosei-en is the detached garden precinct of Higashi Hongwan-ji."}},{"area":"下京区","name":"西本願寺周辺の「龍谷ミュージアム」","desc":"仏教文化を学ぶ拠点。歴史的な資料と美術品を展示。伝統を現代に伝える施設。","url":"https://museum.ryukoku.ac.jp/","map":"https://www.google.com/maps/search/龍谷ミュージアム","rate":3,"rg":"★京都","en":{"name":"Ryukoku Museum","desc":"A hub for learning Buddhist culture, exhibiting historic documents and art — a facility conveying tradition to the present."}},{"area":"下京区","name":"大宮通の周辺（島原大門エリア）","desc":"かつての京都の公認花街。歴史的な「大門」が残る。街並みに当時の雰囲気を垣間見ることができ、京都の多様な歴史的側面を知る場所。","url":"https://travel.jr-central.co.jp/plan/area/kyoto/guide/20181122.html","map":"https://www.google.com/maps/search/島原大門+京都","rate":3,"rg":"★京都","en":{"name":"Shimabara Omon Area","desc":"The remnant great gate of Kyoto's licensed pleasure quarter; a glimpse of the era in the streetscape — a place to know another facet of Kyoto's history."}},{"area":"下京区","name":"東寺（教王護国寺）","desc":"真言宗総本山。世界遺産。平安京の遺構として知られ、高さ55メートルの五重塔は京都の象徴。講堂には立体曼荼羅が安置され、空海の密教精神を今に伝えている。歴史的な景観と密教の奥深い精神が息づく重要な場所。","url":"https://toji.or.jp/","map":"https://www.google.com/maps/search/東寺+京都","rate":5,"rg":"★京都","en":{"name":"To-ji Temple","desc":"A World Heritage temple, head temple of the Shingon school and a remnant of ancient Heian-kyo. Its 55-meter pagoda is the symbol of Kyoto, and the mandala of the lecture hall transmits the esoteric spirit of Kobo Daishi."}},{"area":"下京区","name":"東本願寺","desc":"浄土真宗真宗大谷派の本山。御影堂は世界最大級の木造建築物であり、壮大な伽藍は京都駅近くの街並みを象徴している。伝統的な真宗建築の美と規模を体現し、多くの人々の信仰と心の安らぎの場所として機能する。堂内の静寂は圧巻。","url":"https://www.higashihonganji.or.jp/","map":"https://www.google.com/maps/search/東本願寺+京都","rate":4,"rg":"★京都","en":{"name":"Higashi Hongwan-ji","desc":"The head temple of the Shinshu Otani school; its Goeido is among the largest wooden buildings on earth, and the vast cloisters define the streetscape near Kyoto Station — a place of faith and repose whose interior stillness overwhelms."}},{"area":"下京区","name":"東本願寺・阿弥陀堂門","desc":"阿弥陀堂門：東本願寺の重要建築の一つ。その壮大さと歴史的技術は、当時の信仰の厚さを物語る。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://online.bunka.go.jp/heritages/detail/400268&ved=2ahUKEwi3uJqund6VAxUUslYBHYs_FtsQFnoECBkQAQ&usg=AOvVaw038PoVPv90hDkqNC1pArkQ","map":"https://www.google.com/maps/search/東本願寺+阿弥陀堂門","rate":3,"rg":"★京都","en":{"name":"Amida-do Gate (Higashi Hongwan-ji)","desc":"One of the important structures of Higashi Hongwan-ji — its grandeur and craft speak of the depth of faith of its era."}},{"area":"下京区","name":"仏光寺","desc":"真宗仏光寺派の本山。境内が開放的で、カフェなどの新しい試みも行われている。古い伝統を守りつつ、現代の人々にも開かれた寺院を目指す姿勢が特徴。","url":"https://www.bukkoji.or.jp/","map":"https://www.google.com/maps/search/仏光寺+京都","rate":3,"rg":"★京都","en":{"name":"Bukko-ji Temple","desc":"Head temple of the Shinshu Bukko-ji school, with open grounds and new initiatives such as cafés — a temple keeping old tradition while opening itself to today's visitors."}},{"area":"下京区","name":"文子天満宮","desc":"天満宮の元祖とされる神社。菅原道真の乳母が創建したと伝わる。歴史的な起源を持ち、天神信仰のルーツとして重要。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://ayakotenmangu.or.jp/&ved=2ahUKEwjh3vTxnt6VAxUmjVYBHS09OGYQFnoECBgQAQ&usg=AOvVaw2IVrWJciJ3d_5no08h-muJ","map":"https://www.google.com/maps/search/文子天満宮+京都","rate":3,"rg":"★京都","en":{"name":"Ayako Tenmangu","desc":"Said to be the original Tenmangu, founded by the wet nurse of Sugawara no Michizane — of great importance as the root of Tenjin faith."}},{"area":"下京区","name":"本願寺（西本願寺）","desc":"世界遺産。浄土真宗本願寺派の本山。壮大な御影堂と阿弥陀堂は、歴史的な建築技術の結晶。広大な境内は精神的な安らぎを与える。","url":"https://www.hongwanji.kyoto/","map":"https://www.google.com/maps/search/西本願寺+京都","rate":5,"rg":"★京都","en":{"name":"Nishi Hongwan-ji Temple","desc":"A World Heritage head temple of Jodo Shinshu. Its vast Goeido and Amida halls are masterpieces of historic architecture, offering spiritual repose in the heart of the city."}},{"area":"下京区","name":"六孫王神社","desc":"清和源氏の始祖を祀る。源経基が建立。境内には「神龍池」があり、源氏の繁栄を象徴している。派手さはないが、一族の絆やルーツを大切にする信仰の場。静かな境内に歴史の息吹が漂い、堅実な努力とルーツの再確認の場所として愛される。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kyoto-inf.com/2019/02/16/posted-rokusonnojinja/&ved=2ahUKEwiMrufih9uVAxX9m68BHS5SIBMQFnoECGsQAQ&usg=AOvVaw2gGwG4zQ1fpWYT_RBy8yq8","map":"https://www.google.com/maps/search/六孫王神社+京都","rate":3,"rg":"★京都","en":{"name":"Rokusonn-o Shrine","desc":"Enshrining the founder of the Seiwa Genji clan, built by Minamoto no Tsunemoto; the sacred 'Shinryu-chi' pond symbolizes the clan's prosperity — a quiet shrine of family roots and bonds, beloved as a place to reaffirm steady effort and origins."}},{"area":"右京区","name":"愛宕神社","desc":"京都市の最高峰・愛宕山の山頂に鎮座。火伏せ・火災除けの神として全国から信仰を集める。頂上への登山道は険しく、古くから修行の場としても使われてきた。歴史的な信仰と自然が融合し、参拝する人々に強い意志と達成感を与える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://atagojinjya.jp/&ved=2ahUKEwjamu3Dh9uVAxUNaPUHHTjmK6gQFnoECCEQAQ&usg=AOvVaw0T7wLrWfWwfMNKPSrDtRJa","map":"https://www.google.com/maps/search/愛宕神社+京都","rate":3,"rg":"★京都","en":{"name":"Atago Shrine","desc":"On the summit of Mt. Atago, Kyoto's highest peak; worshiped nationwide as the god of protection from fire. The steep trail long served as a path of ascetic training — a fusion of historic faith and nature that gives worshipers strong resolve and a sense of achievement."}},{"area":"右京区","name":"愛宕念仏寺","desc":"境内に千二百体の羅漢像が並ぶ。それぞれの表情が個性的で、参拝客を楽しませる。古の信仰を守りつつ、現代の人々の心を癒やす温かみのある寺院。静かな環境で心穏やかな時間を過ごせる。","url":"https://www.otagiji.com/story-jp","map":"https://www.google.com/maps/search/愛宕念仏寺+京都","rate":3,"rg":"★京都","en":{"name":"Otagi Nenbutsu-ji Temple","desc":"Its grounds hold 1,200 rakan statues, each with a distinct, charming face — a warm temple that heals modern hearts while keeping old faith; a calm place for a gentle hour."}},{"area":"右京区","name":"化野念仏寺","desc":"嵯峨野の奥深くに位置する寺。数千の石仏・石塔が並ぶ光景は圧巻。かつての葬送の地としての歴史があり、静謐な空間で死生観に思いを馳せる場所。","url":"https://www.nenbutsuji.jp/","map":"https://www.google.com/maps/search/化野念仏寺+京都","rate":4,"rg":"★京都","en":{"name":"Adashino Nenbutsu-ji Temple","desc":"Set deep in Saga's plains, its thousands of stone Buddhas and stupas are overwhelming; once a burial ground, it is a solemn space for reflecting on life and death."}},{"area":"右京区","name":"祇王寺","desc":"『平家物語』ゆかりの寺。悲恋の尼僧たちが余生を送った場所として有名。小さな境内を覆う苔と、周囲の木々の調和が非常に美しい。静かで控えめな佇まいの中に、歴史的な哀愁と慈悲の精神が込められている。","url":"https://www.giouji.or.jp/","map":"https://www.google.com/maps/search/祇王寺+京都","rate":3,"rg":"★京都","en":{"name":"Gio-ji Temple","desc":"A temple of the Tale of the Heike, famous as the retreat of the tragic nun Gio; moss covering the small precinct and surrounding trees harmonize beautifully — history's pathos and a spirit of mercy in a quiet, humble setting."}},{"area":"右京区","name":"金閣寺","desc":"正式名称は鹿苑寺。足利義満の山荘を寺院とした。舎利殿「金閣」の外壁を覆う金箔が特徴で、池に映り込む姿は極めて美しい。室町時代の北山文化を代表する建築物で、庭園は特別名勝・特別史跡に指定されている世界遺産。","url":"https://www.shokoku-ji.jp/kinkakuji/","map":"https://www.google.com/maps/search/金閣寺+京都","rate":5,"rg":"★京都","en":{"name":"Kinkaku-ji 'Golden Pavilion'","desc":"Formally Rokuon-ji, a temple born from the villa of Ashikaga Yoshimitsu. The golden-leafed Kinkaku mirrored in its pond is a representative work of Muromachi culture, and the garden is a Special Place of Scenic Beauty and Special Historic Site within a World Heritage property."}},{"area":"右京区","name":"広沢池","desc":"観月の名所として知られる歴史ある池。周囲の山々との調和が美しい。静かな環境で自然の美しさを堪能できる場所。","url":"https://www.wista.co.jp/gallery/taguchi/index_taguchi.html","map":"https://www.google.com/maps/search/広沢池","rate":3,"rg":"★京都","en":{"name":"Hirosawa Pond","desc":"A historic pond famous for moon viewing, in beautiful harmony with the surrounding hills — a quiet place to savor natural beauty."}},{"area":"右京区","name":"広隆寺","desc":"聖徳太子ゆかりの古寺。国宝第一号の弥勒菩薩半跏思惟像を所蔵し、その神秘的な微笑みは多くの人々を魅了する。渡来人の信仰を伝える歴史的拠点であり、京都の歴史の深層に触れられる場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://10yearkyoto.com/2020/09/27/kouryuji/&ved=2ahUKEwjH1ef7td2VAxUrrVYBHRPlKv4QFnoFCI8BEAE&usg=AOvVaw0bawDRi6ImUxX8TXRWCSj5","map":"https://www.google.com/maps/search/広隆寺+京都","rate":5,"rg":"★京都","en":{"name":"Koryu-ji Temple","desc":"An ancient temple tied to Prince Shotoku, home to the Miroku Bosatsu — the first item ever designated a National Treasure — whose mysterious smile has captivated generations. A place to touch the deepest layers of Kyoto's history."}},{"area":"右京区","name":"広隆寺周辺の「蚕の社（木嶋神社）」","desc":"秦氏ゆかりの地。境内にある三柱鳥居が非常に珍しく神秘的。古の渡来人の信仰や歴史が、現代の住宅街の中に息づいている場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.konoshima.org/&ved=2ahUKEwjmkt2kut2VAxWXslYBHVZRHu4QFnoECDUQAQ&usg=AOvVaw32z9NYYwnMB8hKnZTJ_BZe","map":"https://www.google.com/maps/search/木嶋神社+京都","rate":3,"rg":"★京都","en":{"name":"Konoshima-jinja Shrine (Kaiko-no-yashiro)","desc":"Tied to the Hata clan; the rare 'mihashira torii' triple gate in its grounds is mysterious — the faith of ancient continental immigrants alive within today's residential streets."}},{"area":"右京区","name":"車折神社","desc":"芸能・芸術の神として広く知られ、多くの芸能人が参拝する。境内には玉垣が数多く奉納されている。運勢向上の神としても有名で、参拝者の願いを叶える力が強いとされる。信仰の場としての歴史と、現代の文化活動が結びついている。","url":"https://www.kurumazakijinja.or.jp/","map":"https://www.google.com/maps/search/車折神社+京都","rate":4,"rg":"★京都","en":{"name":"Kurumazaki Shrine","desc":"Widely known as the shrine of performing arts, drawing many entertainers; countless name-plaque fences are dedicated there, and it is famed too as a deity of rising fortune — historic faith joined to today's culture."}},{"area":"右京区","name":"車折神社周辺の「芸能神社」","desc":"車折神社内にあり、あらゆる芸能の神として多くの人が訪れる。玉垣が並ぶ様子は壮観で、現代の文化と古の信仰の形を象徴する場所。","url":"https://www.kurumazakijinja.or.jp/geinoujinja.html","map":"https://www.google.com/maps/search/芸能神社+京都","rate":4,"rg":"★京都","en":{"name":"Geino Shrine (Kurumazaki)","desc":"Within Kurumazaki Shrine, visited by people of every performing art; the rows of donated fences are a spectacular symbol of modern culture joined to ancient faith."}},{"area":"右京区","name":"常寂光寺","desc":"小倉山の山腹にある日蓮宗の寺院。境内の至る所から京都市内を望むことができる。秋には紅葉の名所として知られるが、四季を通じて静寂が守られている。藤原定家ゆかりの地でもあり、古の歌人の心情を偲ぶ場所。","url":"https://www.jojakko-ji.or.jp/","map":"https://www.google.com/maps/search/常寂光寺+京都","rate":4,"rg":"★京都","en":{"name":"Jojakko-ji Temple","desc":"A Nichiren temple on the slopes of Mt. Ogura, with views over Kyoto from many spots; famed for autumn leaves yet keeping quiet through the seasons, tied to the poet Fujiwara no Teika — a place to recall the hearts of the old court poets."}},{"area":"右京区","name":"仁和寺","desc":"真言宗御室派総本山。かつての皇室の離宮であり、御室御所として親しまれる。五重塔や金堂など、皇室との関わりを示す壮麗な建築群が残る。御室桜が有名で、低い樹高で花が咲く光景は京都の春の風物詩。歴史的な格式と庭園美を併せ持つ。","url":"https://ninnaji.jp/","map":"https://www.google.com/maps/search/仁和寺+京都","rate":4,"rg":"★京都","en":{"name":"Ninna-ji Temple","desc":"Head temple of the Shingon Omuro school, once an imperial villa beloved as the 'Omuro Palace.' Splendid buildings — the five-story pagoda and main hall — show its imperial ties, and the low Omuro cherries are a Kyoto spring tradition: historic rank and garden beauty together."}},{"area":"右京区","name":"仁和寺の塔頭「御室桜」","desc":"（仁和寺そのものは既出のため、御室桜エリアとして）仁和寺の境内にある遅咲きの桜として有名。低木で花が密集して咲く姿は「お多福桜」とも呼ばれ、歴史ある境内の中で春を告げる貴重な存在。","url":"https://ninnaji.jp/cherry_tree/","map":"https://www.google.com/maps/search/仁和寺+京都","rate":5,"rg":"★京都","en":{"name":"Omuro Cherries, Ninna-ji","desc":"The late-blooming cherries of Ninna-ji's grounds, low trees densely covered in blossoms called 'Omuro-zakura' — a precious herald of spring within this historic precinct."}},{"area":"右京区","name":"清凉寺（嵯峨釈迦堂）","desc":"浄土宗の寺院。本尊は釈迦如来像。嵯峨天皇ゆかりの地。境内は広く、歴史的な重層感がある。地域の信仰の中心地として、伝統行事も多く執り行われている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://discoverjapan-web.com/article/135934&ved=2ahUKEwiktd6Mp92VAxVpmFYBHaviNk4QFnoECHwQAQ&usg=AOvVaw3xOJ6WzmjBrSuOHnNkTcUQ","map":"https://www.google.com/maps/search/清凉寺+京都","rate":3,"rg":"★京都","en":{"name":"Seiryo-ji 'Sagano Shakado'","desc":"A Jodo temple whose principal image is a Shaka Nyorai statue, tied to Emperor Saga. Its spacious grounds carry layered history, and traditional rites are still held here as a center of local faith."}},{"area":"右京区","name":"太秦映画村","desc":"（名所として）時代劇の撮影所として有名。京都の歴史的な雰囲気を感じられる場所。観光と文化の融合拠点。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://eigamura.com/&ved=2ahUKEwiX4Ovt69-VAxVpsVYBHRoLHZIQFnoECCIQAQ&usg=AOvVaw3LXMQ-R6ejjXWUkyPxEm8r","map":"https://www.google.com/maps/search/東映太秦映画村","rate":3,"rg":"★京都","en":{"name":"Toei Kyoto Studio Park","desc":"A famous period-drama film studio theme park — a place to feel Kyoto's historic atmosphere, fusing tourism and culture."}},{"area":"右京区","name":"大覚寺","desc":"正式名称は旧嵯峨御所大覚寺門跡。嵯峨天皇の離宮として建立された。大沢池は日本最古の林泉式庭園とされる。真言宗の寺院で、かつての貴族の生活の場としての気品が漂う。華道嵯峨御流の家元としても有名で、文化的価値が高い。","url":"https://www.daikakuji.or.jp/","map":"https://www.google.com/maps/search/大覚寺+京都","rate":5,"rg":"★京都","en":{"name":"Daikaku-ji Temple","desc":"Formerly the villa of Emperor Saga, this Shingon temple is home to Osawa pond, said to be Japan's oldest garden pond of its kind. It retains the elegance of aristocratic life and is famous as the head school of the Saga Goryu school of flower arrangement."}},{"area":"右京区","name":"大沢池（大覚寺の一部だが独立した名所として）","desc":"大覚寺の境内にある日本最古の林泉式庭園。嵯峨天皇が離宮として過ごした当時の雅な雰囲気を残している。月見の名所として知られ、水面に映る月は格別の美しさ。歴史的な風雅と文化を今に伝える重要な場所。","url":"https://www.shakkei.jp/duosjourney/destination/kyoto_daikakuji-osawanoike.html","map":"https://www.google.com/maps/search/大沢池+京都","rate":4,"rg":"★京都","en":{"name":"Osawa Pond (Daikaku-ji)","desc":"Japan's oldest garden pond of its kind, within the grounds of Daikaku-ji, retaining the elegance of Emperor Saga's villa era; famed for moon viewing, the moon mirrored on the water is of exceptional beauty — a place of historic refinement."}},{"area":"右京区","name":"天龍寺","desc":"臨済宗天龍寺派大本山。足利尊氏が後醍醐天皇の菩提を弔うために開山。曹源池庭園は作庭当時の面影を残す国指定の特別名勝で、借景として嵐山の自然を取り入れている。禅寺としての格式を重んじ、四季を通じて庭園美が際立つ。","url":"https://www.tenryuji.com/","map":"https://www.google.com/maps/search/天龍寺+京都","rate":4,"rg":"★京都","en":{"name":"Tenryu-ji Temple","desc":"Head temple of the Rinzai Tenryu-ji school, founded by Ashikaga Takauji for the memory of Emperor Go-daigo. The Sogenchi garden — a Special Place of Scenic Beauty — retains its original design and borrows the scenery of Arashiyama; a Zen temple of the first rank whose garden beauty shines in every season."}},{"area":"右京区","name":"天龍寺周辺の「亀山公園」","desc":"嵐山の景観を一望できる場所。歴史的な背景と自然の美しさが融合しており、散策の拠点として人々に親しまれている。","url":"https://hogonin.jp/","map":"https://www.google.com/maps/search/亀山公園+京都","rate":4,"rg":"★京都","en":{"name":"Kameyama Park","desc":"With sweeping views of Arashiyama, where historic background and natural beauty merge — a beloved base for strolling."}},{"area":"右京区","name":"渡月橋","desc":"嵐山を象徴する橋。古くから多くの歌に詠まれてきた歴史がある。嵐山の景観と一体となって、古都の美しさを形成している。","url":"https://www.jeepe.jp/ja/articles/togetsukyo-bridge-arashiyama-kyoto-1028","map":"https://www.google.com/maps/search/渡月橋","rate":5,"rg":"★京都","en":{"name":"Togetsukyo Bridge","desc":"The bridge that symbolizes Arashiyama, celebrated in waka poetry since ancient times. Together with the mountain scenery it completes the beauty of the old capital."}},{"area":"右京区","name":"二尊院","desc":"天台宗の寺院。釈迦如来と阿弥陀如来の二体を祀ることから名付けられた。嵐山の地にあって、非常に静かな環境。門から本堂へ続く紅葉の参道は「紅葉の馬場」と呼ばれ、美しい。歴史ある静寂を守り続ける寺院。","url":"https://nisonin.jp/","map":"https://www.google.com/maps/search/二尊院+京都","rate":3,"rg":"★京都","en":{"name":"Nison-in Temple","desc":"A Tendai temple named for its two images, Shaka and Amida. In Arashiyama's quiet, the maple-lined approach from the gate to the main hall — the 'horse-riding ground of autumn leaves' — is beautiful; a temple that has preserved its historic stillness."}},{"area":"右京区","name":"福王子神社","desc":"仁和寺の守護神。かつては神仏習合の歴史を持ち、皇室の崇敬が厚い。静かな境内に歴史の古さを感じさせる。","url":"https://randen-map-project.com/福王子神社/","map":"https://www.google.com/maps/search/福王子神社+京都","rate":2,"rg":"★京都","en":{"name":"Fukuoji Shrine","desc":"The guardian shrine of Ninna-ji, once part of shrine-temple syncretism and deeply honored by the Imperial family — a quiet precinct that feels its ancient roots."}},{"area":"右京区","name":"宝厳院","desc":"天龍寺の塔頭の一つ。嵐山を借景にした庭園「獅子吼の庭」は、四季折々の表情が楽しめる。夜のライトアップも非常に人気。禅の庭園として高く評価され、嵐山の自然を活かした美しさが際立つ。","url":"https://hogonin.jp/","map":"https://www.google.com/maps/search/宝厳院+京都","rate":4,"rg":"★京都","en":{"name":"Hogon-in Temple","desc":"A sub-temple of Tenryu-ji whose garden 'Shishiku-no-niwa' borrows Arashiyama, beautiful in every season; its night illuminations are very popular — a highly regarded Zen garden making the most of Arashiyama's nature."}},{"area":"右京区","name":"妙心寺","desc":"日本最大級の禅寺。妙心寺派の大本山。境内には多くの塔頭が建ち並び、一つの街を形成している。法堂の「雲龍図」は狩野探幽の筆。広大な敷地内には、禅の教えに基づいた多くの庭園や建物があり、静寂の中で禅修行の歴史と厳しさを感じることができる。","url":"https://www.myoshinji.or.jp/","map":"https://www.google.com/maps/search/妙心寺+京都","rate":4,"rg":"★京都","en":{"name":"Myoshin-ji Temple","desc":"One of Japan's largest Zen complexes, head temple of the Myoshin-ji school; its many sub-temples form a town of their own. The 'Cloud Dragon' ceiling of the Hatto is by Kano Tan'yu — vast grounds of gardens and halls where the history and rigor of Zen training can be felt in silence."}},{"area":"右京区","name":"妙心寺の塔頭「退蔵院」","desc":"妙心寺の塔頭の中でも庭園が有名。四季の変化が豊かな庭園は、禅の精神を静かに物語っている。歴史と美が融合した空間。","url":"http://www.taizoin.com/","map":"https://www.google.com/maps/search/退蔵院+京都","rate":4,"rg":"★京都","en":{"name":"Taizo-in Temple (Myoshin-ji)","desc":"The most garden-famous of Myoshin-ji's sub-temples; its richly seasonal gardens quietly tell the Zen spirit — a space where history and beauty merge."}},{"area":"右京区","name":"野宮神社","desc":"かつて斎王が伊勢神宮へ行く前に身を清めた場所。黒木の鳥居と小柴垣が特徴で、平安時代の情緒を色濃く残している。良縁や子宝の信仰が非常に強く、多くの女性が訪れる。竹林の中に静かに佇む社は、歴史的な神聖さを今に伝えている。","url":"https://www.nonomiya.com/","map":"https://www.google.com/maps/search/野宮神社+京都","rate":4,"rg":"★京都","en":{"name":"Nonomiya Shrine","desc":"Where imperial princesses once purified themselves before serving at Ise; the black-wood torii and brushwood fence retain the mood of the Heian era. Strongly worshiped for good matches and children, it draws many women — a shrine of historic sanctity standing quietly in the bamboo grove."}},{"area":"右京区","name":"嵐山竹林の小径","desc":"嵐山の代名詞的な景観。竹林の中を歩く道は、非常に幻想的。古来より多くの歌人に愛された場所としての歴史的な背景を持つ。","url":"https://www.arashiyama1.grandwest.kyoto/post/嵐山・竹林-完全ガイド-おすすめルートから服装・アクセスまで","map":"https://www.google.com/maps/search/嵐山竹林の小径","rate":5,"rg":"★京都","en":{"name":"Arashiyama Bamboo Grove","desc":"The iconic landscape of Arashiyama: a path through tall bamboo, fantastically green and quiet — a place beloved by poets since ancient times."}},{"area":"右京区","name":"龍安寺","desc":"臨済宗妙心寺派の寺院。枯山水の石庭は世界遺産として名高く、15個の石の配置は謎に包まれている。禅の精神を具現化した庭園は、静寂の中で精神を集中させるための空間として設計されており、国際的にも高い評価を受けている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.ryoanji.jp/&ved=2ahUKEwilw7vChNuVAxXQoK8BHc-7JygQFnoECFcQAQ&usg=AOvVaw2HG2QVcBx-pT2gNu1tstyX","map":"https://www.google.com/maps/search/龍安寺+京都","rate":4,"rg":"★京都","en":{"name":"Ryoan-ji Temple","desc":"A Rinzai Myoshin-ji temple whose dry rock garden, a World Heritage icon, keeps the arrangement of its fifteen stones a mystery. Designed as a space for concentration in stillness, it is internationally celebrated as Zen made visible."}},{"area":"右京区","name":"龍安寺の鏡容池","desc":"鏡容池は龍安寺の広大な庭園の一部として、四季の移ろいと歴史を感じさせる。特に春の桜と初夏の緑が水面に映る景色は美しい。","url":"https://kyoto-option.com/blog/9729/","map":"https://www.google.com/maps/search/龍安寺+鏡容池+京都","rate":3,"rg":"★京都","en":{"name":"Kyoyochi Pond (Ryoan-ji)","desc":"Part of Ryoan-ji's broad garden, reflecting the seasons and history — the spring cherries and early-summer greenery mirrored on its water are lovely."}}]},{"id":"関西(京都以外)","slug":"kansai","entries":[{"area":"大阪市中央区","name":"大阪城天守閣","desc":"（名所として）豊臣秀吉が築いた歴史的城郭の再建。大阪の歴史的シンボルであり、内部は博物館となっている。","url":"https://www.osakacastle.net/","map":"https://www.google.com/maps/search/大阪城天守閣","rate":5,"rg":"関西(京都以外)","en":{"name":"Osaka Castle Keep","desc":"A re-creation of the great castle built by Toyotomi Hideyoshi — the historic symbol of Osaka, now a museum within."}},{"area":"大阪市天王寺区","name":"四天王寺","desc":"聖徳太子が建立した日本仏教最古の官寺の一つ。歴史的・宗教的極めて高い価値を持つ。広大な境内に金堂や五重塔が建つ。","url":"https://www.shitennoji.or.jp/","map":"https://www.google.com/maps/search/四天王寺+大阪","rate":5,"rg":"関西(京都以外)","en":{"name":"Shitenno-ji Temple","desc":"One of the oldest official temples of Japanese Buddhism, founded by Prince Shotoku, of the highest historic and religious value; the main hall and five-story pagoda stand in its vast grounds."}},{"area":"大阪市住吉区","name":"住吉大社","desc":"全国に2300社ある住吉神社の総本社。本殿は「住吉造」という日本最古の神社建築様式で国宝。反橋（太鼓橋）が有名。","url":"https://www.sumiyoshitaisha.net/","map":"https://www.google.com/maps/search/住吉大社+大阪","rate":5,"rg":"関西(京都以外)","en":{"name":"Sumiyoshi Taisha","desc":"Head shrine of the 2,300 Sumiyoshi shrines across Japan. Its main halls, National Treasures in the oldest shrine style of 'Sumiyoshi-zukuri,' are joined by the famous arched Taiko bridge."}},{"area":"大阪市中央区","name":"大阪天満宮","desc":"学問の神様・菅原道真を祀る。天神祭の舞台として全国的に有名。大阪の活気と伝統的な信仰が息づく場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://osakatemmangu.or.jp/&ved=2ahUKEwjbxsjRo-GVAxWis1YBHYGfGEQQFnoECE8QAQ&usg=AOvVaw22aPDcPWQo6W-cOE8WfmhD","map":"https://www.google.com/maps/search/大阪天満宮","rate":4,"rg":"関西(京都以外)","en":{"name":"Osaka Tenmangu","desc":"Enshrining the god of learning, Sugawara no Michizane; nationally famous as the home of the Tenjin Festival — a place alive with Osaka's energy and traditional faith."}},{"area":"神戸市中央区","name":"生田神社","desc":"神功皇后創建と伝わる、神戸最古級の神社。縁結びの神として信仰が篤く、都会の中に厳かな神域が広がる。","url":"https://ikutajinja.or.jp/","map":"https://www.google.com/maps/search/生田神社+神戸","rate":4,"rg":"関西(京都以外)","en":{"name":"Ikuta Shrine","desc":"One of Kobe's oldest shrines, said to be founded by Empress Jingu; deeply worshiped for matchmaking, its solemn precinct rises amid the city."}},{"area":"姫路市","name":"姫路城","desc":"世界遺産。別名「白鷺城」。白く美しい漆喰壁と連立式天守の完璧な姿を今に残す、日本が世界に誇る城郭建築の最高傑作。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.city.himeji.lg.jp/castle/&ved=2ahUKEwiFtIX8o-GVAxWmm1YBHblKBSkQFnoECEkQAQ&usg=AOvVaw2kt-2AWyPKzs3bLO1Lf34q","map":"https://www.google.com/maps/search/姫路城","rate":5,"rg":"関西(京都以外)","en":{"name":"Himeji Castle","desc":"A World Heritage castle known as the 'White Heron Castle' — the supreme masterpiece of Japanese castle architecture, its white plaster walls and linked keeps preserved in perfect form."}},{"area":"神戸市北区","name":"有馬温泉（温泉街・温泉寺等）","desc":"日本最古の温泉の一つ。豊臣秀吉も愛した歴史ある温泉街。温泉寺など歴史的な寺院も点在する。","url":"https://www.arima-onsen.com/","map":"https://www.google.com/maps/search/有馬温泉+神戸","rate":5,"rg":"関西(京都以外)","en":{"name":"Arima Onsen","desc":"One of Japan's oldest hot springs, beloved by Toyotomi Hideyoshi; a historic spa town dotted with temples such as Onsen-ji."}},{"area":"宝塚市","name":"中山寺","desc":"聖徳太子創建と伝わる西国三十三所第24番札所。安産祈願の寺として全国的に非常に有名で、多くの参拝客が訪れる。","url":"https://www.nakayamadera.or.jp/","map":"https://www.google.com/maps/search/中山寺+宝塚","rate":4,"rg":"関西(京都以外)","en":{"name":"Nakayama-dera Temple","desc":"Said to be founded by Prince Shotoku, the 24th temple of the Saigoku pilgrimage — nationally famous as a temple of safe childbirth, drawing countless worshipers."}},{"area":"神戸市長田区","name":"長田神社","desc":"神功皇后ゆかりの古社。生田神社・湊川神社とともに神戸を代表する神社。産業繁栄・厄除けの信仰を集める。","url":"https://nagatajinja.jp/","map":"https://www.google.com/maps/search/長田神社+神戸","rate":3,"rg":"関西(京都以外)","en":{"name":"Nagata Shrine","desc":"An old shrine tied to Empress Jingu; with Ikuta and Minatogawa shrines, one of Kobe's representative shrines, gathering faith in industrial prosperity and protection from misfortune."}},{"area":"奈良市","name":"東大寺","desc":"世界遺産。華厳宗大本山。「奈良の大仏（盧舎那仏）」で知られ、世界最大級の木造建築である大仏殿は圧倒的な迫力を持つ。","url":"https://www.todaiji.or.jp/","map":"https://www.google.com/maps/search/東大寺+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Todai-ji Temple","desc":"A World Heritage temple, head temple of the Kegon school, famous for the Great Buddha of Nara. The Great Buddha Hall — among the largest wooden buildings on earth — overwhelms with its sheer presence."}},{"area":"生駒郡斑鳩町","name":"法隆寺","desc":"世界遺産。聖徳太子が建立した世界最古の木造建築群。飛鳥時代の仏教文化を現在に伝える日本の宝。","url":"https://www.horyuji.or.jp/","map":"https://www.google.com/maps/search/法隆寺+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Horyu-ji Temple","desc":"A World Heritage temple founded by Prince Shotoku: the world's oldest surviving wooden buildings, a national treasure carrying Asuka-era Buddhist culture to the present."}},{"area":"奈良市","name":"春日大社","desc":"世界遺産。全国に約3000社ある春日神社の総本社。平城京の守護と国民の繁栄を祈るために創建された。朱塗りの社殿と無数の灯籠が美しい。","url":"https://www.kasugataisha.or.jp/","map":"https://www.google.com/maps/search/春日大社+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Kasuga Taisha","desc":"A World Heritage shrine, head of the roughly 3,000 Kasuga shrines of Japan, founded to guard Heijo-kyo and pray for the nation's prosperity — its vermilion halls and countless lanterns are beautiful beyond words."}},{"area":"吉野郡吉野町","name":"金峯山寺","desc":"世界遺産。修験道の総本山。蔵王堂の本尊（秘仏・金剛蔵王権現）は巨大かつ強烈な迫力を放つ。山岳信仰の聖地。","url":"https://www.kinpusen.or.jp/","map":"https://www.google.com/maps/search/金峯山寺+吉野","rate":5,"rg":"関西(京都以外)","en":{"name":"Kimpusen-ji Temple","desc":"A World Heritage temple, head monastery of Shugendo. The hidden principal image of Zao Gongen in the Great Hall radiates enormous, overwhelming power — a holy mountain of asceticism."}},{"area":"桜井市","name":"大神神社","desc":"日本最古の神社のひとつ。本殿を持たせず、三輪山そのものを神体として拝する古代からの神祭りの原形を留める神聖な場所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://oomiwa.or.jp/&ved=2ahUKEwj_8NDDpOGVAxV1klYBHdpVHUkQFnoECE4QAQ&usg=AOvVaw1-Px0gJqM7hMZfKYH04sG0","map":"https://www.google.com/maps/search/大神神社+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Omiwa Shrine","desc":"One of the oldest shrines in Japan, with no main hall: the sacred Mt. Miwa itself is worshiped as the deity — a holy place preserving the very origin of Japanese worship."}},{"area":"大津市","name":"比叡山延閣寺","desc":"世界遺産。天台宗の総本山。日本仏教の母山と呼ばれ、多くの名僧を輩出した。広大な境内は東塔・西塔・横川に分かれる。","url":"https://www.hieizan.or.jp/","map":"https://www.google.com/maps/search/比叡山延暦寺","rate":5,"rg":"関西(京都以外)","en":{"name":"Enryaku-ji Temple, Mt. Hiei","desc":"A World Heritage temple, head temple of the Tendai school — 'the mother mountain of Japanese Buddhism,' which produced generations of great monks. Its vast grounds spread across the To-do, Sai-to and Yokawa precincts."}},{"area":"大津市","name":"日吉大社","desc":"全国に約3800社ある日吉・日枝・山王神社の総本宮。紅葉の名所でもあり、比叡山のふもとで深い歴史と自然が調和する。","url":"https://hiyoshitaisha.jp/","map":"https://www.google.com/maps/search/日吉大社+大津","rate":4,"rg":"関西(京都以外)","en":{"name":"Hiyoshi Taisha","desc":"Head shrine of the roughly 3,800 Hiyoshi, Hie and Sanno shrines of Japan, also famous for autumn leaves — deep history and nature in harmony at the foot of Mt. Hiei."}},{"area":"大津市","name":"石山寺","desc":"西国三十三所第13番札所。紫式部が『源氏物語』を起草した場所として名高い。境内には巨岩（硅灰石）がそびえる。","url":"https://www.ishiyamadera.or.jp/","map":"https://www.google.com/maps/search/石山寺+大津","rate":4,"rg":"関西(京都以外)","en":{"name":"Ishiyama-dera Temple","desc":"The 13th temple of the Saigoku pilgrimage, renowned as the place where Murasaki Shikibu began the Tale of Genji; great wollastonite boulders rise in its grounds."}},{"area":"彦根市","name":"彦根城","desc":"国宝の天城。江戸時代の天守がそのまま現存する貴重な城郭。琵琶湖を望む景観と美しい城構えが魅力。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://hikonecastle.com/&ved=2ahUKEwjkj6HjpOGVAxWmslYBHQyNJkMQFnoECFgQAQ&usg=AOvVaw0x8R4P5GxgOQ9Ft7g3-TGo","map":"https://www.google.com/maps/search/彦根城","rate":5,"rg":"関西(京都以外)","en":{"name":"Hikone Castle","desc":"A National Treasure castle whose Edo-period keep survives intact — rare among Japanese castles — with lovely views over Lake Biwa and an elegant castle layout."}},{"area":"甲賀市","name":"櫟野寺","desc":"平安時代の巨像である本尊・薬師如来坐像（国宝）をはじめ、多くの仏像を安置する天台宗の古寺。静かな山あいに佇む。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.rakuyaji.jp/&ved=2ahUKEwjvsqT6pOGVAxXZlFYBHXCqOgMQFnoECEgQAQ&usg=AOvVaw0mEIA3jF9lABiERlkm48lh","map":"https://www.google.com/maps/search/櫟野寺+甲賀","rate":3,"rg":"関西(京都以外)","en":{"name":"Ichino-ji Temple","desc":"A quiet Tendai temple in the mountains, housing many Buddhist statues led by the colossal Heian-era seated Yakushi Nyorai — a National Treasure."}},{"area":"伊都郡高野町","name":"高野山（金剛峯寺・壇上伽藍）","desc":"世界遺産。弘法大師空海が開いた真言密教の聖地。117の塔頭寺院が並ぶ宗教都市であり、奥之院の厳かな雰囲気は特異。","url":"https://www.koyasan.or.jp/","map":"https://www.google.com/maps/search/高野山+金剛峯寺","rate":5,"rg":"関西(京都以外)","en":{"name":"Koyasan (Kongobu-ji & Danjo Garan)","desc":"A World Heritage sacred mountain of Shingon esoteric Buddhism opened by Kobo Daishi — a religious city of 117 temples, with the solemn atmosphere of Okunoin beyond compare."}},{"area":"東牟婁郡那智勝浦町","name":"熊野那智大社・那智滝","desc":"世界遺産。熊野三山のひとつ。隣接する青岸渡寺や、落差日本一を誇る「那智の滝」を御神体とする自然崇拝の壮大な聖地。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kumanonachitaisha.or.jp/&ved=2ahUKEwjMyoKQpeGVAxWSsFYBHTHeFtcQFnoECBsQAQ&usg=AOvVaw3777O9OSPf_f6JCSqrnGp_","map":"https://www.google.com/maps/search/熊野那智大社","rate":5,"rg":"関西(京都以外)","en":{"name":"Kumano Nachi Taisha & Nachi Falls","desc":"A World Heritage site, one of the Kumano Sanzan. A grand sanctuary of nature worship venerating Nachi Falls — Japan's tallest — together with the neighboring Seiganto-ji temple."}},{"area":"東牟婁郡本宮町","name":"熊野本宮大社","desc":"世界遺産。全国の熊野神社の総本社。緑深い山々に囲まれ、巨大な鳥居と素朴で力強い社殿が古代からの信仰の重みを伝える。","url":"https://www.kumanohongu.jp/","map":"https://www.google.com/maps/search/熊野本宮大社","rate":5,"rg":"関西(京都以外)","en":{"name":"Kumano Hongu Taisha","desc":"A World Heritage shrine, head of all the Kumano shrines of Japan. Amid deep green mountains, its huge torii and simple, powerful halls convey the weight of ancient faith."}},{"area":"東牟婁郡新宮市","name":"熊野速玉大社","desc":"世界遺産。熊野三山のひとつ。鮮やかな朱塗りの社殿と、境内の御神木である巨大なナギの木（国指定天然記念物）が有名。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kumanohayatama.jp/&ved=2ahUKEwjOxsbHpeGVAxUAp1YBHX_4ANsQFnoECF0QAQ&usg=AOvVaw295WnyFQY50A2pWtx3GJm3","map":"https://www.google.com/maps/search/熊野速玉大社","rate":4,"rg":"関西(京都以外)","en":{"name":"Kumano Hayatama Taisha","desc":"A World Heritage site, one of the Kumano Sanzan, famous for its vermilion halls and the sacred giant nagi tree (a Natural Monument) in its grounds."}},{"area":"伊都郡高野町","name":"丹生官省符神社","desc":"世界遺産。高野山の表玄関として空海によって創建された神社。静寂な森の中に歴史ある社殿が佇む。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://niujinja.sakura.ne.jp/&ved=2ahUKEwjIoN71peGVAxXatlYBHaGPGa8QFnoECD4QAQ&usg=AOvVaw3C639N_pM0YuhH8jPRCKB1","map":"https://www.google.com/maps/search/丹生官省符神社","rate":3,"rg":"関西(京都以外)","en":{"name":"Niu Kanjin-sha Shrine","desc":"A World Heritage shrine founded by Kobo Daishi as the outer gateway of Koyasan — historic halls stand in silent forest."}},{"area":"伊勢市","name":"伊勢神宮（内宮・外宮）","desc":"日本人の総氏神であり、すべての神社の中心に位置する聖地。2000年の歴史を持ち、神秘的な森と神明造の社殿が厳かに佇む。","url":"https://www.isejingu.or.jp/","map":"https://www.google.com/maps/search/伊勢神宮","rate":5,"rg":"関西(京都以外)","en":{"name":"Ise Jingu (Naiku & Geku)","desc":"The great shrine of the Japanese people — the holy of holies at the center of all Shinto worship. Two thousand years of history, mysterious forests and the shimei-zukuri halls stand in solemn quiet."}},{"area":"志摩市","name":"伊雑宮","desc":"伊勢神宮の別宮。田んぼの中に静かに佇み、古式ゆかしい「磯部の御田植祭」でも知られる神聖な場所。","url":"https://www.kanko-shima.com/purpose/810/","map":"https://www.google.com/maps/search/伊雑宮","rate":4,"rg":"関西(京都以外)","en":{"name":"Izawa-no-miya","desc":"A branch shrine of Ise Jingu standing quietly among rice fields, known too for its ancient rice-planting festival — a sacred place of old rites."}},{"area":"亀山市","name":"関宿（歴史的町並み）","desc":"（名所として）東海道の宿場町として唯一、江戸～明治期の古い町家が大規模に現存する重要伝統的建造物群保存地区。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.denken.gr.jp/archive/kameyama-sekijuku/index.html&ved=2ahUKEwit99vRpuGVAxUZklYBHYgiLLAQFnoECB4QAQ&usg=AOvVaw1z-MUB40L2S1qgREK0W6cf","map":"https://www.google.com/maps/search/関宿+三重","rate":4,"rg":"関西(京都以外)","en":{"name":"Seki-juku Historic Streets","desc":"On the Tokaido, the rare post town where Edo-to-Meiji era townhouses survive on a large scale — a designated Preservation District."}},{"area":"伊賀市","name":"上野城（伊賀上野城）","desc":"（名所として）白鳳城とも呼ばれる美しい城。高石垣は日本屈指の高さ。忍者の里の歴史的シンボル。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://igaueno-castle.jp/&ved=2ahUKEwjN7vH2puGVAxVQhlYBHesSO8gQFnoECFkQAQ&usg=AOvVaw1xZxlIHYIJpKi463lR-_tw","map":"https://www.google.com/maps/search/伊賀上野城","rate":4,"rg":"関西(京都以外)","en":{"name":"Ueno Castle (Iga Ueno)","desc":"A beautiful castle also called 'Hakuho-jo,' with one of Japan's tallest stone walls — the historic symbol of the ninja homeland."}},{"area":"多気郡多気町","name":"丹生神社","desc":"かつて日本最大の水銀生産地であった丹生の地に鎮座する古社。歴史の深いストーリーを秘めた場所。","url":"https://www.naracity-guide.com/spots/63","map":"https://www.google.com/maps/search/丹生神社+三重","rate":3,"rg":"関西(京都以外)","en":{"name":"Niu Shrine","desc":"An old shrine in the land of Taki, once Japan's greatest producer of cinnabar — a place with a deep historical story."}},{"area":"大阪市中央区","name":"難波神社","desc":"難波の地に鎮座する古社。境内の御神木である楠の巨木が歴史の深さを物語る。都心のビジネス街にありながら静寂を保つ。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.nanba-jinja.or.jp/&ved=2ahUKEwjp_uPpp-GVAxXrrlYBHauJB90QFnoECCEQAQ&usg=AOvVaw3_o_2_5T8JBPlWDaWIg4lM","map":"https://www.google.com/maps/search/難波神社+大阪","rate":3,"rg":"関西(京都以外)","en":{"name":"Namba Shrine","desc":"An old shrine of Namba, its giant camphor sacred tree telling of deep history; quiet calm preserved amid the downtown business district."}},{"area":"大阪市北区","name":"大阪天満宮周辺の「堀川戎神社」","desc":"「十日戎」で知られる商売繁盛の神様。地域に深く根ざした信仰の場として、多くの参拝客でにぎわう。","url":"https://www.horikawa-ebisu.or.jp/","map":"https://www.google.com/maps/search/堀川戎神社+大阪","rate":3,"rg":"関西(京都以外)","en":{"name":"Horikawa Ebisu Shrine","desc":"A shrine of the god of commerce famous for the 'Toka-ebisu' festival — rooted in the local community and busy with worshipers."}},{"area":"大阪市阿倍野区","name":"安倍晴明神社","desc":"陰陽師・安倍晴明の誕生地と伝わる神社。晴明公を祀り、全国からファンや参拝者が訪れる神秘的なスポット。","url":"https://abeseimeijinjya.jp","map":"https://www.google.com/maps/search/安倍晴明神社+大阪","rate":4,"rg":"関西(京都以外)","en":{"name":"Abe Seimei Shrine","desc":"A shrine said to stand on the birthplace of the onmyoji Abe no Seimei, enshrining Seimei — a mystical spot drawing fans and worshipers from across Japan."}},{"area":"堺市堺区","name":"方違神社","desc":"方位のない清地とされ、建築や引越し、旅行などの方向・地相にまつわる災いを取り除く神として絶大な信仰を集める。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.hochigai-jinja.or.jp/&ved=2ahUKEwikz567qOGVAxWis1YBHYGfGEQQFnoECFUQAQ&usg=AOvVaw15FoAgH12mqRKHK7aO4k5Y","map":"https://www.google.com/maps/search/方違神社+堺","rate":4,"rg":"関西(京都以外)","en":{"name":"Hochigai Shrine","desc":"Regarded as land free of directional curses — a shrine of immense faith for removing misfortunes of direction in building, moving house and travel."}},{"area":"神戸市中央区","name":"湊川神社","desc":"楠木正成公を祀る。明治時代に創建され、国家の歴史において重要な役割を果たした神社。近代の歴史の重みを感じさせる。","url":"https://www.minatogawajinja.or.jp/","map":"https://www.google.com/maps/search/湊川神社+神戸","rate":4,"rg":"関西(京都以外)","en":{"name":"Minatogawa Shrine","desc":"Enshrining the hero Kusunoki Masashige; founded in the Meiji era, a shrine that played a major role in the nation's history — the weight of modern history felt throughout."}},{"area":"西宮市","name":"西宮神社（恵比寿天神社）","desc":"全国に約3500あるえびす神社の総本社（本社の通称：西宮のえびす）。「福男選び」の舞台として有名で、商売繁盛の信仰の中心。","url":"https://nishinomiya-ebisu.com/","map":"https://www.google.com/maps/search/西宮神社+兵庫","rate":5,"rg":"関西(京都以外)","en":{"name":"Nishinomiya Shrine (Ebisu)","desc":"Head shrine of the roughly 3,500 Ebisu shrines of Japan, known as 'Nishinomiya Ebisu.' Famous for its 'Fukuotoko' lucky-man race and the center of faith in commercial prosperity."}},{"area":"宝塚市","name":"清荒神清澄寺","desc":"「荒神さん」として親しまれる真言三宝宗の本山。火の神・台所の神として、商売子孫繁栄の信仰が非常に篤い。","url":"https://www.kiyoshikojin.or.jp/","map":"https://www.google.com/maps/search/清荒神清澄寺+宝塚","rate":4,"rg":"関西(京都以外)","en":{"name":"Kiyoshikojin Seichoji","desc":"Beloved as 'Kojin-san,' head temple of the Shingon Sanbo school; as a god of fire and the kitchen, its faith in prosperity and descendants runs deep."}},{"area":"たつの市","name":"赤穂城跡","desc":"（名所として）赤穂浪士の舞台となった浅野家ゆかりの城郭。石垣や本丸庭園が美しく整備され、武士道と歴史のロマンを感じる。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.ako-hyg.ed.jp/bunkazai/akojo/&ved=2ahUKEwimkNOdz-OVAxUSgVYBHWCUHQUQFnoECEAQAQ&usg=AOvVaw21oRbFQpb36EqvruL4nln6","map":"https://www.google.com/maps/search/赤穂城跡","rate":4,"rg":"関西(京都以外)","en":{"name":"Ako Castle Ruins","desc":"The castle of the Asano family, stage of the forty-seven ronin; its stone walls and main-bailey garden are beautifully maintained — romance of bushido and history."}},{"area":"豊岡市","name":"出石（城下町・出石城跡）","desc":"（名所として）「播磨の小京都」と呼ばれる古い町家が残る城下町。伝統的な景観と名物の出石皿そばが楽しめる。","url":"https://toyooka-tourism.com/spot/izushijoseki/","map":"https://www.google.com/maps/search/出石城跡+豊岡","rate":4,"rg":"関西(京都以外)","en":{"name":"Izushi Castle Town","desc":"A castle town of old townhouses called 'the little Kyoto of Tajima,' with traditional scenery and the local specialty Izushi plate soba."}},{"area":"生駒郡平群町","name":"信貴山朝護孫子寺","desc":"聖徳太子が毘沙門天の出現を見たという伝説に始まる古寺。日本一の大張子虎や、ダイナミックな山上の伽藍配置が特徴。","url":"https://www.sigisan.or.jp/","map":"https://www.google.com/maps/search/朝護孫子寺+奈良","rate":4,"rg":"関西(京都以外)","en":{"name":"Shigisan Chogosonshi-ji","desc":"An old temple born from the legend of Prince Shotoku's vision of Bishamon-ten, with Japan's largest paper tiger and dramatic mountaintop cloisters."}},{"area":"桜井市","name":"安倍文殊院","desc":"日本三文殊の一つ。日本最大級の渡海文殊像（国宝）を安置する。陰陽師・安倍晴明が修行した地としても有名。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.abemonjuin.or.jp/&ved=2ahUKEwixs6HN1eOVAxV9ffUHHdgSN74QFnoECFAQAQ&usg=AOvVaw24hOUi6l-_JB7neFAfw9S-","map":"https://www.google.com/maps/search/安倍文殊院+奈良","rate":4,"rg":"関西(京都以外)","en":{"name":"Abe Monju-in","desc":"One of Japan's three great Monju temples, housing one of the largest Monju statues (a National Treasure); also known as the place where the onmyoji Abe no Seimei trained."}},{"area":"宇陀市","name":"室生寺","desc":"「女人高野」として知られる古刹。山深い中に建つ国内最小の五重塔が美しく、シャクナゲの名所としても名高い。","url":"http://www.murouji.or.jp/","map":"https://www.google.com/maps/search/室生寺+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Murou-ji Temple","desc":"An old temple known as 'Women's Koyasan,' with Japan's smallest five-story pagoda rising deep in the mountains, famous too for its rhododendrons."}},{"area":"高市郡明日香村","name":"飛鳥寺","desc":"日本最初の本格的な寺院（元興寺の前身）。本尊の飛鳥大仏（銅造釈迦如来坐像）は日本最古の仏像として歴史的価値が極めて高い。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://yamatoji.nara-kankou.or.jp/01shaji/02tera/03east_area/asukadera/&ved=2ahUKEwjJ38Lm1eOVAxWA5TQHHaZaJ2sQFnoECEoQAQ&usg=AOvVaw1WyENWlcHXWoM3dO9b6WGm","map":"https://www.google.com/maps/search/飛鳥寺+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Asuka-dera Temple","desc":"The first full-scale temple of Japan, forerunner of Gango-ji. Its Great Buddha of Asuka — Japan's oldest Buddhist statue — is of the highest historic value."}},{"area":"吉野郡吉野町","name":"吉水神社","desc":"後醍醐天皇の皇居となり、源義経と静御前が身を隠した歴史の舞台。世界遺産であり、日本最古の書院建築が残る。","url":"https://www.yoshimizu-shrine.com/","map":"https://www.google.com/maps/search/吉水神社+奈良","rate":4,"rg":"関西(京都以外)","en":{"name":"Yoshimizu Shrine","desc":"Once the imperial residence of Emperor Go-daigo and the hiding place of Minamoto no Yoshitsune and Shizuka — a World Heritage site preserving Japan's oldest shoin building."}},{"area":"長浜市","name":"竹生島（宝厳寺・都久夫須麻神社）","desc":"琵琶湖に浮かぶ神聖な島。西国三十三所第30番札所であり、国宝の唐門や舟廊下など圧倒的な歴史的建築美を誇る。","url":"https://www.chikubushima.jp/","map":"https://www.google.com/maps/search/竹生島+宝厳寺","rate":5,"rg":"関西(京都以外)","en":{"name":"Chikubu Island (Hogon-ji)","desc":"A sacred island floating in Lake Biwa, the 30th temple of the Saigoku pilgrimage, boasting National Treasure architecture such as the kara-mon gate and boat corridor."}},{"area":"大津市","name":"三井寺（園城寺）","desc":"天台寺門宗の総本山。「近江八景」の一つ「三井の晩鐘」でも有名。数々の国宝建築や仏像を所蔵する歴史の巨刹。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://miidera1200.jp/&ved=2ahUKEwj_tOyV1uOVAxXDla8BHdpwBYEQFnoECCIQAQ&usg=AOvVaw10Rxiq2VCri1U7kNxLcX0i","map":"https://www.google.com/maps/search/三井寺+大津","rate":5,"rg":"関西(京都以外)","en":{"name":"Mii-dera (Onjo-ji)","desc":"Head temple of the Tendai Jimon school, famous for 'the evening bell of Mii' among the Eight Views of Omi. A great historical temple holding numerous National Treasures."}},{"area":"東近江市","name":"永源寺","desc":"臨済宗永源寺派の本山。紅葉の名所として名高く、愛知川の清流沿いの美しい自然と厳かな禅の雰囲気が調和する。","url":"https://www.eigenji-t.jp/","map":"https://www.google.com/maps/search/永源寺+滋賀","rate":4,"rg":"関西(京都以外)","en":{"name":"Eigen-ji Temple","desc":"Head temple of the Rinzai Eigen-ji school, famed for autumn leaves — solemn Zen air in beautiful nature along the clear Echi river."}},{"area":"甲賀市","name":"多岐神社周辺の「水口城跡」","desc":"（名所として）徳川家光の上洛宿泊所として建てられた城。甲賀の歴史を伝えるスポット。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://koka-kanko.org/introduce/minakuchijyo-ato/&ved=2ahUKEwjWsPCu1uOVAxXXin0EHUnRBEEQFnoECCUQAQ&usg=AOvVaw0czP4owCEQxMkdnWlwXQt2","map":"https://www.google.com/maps/search/水口城+滋賀","rate":3,"rg":"関西(京都以外)","en":{"name":"Minakuchi Castle Ruins","desc":"A castle built as lodging for the shogun Tokugawa Iemitsu on his way to Kyoto — a spot conveying the history of Koka."}},{"area":"和歌山市","name":"和歌山城","desc":"徳川御三家の一つ、紀州徳川家の居城。美しい連立式天守が和歌山市街を見渡し、歴史公園として親しまれている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://wakayamajo.jp/&ved=2ahUKEwiSpvvO1uOVAxX5fvUHHZO5MgcQFnoECFoQAQ&usg=AOvVaw0Zh9ghswA6lqB1a_E-bQSW","map":"https://www.google.com/maps/search/和歌山城","rate":4,"rg":"関西(京都以外)","en":{"name":"Wakayama Castle","desc":"The seat of the Kishu Tokugawa, one of the three shogunal branch houses; its linked keep overlooks the city, beloved as a history park."}},{"area":"伊都郡九度山町","name":"慈尊院","desc":"弘法大師の母が滞在した寺であり、高野山の表玄関。女性の参拝が多いことから「女人高野」の原点とも称される。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://jison-in.org/index.html&ved=2ahUKEwjW-dHl1uOVAxXBkVYBHRkDGbUQFnoECDsQAQ&usg=AOvVaw2fFgwGXdNkHvNQ1br3gY7P","map":"https://www.google.com/maps/search/慈尊院+九度山","rate":4,"rg":"関西(京都以外)","en":{"name":"Jison-in Temple","desc":"Where Kobo Daishi's mother stayed — the outer gateway of Koyasan, called the origin of 'Women's Koyasan' for the many women who worshiped here."}},{"area":"日高郡日高川町","name":"道成寺","desc":"安珍・清姫の悲恋物語で全国的に知られる古寺。奈良時代創建の歴史を持ち、貴重な仏像を多く安置する。","url":"https://www.dojoji.com/","map":"https://www.google.com/maps/search/道成寺+和歌山","rate":4,"rg":"関西(京都以外)","en":{"name":"Dojo-ji Temple","desc":"An old temple nationally known for the tragic love tale of Anchin and Kiyohime, founded in the Nara era and housing many precious Buddhist statues."}},{"area":"津市","name":"高田本山専修寺","desc":"真宗高田派の本山。圧倒的なスケールを誇る巨大な国宝の木造建築（御影堂・如来堂）が立ち並ぶ、宗教文化の至宝。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.senjuji.or.jp/&ved=2ahUKEwi6hfaM1-OVAxUZa_UHHY0XI6AQFnoECEkQAQ&usg=AOvVaw2nPDcph7nMAWSPHcrB1_lN","map":"https://www.google.com/maps/search/高田本山専修寺","rate":5,"rg":"関西(京都以外)","en":{"name":"Senju-ji Temple","desc":"The head temple of the Takada school of Shin Buddhism, with colossal National Treasure wooden halls (Goeido and Nyorai-do) of overwhelming scale — a treasure of religious culture."}},{"area":"伊勢市","name":"二見興玉神社","desc":"夫婦岩で知られる神社。伊勢神宮参拝の前に身を清める「浜参宮」の古式が今に伝えられている。海の景観が美しい。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://futamiokitamajinja.or.jp/&ved=2ahUKEwjU4-2m1-OVAxXYsFYBHW_LJ_cQFnoECFUQAQ&usg=AOvVaw1fTASvMyLIv191_e-2pK9C","map":"https://www.google.com/maps/search/二見興玉神社","rate":4,"rg":"関西(京都以外)","en":{"name":"Futami Okitama Shrine","desc":"The shrine of the Wedded Rocks, preserving the ancient custom of purifying oneself here before visiting Ise Jingu — with beautiful sea views."}},{"area":"松阪市","name":"松坂城跡（檟本陣跡等）","desc":"（名所として）蒲生氏郷が築いた城跡。石垣が美しく残る。本居宣長の旧宅（鈴屋）が隣接し、歴史と文学の薫る場所。","url":"https://www.city.matsusaka.mie.jp/uploaded/attachment/85251.pdf","map":"https://www.google.com/maps/search/松坂城跡","rate":4,"rg":"関西(京都以外)","en":{"name":"Matsusaka Castle Ruins","desc":"Built by Gamo Ujisato, with handsome stone walls; next door stands the old home of the scholar Motoori Norinaga — a place where history and literature breathe."}},{"area":"大阪市西区","name":"御霊神社","desc":"難波の古社で、豊臣秀吉の大坂城築城の際にも崇敬された。境内は都会のオアシスとして静寂に包まれている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.goryojinja.jp/guide.html&ved=2ahUKEwj5v4G12OOVAxWhr1YBHWd6A5EQFnoECCMQAQ&usg=AOvVaw0918HypcRzn_li7p6sAHYl","map":"https://www.google.com/maps/search/御霊神社+大阪","rate":3,"rg":"関西(京都以外)","en":{"name":"Goryo Shrine","desc":"An old Namba shrine honored even during Hideyoshi's building of Osaka Castle; its precinct is an oasis of quiet in the city."}},{"area":"大阪市福島区","name":"福島天満宮","desc":"菅原道真ゆかりの古社。下町の温かい雰囲気が残る地域にあり、地域の守り神として親しまれている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://baifuugakuen.wixsite.com/tenmanguu&ved=2ahUKEwiSlqv22OOVAxVxia8BHYk6KkgQFnoECEkQAQ&usg=AOvVaw1WPgC3yx4Qv5ySlJAJJQ34","map":"https://www.google.com/maps/search/福島天満宮+大阪","rate":3,"rg":"関西(京都以外)","en":{"name":"Fukushima Tenmangu","desc":"An old shrine tied to Sugawara no Michizane in a warm downtown neighborhood, beloved as the local guardian."}},{"area":"河内長野市","name":"金剛寺（天野寺）","desc":"弘法大師ゆかりの古刹。国宝の金堂や多宝塔をはじめ、平安・鎌倉期の貴重な文化財を数多く所蔵する。紅葉の名所としても名高い。","url":"https://www.amanosan-kongoji.jp/","map":"https://www.google.com/maps/search/金剛寺+河内長野","rate":4,"rg":"関西(京都以外)","en":{"name":"Kongo-ji Temple (Amano-dera)","desc":"An old temple of Kobo Daishi, holding a National Treasure main hall and tahoto plus many precious Heian-Kamakura works — also famed for autumn leaves."}},{"area":"羽曳野市","name":"野中寺","desc":"聖徳太子建立と伝わる古寺。飛鳥時代の瓦や白鳳仏など、古代の歴史を色濃く残す貴重な寺院。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://osaka-info.jp/special/dc/event/detail757/&ved=2ahUKEwj-38GU2eOVAxXqplYBHTp-AloQFnoECEYQAQ&usg=AOvVaw3bqUyI3_yWbxw0PxznkUQe","map":"https://www.google.com/maps/search/野中寺+羽曳野","rate":3,"rg":"関西(京都以外)","en":{"name":"Nochu-ji Temple","desc":"An old temple said to be founded by Prince Shotoku, preserving Asuka-era tiles and Hakuho-period Buddhist statues — a precious monument of antiquity."}},{"area":"神戸市中央区","name":"神戸北野天満神社","desc":"異人館街（北野）の高台に鎮座する神社。神戸市街や港を一望できる絶景のロケーションと、学問の神様としての信仰を併せ持つ。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kobe-kitano.net/&ved=2ahUKEwj9yOfD2eOVAxX_ka8BHW6ALY0QFnoECFUQAQ&usg=AOvVaw3Hr9tq06zwbsw8qhyvcFJI","map":"https://www.google.com/maps/search/神戸北野天満神社","rate":4,"rg":"関西(京都以外)","en":{"name":"Kobe Kitano Tenmangu","desc":"A shrine on the heights of the Ijinkan (foreign residences) quarter, with superb views over Kobe city and port, and faith in the god of learning."}},{"area":"明石市","name":"魚の棚商店街周辺の「明石城跡（公園）」","desc":"（名所として）宮本武蔵が縄張（設計）したとされる城跡。三重の櫓が現存し、明石の歴史的ランドマークとなっている。","url":"https://www.uonotana.or.jp/spots","map":"https://www.google.com/maps/search/明石城跡","rate":4,"rg":"関西(京都以外)","en":{"name":"Akashi Castle Park","desc":"A castle said to have been designed by the swordsman Miyamoto Musashi; its triple turrets survive as a historic landmark of Akashi."}},{"area":"朝来市","name":"竹田城跡","desc":"（名所として）「日本のマチュピチュ」とも称される山城跡。雲海に包まれた幻想的な景観で全国的にその名を知られる歴史遺産。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.city.asago.hyogo.jp/site/takeda/&ved=2ahUKEwix0oeq2uOVAxXKgK8BHQuKOd8QFnoECFQQAQ&usg=AOvVaw3d5J8aTA9eCXQmUsuuL5H1","map":"https://www.google.com/maps/search/竹田城跡","rate":5,"rg":"関西(京都以外)","en":{"name":"Ruins of Takeda Castle","desc":"The mountaintop castle ruins sometimes called 'the Machu Picchu of Japan,' nationally famous for its fantastic seas of clouds."}},{"area":"丹波篠山市","name":"篠山城跡（および周辺の武家屋敷）","desc":"（名所として）徳川家康が築いた歴史的な城郭。美しい城下町の街並みがそのまま残り、往時の面影を色濃く伝える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.burari-tambaji.com/spot/11&ved=2ahUKEwin67HA2uOVAxVpcvUHHbLkHq0QFnoECDQQAQ&usg=AOvVaw2PYnmiF0xWfPG-caPam2cz","map":"https://www.google.com/maps/search/篠山城跡","rate":4,"rg":"関西(京都以外)","en":{"name":"Sasayama Castle & Castle Town","desc":"A castle built by Tokugawa Ieyasu, with the beautiful castle town preserved as it was — the past still vividly present."}},{"area":"奈良市","name":"元興寺","desc":"世界遺産。平城京遷都に伴って移転した古代寺院（飛鳥寺の系譜）。極楽堂などの国宝建築や、古代の瓦屋根が歴史の深さを語る。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://gangoji-tera.or.jp/&ved=2ahUKEwiQvLL12uOVAxU7qVYBHTDaH_cQFnoECF4QAQ&usg=AOvVaw2icrTC4Hj77wQh4Mg-ozv6","map":"https://www.google.com/maps/search/元興寺+奈良","rate":4,"rg":"関西(京都以外)","en":{"name":"Gango-ji Temple","desc":"A World Heritage ancient temple moved to Heijo-kyo, heir of Asuka-dera; National Treasure buildings like the Gokuraku-do and ancient roof tiles speak of deep history."}},{"area":"奈良市","name":"唐招提寺","desc":"世界遺産。唐の高僧・鑑真和上によって開かれた律宗の総本山。天平建築の最高傑作である金堂をはじめ、厳かな空気が漂う。","url":"https://toshodaiji.jp/","map":"https://www.google.com/maps/search/唐招提寺+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Toshodai-ji Temple","desc":"A World Heritage temple founded by the Chinese master monk Ganjin, head temple of the Risshu school. Its kondo — the supreme masterpiece of Tempyo architecture — fills the precinct with solemnity."}},{"area":"奈良市","name":"薬師寺","desc":"世界遺産。天武天皇発願の古寺。東塔（幾重にも重なる美しい屋根）と西塔の対比や、仏教美術の傑作である薬師三尊像が有名。","url":"https://nara-yakushiji.com/","map":"https://www.google.com/maps/search/薬師寺+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Yakushi-ji Temple","desc":"A World Heritage temple founded by Emperor Tenmu, famous for the contrast of its east and west pagodas — the east with its graceful tiered roofs — and the masterpiece Yakushi Triad."}},{"area":"生駒市","name":"生駒山宝山寺","desc":"生駒山の中腹に位置する真言律宗の寺院。商売繁盛や開運の神仏として、関西一円から絶大な信仰を集める。巨大な岩肌とレトロな雰囲気が独特。","url":"https://nara.home-ncj.co.jp/leisure/temples-shrines/ikoma-hozanji-w820-20251206/","map":"https://www.google.com/maps/search/宝山寺+生駒","rate":4,"rg":"関西(京都以外)","en":{"name":"Hozan-ji Temple","desc":"A Shingon Ritsu temple on the slopes of Mt. Ikoma, drawing immense faith in business success from all Kansai — its sheer rock faces and retro atmosphere are unique."}},{"area":"大津市","name":"近江神宮","desc":"天智天皇を祀る神社。百人一首の聖地としても有名で、近代的な流造の美しい社殿が広大な森の中に佇む。","url":"https://oumijingu.org/","map":"https://www.google.com/maps/search/近江神宮+大津","rate":4,"rg":"関西(京都以外)","en":{"name":"Omi Jingu","desc":"Enshrining Emperor Tenji, famous as the sacred home of karuta (Hyakunin Isshu); modern nagare-style halls stand in rich woods."}},{"area":"高島市","name":"白鬚神社","desc":"琵琶湖の中に大鳥居が立つことで有名な近江最古の大社。琵琶湖の絶景と神聖な雰囲気が調和するフォトジェニックな名所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://shirahigejinja.com/&ved=2ahUKEwj1i47X2-OVAxWmcvUHHWHXFm4QFnoECEMQAQ&usg=AOvVaw1VeXrGBtkZUi0Iho_TgjY7","map":"https://www.google.com/maps/search/白鬚神社+高島","rate":5,"rg":"関西(京都以外)","en":{"name":"Shirahige Shrine","desc":"The oldest shrine of Omi, famous for the great torii standing in Lake Biwa — a photogenic spot where the lake's grandeur and sacred air meet."}},{"area":"紀の川市","name":"粉河寺","desc":"西国三十三所第3番札所。奈良時代創建の古刹で、広大な境内と壮麗な大門、本堂が歴史の重みを伝える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kokawadera.org/&ved=2ahUKEwis59H72-OVAxWWmlYBHT4LKEYQFnoECEcQAQ&usg=AOvVaw1hiiHvRZiH1uFm5vvCy5Og","map":"https://www.google.com/maps/search/粉河寺+和歌山","rate":4,"rg":"関西(京都以外)","en":{"name":"Kokawa-dera Temple","desc":"The 3rd temple of the Saigoku pilgrimage, founded in the Nara era; its vast grounds, grand gate and main hall convey the weight of history."}},{"area":"伊都郡高野町","name":"金剛峯寺（高野山総本山）","desc":"世界遺産。高野山真言宗の総本山。日本最大級の石庭（蟠龍庭）や美しい障壁画を誇る、信仰の中心地。","url":"https://www.koyasan.or.jp/","map":"https://www.google.com/maps/search/金剛峯寺","rate":5,"rg":"関西(京都以外)","en":{"name":"Kongobu-ji Temple","desc":"A World Heritage temple, head temple of Koyasan Shingon, home to one of Japan's largest rock gardens (Banryu-tei) and fine painted screens — the heart of the mountain's faith."}},{"area":"岩出市","name":"根来寺","desc":"新義真言宗の総本山。戦国時代に強大な僧兵勢力を誇った。国宝の多宝塔は日本最大の高さを誇り、桜や紅葉の名所としても知られる。","url":"https://www.negoroji.org/","map":"https://www.google.com/maps/search/根来寺+和歌山","rate":4,"rg":"関西(京都以外)","en":{"name":"Negoro-ji Temple","desc":"Head temple of the Shingi Shingon school, once commanding mighty warrior monks in the Sengoku era; its National Treasure tahoto is Japan's tallest, famed too for cherry and maple."}},{"area":"伊勢市","name":"月読宮","desc":"伊勢神宮（内宮）の別宮。月の神を祀り、木々に囲まれた厳かな境内は、内宮とはまた違った深い静寂に包まれている。","url":"https://www.isejingu.or.jp/about/outerbetsugu/","map":"https://www.google.com/maps/search/月読宮+伊勢","rate":4,"rg":"関西(京都以外)","en":{"name":"Tsukiyomi-no-miya (Ise)","desc":"A branch shrine of Ise's Inner Shrine venerating the moon god; its wooded, solemn precinct holds a deeper stillness than the main shrine itself."}},{"area":"伊賀市","name":"敢国神社","desc":"伊賀国の一宮。伊賀の国全体の総鎮神として古くから崇敬されてきた歴史ある古社。豊かな自然の中に堂々とした社殿が建つ。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://aekuni.jp/&ved=2ahUKEwi40e2O3eOVAxUOnq8BHVTxI_MQFnoECEQQAQ&usg=AOvVaw1PxfDmncethluHXjl1GPtf","map":"https://www.google.com/maps/search/敢国神社+伊賀","rate":3,"rg":"関西(京都以外)","en":{"name":"Aekuni Shrine","desc":"The ichinomiya of Iga Province, honored since antiquity as the great guardian of all Iga — dignified halls amid rich nature."}},{"area":"大阪市中央区","name":"難波八阪神社","desc":"巨大な獅子舞台（獅子頭）で知られる神社。インパクトのある外観と、商売繁盛・勝運のご利益で国内外の参拝客に人気。","url":"https://nambayasaka.jp/","map":"https://www.google.com/maps/search/難波八阪神社+大阪","rate":4,"rg":"関西(京都以外)","en":{"name":"Namba Yasaka Shrine","desc":"Famous for its colossal lion-head stage; its striking looks and blessings of prosperity and victory make it popular with visitors from home and abroad."}},{"area":"大阪市西成区","name":"今宮戎神社","desc":"「えべっさん」の愛称で親しまれ、関西の商売繁盛の信仰の中心地。十日戎の時期には数百万人の参拝客でにぎわう。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.imamiya-ebisu.jp/&ved=2ahUKEwitmZjX3eOVAxWMhq8BHeqvFDMQFnoECEcQAQ&usg=AOvVaw3pkwyXGyDbbFhxexVAPxpF","map":"https://www.google.com/maps/search/今宮戎神社+大阪","rate":4,"rg":"関西(京都以外)","en":{"name":"Imamiya Ebisu Shrine","desc":"Beloved as 'Ebe-ssan,' the heart of Kansai's faith in commercial prosperity; the Toka-ebisu season draws millions of worshipers."}},{"area":"池田市","name":"久安寺","desc":"美しいあじさいや紅葉の名所として知られる古刹。静寂な境内に佇む薬医門や歴史的な仏像が訪れる人を魅了する。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://kyuanji.jp/&ved=2ahUKEwiflNjr3eOVAxW2k1YBHdBXPdcQFnoECEMQAQ&usg=AOvVaw1TGaqTfu8IzMfMDH64PvQz","map":"https://www.google.com/maps/search/久安寺+池田","rate":3,"rg":"関西(京都以外)","en":{"name":"Kyuan-ji Temple","desc":"An old temple famous for hydrangeas and autumn leaves; its yakuimon gate and historic statues charm visitors in quiet grounds."}},{"area":"寝屋川市","name":"萱島神社","desc":"駅のホームの真ん中に巨大なクスノキが突き出ていることで有名な、クスノキのご神木を祀る神社。","url":"https://yaokami.jp/1270396/","map":"https://www.google.com/maps/search/萱島神社+寝屋川","rate":3,"rg":"関西(京都以外)","en":{"name":"Kayashima Shrine","desc":"A shrine of a sacred camphor tree famously thrusting up through the middle of the station platform."}},{"area":"神戸市中央区","name":"布引五本松堰堤（布引の滝周辺）","desc":"（名所として）日本最古の重力式コンクリートダムであり、重要文化財。周辺の美しい滝とともに明治の近代化遺産を伝える。","url":"https://www.tokkouin.com/徳光院周辺/","map":"https://www.google.com/maps/search/布引五本松堰堤","rate":3,"rg":"関西(京都以外)","en":{"name":"Nunobiki Dam & Falls","desc":"Japan's oldest gravity concrete dam and an Important Cultural Property — a Meiji-era industrial heritage together with the beautiful Nunobiki falls."}},{"area":"加古川市","name":"日岡神社","desc":"播磨国風土記にも記される歴史ある古社。安産や縁結びの神として地域の深い崇敬を集めている。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.hiokajinja.jp/&ved=2ahUKEwiNoujQ3-OVAxV_cvUHHUbQI0AQFnoECFIQAQ&usg=AOvVaw3VYAV3prF6YAoEYQwvY3h4","map":"https://www.google.com/maps/search/日岡神社+加古川","rate":3,"rg":"関西(京都以外)","en":{"name":"Hioka Shrine","desc":"An old shrine recorded in the Harima Fudoki, deeply revered locally as a deity of safe childbirth and matchmaking."}},{"area":"豊岡市","name":"出石神社","desc":"但馬国一宮。歴史が非常に古く、厳かな空気が漂う本殿と豊かな自然が調和する格式高い神社。","url":"https://daytrip-izushi.jp/about/izushi-jinjya/","map":"https://www.google.com/maps/search/出石神社+豊岡","rate":4,"rg":"関西(京都以外)","en":{"name":"Izushi Shrine","desc":"The ichinomiya of Tajima Province, extremely ancient; its solemn main hall and rich nature are in harmony — a shrine of high standing."}},{"area":"宍粟市","name":"発師神社（伊和神社）","desc":"播磨国一宮。農耕や商工業の神として知られ、広大な境内に古い社叢（鎮守の森）が広がる歴史的聖地。","url":"https://shiso.or.jp/highlights/播磨国一の宮%E3%80%80伊和神社","map":"https://www.google.com/maps/search/伊和神社+宍粟","rate":4,"rg":"関西(京都以外)","en":{"name":"Iwa Shrine","desc":"The ichinomiya of Harima Province, known as a god of agriculture and industry; ancient shrine woods spread across vast grounds — a historic sanctuary."}},{"area":"桜井市","name":"長谷寺","desc":"真言宗豊山派の総本山。長谷寺型舞台造りの本堂や、巨大な十一面観音立像で有名。四季折々の花（特に牡丹）が美しい「花の御寺」。","url":"https://www.hasedera.or.jp/","map":"https://www.google.com/maps/search/長谷寺+奈良","rate":5,"rg":"関西(京都以外)","en":{"name":"Hase-dera Temple","desc":"Head temple of the Shingon Buzan school, famous for its stage-like main hall and giant eleven-faced Kannon — the 'temple of flowers,' beautiful in every season, especially peonies."}},{"area":"奈良市","name":"法華寺（大和北部八十八ヶ所）","desc":"光明皇后ゆかりの門跡尼寺。国宝の木造十一面観音立像（美仏として名高い）を安置する、歴史と気品あふれる古寺。","url":"https://hokkejimonzeki.or.jp","map":"https://www.google.com/maps/search/法華寺+奈良","rate":4,"rg":"関西(京都以外)","en":{"name":"Hokke-ji Temple","desc":"An imperial nunnery tied to Empress Komyo, housing the famous National Treasure eleven-faced Kannon — an old temple of history and elegance."}},{"area":"生駒郡斑鳩町","name":"法起寺","desc":"世界遺産。聖徳大子の宮殿跡に建立されたと伝わり、日本最古の三重塔（飛鳥建築）が青空に美しく映える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.horyuji.or.jp/hokiji/&ved=2ahUKEwj3r8j94eOVAxX1gq8BHQjdIp0QFnoECEkQAQ&usg=AOvVaw2ejVvtLdjfmiqWoqWmV92c","map":"https://www.google.com/maps/search/法起寺+奈良","rate":4,"rg":"関西(京都以外)","en":{"name":"Hoki-ji Temple","desc":"A World Heritage temple said to be built on the site of Prince Shotoku's palace, with Japan's oldest three-story pagoda in beautiful Asuka style against the blue sky."}},{"area":"吉野郡天川村","name":"天河大弁財天社","desc":"芸能や財宝の神として知られ、日本三大弁財天の一つ。吉野の山深い聖地にあり、強いスピリチュアルな磁場を持つことで有名。","url":"https://www.tenkawa-jinja.or.jp","map":"https://www.google.com/maps/search/天河大弁財天社","rate":4,"rg":"関西(京都以外)","en":{"name":"Tenkawa Daibenzaiten-sha","desc":"A shrine of the arts and wealth, one of Japan's three great Benzaiten shrines — deep in the sacred mountains of Yoshino, famous for its strong spiritual field."}},{"area":"大津市","name":"西教寺","desc":"天台真盛宗の総本山。明智光秀の一族の菩提寺としても知られ、美しい境内と歴史の重みを伝える寺院建築が並ぶ。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://saikyoji.org/&ved=2ahUKEwi6_9u-4uOVAxV2ulYBHaseLBYQFnoECBkQAQ&usg=AOvVaw2Xn7J-SFyCBeOuwvcRoTxL","map":"https://www.google.com/maps/search/西教寺+大津","rate":4,"rg":"関西(京都以外)","en":{"name":"Saikyo-ji Temple","desc":"Head temple of the Tendai Shinnyo school, known as the family temple of the Akechi Mitsuhide family — beautiful precincts and buildings of historic weight."}},{"area":"長浜市","name":"余呉湖周辺の「賤ヶ岳古戦場」","desc":"（名所として）羽柴秀吉と柴田勝家が激突した「賤ヶ岳の戦い」の舞台。歴史ファン必見の史跡と美しい湖の景色が広がる。","url":"https://www.biwako-visitors.jp/spot/detail/3804/","map":"https://www.google.com/maps/search/賤ヶ岳古戦場","rate":4,"rg":"関西(京都以外)","en":{"name":"Shizugatake Battlefield","desc":"The stage of the fierce clash between Hashiba Hideyoshi and Shibata Katsuie — must-see historic sites with beautiful lake scenery."}},{"area":"甲賀市","name":"櫟野寺周辺の「油日神社」","desc":"（『映画・アニメ等の舞台にもなった歴史ある神社』）広大な境内に見事な社殿が建ち並び、伊賀・甲賀の信仰の拠点となった古社。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.aburahijinjya.jp/&ved=2ahUKEwjImp354-OVAxUVqVYBHd6dD8wQFnoECDgQAQ&usg=AOvVaw3MK-A6K_eY7igY-nFXCQIe","map":"https://www.google.com/maps/search/油日神社+滋賀","rate":3,"rg":"関西(京都以外)","en":{"name":"Aburahi Shrine","desc":"An old shrine — also a location for films and anime — with splendid halls across vast grounds, once a center of Iga-Koka worship."}},{"area":"橋本市","name":"隅田八幡神社","desc":"国宝の人物画像鏡（日本古代史の重要文字が刻まれた鏡）が伝わる古社。静かな環境の中に歴史の謎とロマンが眠る。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://sudahachimanjinjya.org/&ved=2ahUKEwjTxPif5OOVAxWJr1YBHVgLIyEQFnoECEAQAQ&usg=AOvVaw2dYIwD5nODPhdBK26bj1ZO","map":"https://www.google.com/maps/search/隅田八幡神社+和歌山","rate":3,"rg":"関西(京都以外)","en":{"name":"Suda Hachiman Shrine","desc":"An old shrine preserving the National Treasure 'Suda Hachiman mirror' with its ancient inscription — history's mystery and romance asleep in quiet surroundings."}},{"area":"有田郡有田川町","name":"湯浅の伝統的建造物群保存地区（醤油醸造の町並み）","desc":"（名所として）日本醤油醸造の発祥の地とされる。古い町家や蔵が立ち並び、中世・近世の産業と生活の歴史を今に伝える。","url":"https://www.town.yuasa.wakayama.jp/","map":"https://www.google.com/maps/search/湯浅町伝統的建造物群保存地区","rate":4,"rg":"関西(京都以外)","en":{"name":"Yuasa Historic District","desc":"Said to be the birthplace of Japanese soy-sauce brewing; old houses and storehouses convey the industry and life of medieval and early-modern times."}},{"area":"田辺市","name":"闘鶏神社","desc":"源平合戦の際に熊野別当が白旗・赤旗を揚げてどちらにつくか占いをしたという伝説の舞台。世界遺産（熊野参詣道の一部）。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.toukeijinja.or.jp/&ved=2ahUKEwjZoLPA5OOVAxWJr1YBHf38IvAQFnoECEoQAQ&usg=AOvVaw2wEeA2YCb2FizfrzaXQi7M","map":"https://www.google.com/maps/search/闘鶏神社+田辺","rate":4,"rg":"関西(京都以外)","en":{"name":"Tokei Shrine","desc":"The stage of the legend that the Kumano betto raised white and red flags to divine which side to back in the Genpei War — part of a World Heritage pilgrimage route."}},{"area":"度会郡玉城町","name":"田丸城跡","desc":"（名所として）北畠氏が築き、後に織田信長の次男・信雄が改修した城跡。石垣や桜が美しく、伊勢街道の要所。","url":"https://kizuna.town.tamaki.mie.jp/tamarujo/","map":"https://www.google.com/maps/search/田丸城跡","rate":3,"rg":"関西(京都以外)","en":{"name":"Tamaru Castle Ruins","desc":"Built by the Kitabatake clan and later reworked by Oda Nobukatsu, Nobunaga's son; handsome stone walls and cherry trees at a key point of the Ise road."}},{"area":"桑名市","name":"多度大社","desc":"北勢地域の総鎮守。名物の「上げ馬神事」でも知られ、格式の高い社殿と神馬の伝説が息づく厳かな神社。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://tadotaisya.or.jp/&ved=2ahUKEwjz_Iv15OOVAxU7lFYBHQpaDK8QFnoECF8QAQ&usg=AOvVaw030CM4RHFu0cuptDyDeAaV","map":"https://www.google.com/maps/search/多度大社+三重","rate":4,"rg":"関西(京都以外)","en":{"name":"Tado Taisha","desc":"The great guardian shrine of the Hokusei region, known for its famous horse-leaping rite — solemn halls and the legend of the sacred horses."}},{"area":"姫路市","name":"書写山圓教寺","desc":"西国三十三所第27番札所。天台宗の古刹で「西の比叡山」とも呼ばれる。映画『ラストサムライ』のロケ地としても有名。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.shosha.or.jp/&ved=2ahUKEwje1oiV5eOVAxWPqVYBHdsHL0wQFnoECFMQAQ&usg=AOvVaw1MPVMAmpX-yTagZaivyuGw","map":"https://www.google.com/maps/search/書写山圓教寺","rate":5,"rg":"関西(京都以外)","en":{"name":"Shosha-zan Engyo-ji","desc":"The 27th temple of the Saigoku pilgrimage — a Tendai old temple called 'the Mt. Hiei of the west,' famous as a filming location for 'The Last Samurai.'"}},{"area":"奈良市","name":"若草山・春日山原始林（周辺の石仏群など）","desc":"（名所として）神聖な森として数百年手つかずで守られてきた世界遺産。古代からの自然信仰の姿を今に伝える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://note.com/fujiiman/n/ne65b4481ab81&ved=2ahUKEwjB0omx5eOVAxVWs1YBHT8NHjQQFnoECD8QAQ&usg=AOvVaw2C4o_LbDv7Vc2BwafAWS2A","map":"https://www.google.com/maps/search/春日山原始林","rate":5,"rg":"関西(京都以外)","en":{"name":"Wakakusa-yama & Kasugayama Primeval Forest","desc":"A World Heritage forest kept untouched for centuries as sacred ground, transmitting the ancient form of nature worship."}},{"area":"東牟婁郡那智勝浦町","name":"補陀洛山寺","desc":"世界遺産。平安時代から熊野信仰の中心として栄えた。海に向かって船出する「補陀洛渡海」の悲劇と歴史を伝える古刹。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://seigantoji.or.jp/fudarakusanji/&ved=2ahUKEwjhnZ7J5eOVAxWVl1YBHXexFOQQFnoECEAQAQ&usg=AOvVaw2-SL9dOVYHQlLfOZQUk2O6","map":"https://www.google.com/maps/search/補陀洛山寺","rate":5,"rg":"関西(京都以外)","en":{"name":"Fudarakusan-ji Temple","desc":"A World Heritage temple at the center of Kumano faith since the Heian era, keeper of the tragic legend of the 'Fudaraku tokai' — monks setting sail to paradise."}},{"area":"伊勢市","name":"伊勢神宮 宇治橋・おはらい町（伊勢の歴史的景観）","desc":"（名所として）内宮へと架かる宇治橋と、江戸時代の門前町の雰囲気を残す伝統的町並み。日本の原風景を体感できる。","url":"https://ise-kanko.jp/purpose/oharaimachi-okageyokocho/","map":"https://www.google.com/maps/search/おはらい町+伊勢","rate":5,"rg":"関西(京都以外)","en":{"name":"Uji-bashi Bridge & Oharai-machi, Ise","desc":"The great bridge leading to Ise's Inner Shrine and the traditional townscape of Oharai-machi — an Edo-period pilgrimage street where Japan's original scenery can be felt."}}]},{"id":"中部地方","slug":"chubu","entries":[{"area":"新潟県上越市","name":"林泉寺","desc":"上杉謙信公の菩提寺であり、幼少期に修行を行った名刹。謙信公の墓所や川中島合戦の碑などが残る上杉家ゆかりの聖地。","url":"https://rinsenji-1497.jp/","map":"https://www.google.com/maps/search/林泉寺+上越市","rate":5,"rg":"中部地方","en":{"name":"Rinsen-ji Temple","desc":"The family temple of Uesugi Kenshin, where the great warlord trained as a youth. The grounds preserve Kenshin's tomb and monuments to the Battles of Kawanakajima — a sacred place deeply tied to the Uesugi clan."}},{"area":"新潟県佐渡市","name":"壇王山 長谷寺（佐渡の長谷寺）","desc":"「佐渡の長谷寺」として親しまれる真言宗豊山派の古刹。美しい牡丹の花でも知られ、京都の長谷寺を模して建立された歴史を持つ。","url":"https://www.visitsado.com/","map":"https://www.google.com/maps/search/長谷寺+佐渡","rate":4,"rg":"中部地方","en":{"name":"Hase-dera Temple, Sado","desc":"Affectionately known as 'Sado's Hase-dera,' this ancient Shingon Buzan temple was modeled on Kyoto's famous Hase-dera and is celebrated for its beautiful peonies."}},{"area":"富山県高岡市","name":"国宝 瑞龍寺","desc":"加賀藩前田家の菩提寺であり、江戸初期の禅宗様伽藍の最高傑作として名高い国宝の寺院。総門、山門、仏殿、法堂が美しく並ぶ。","url":"https://zuiryuji.jp/","map":"https://www.google.com/maps/search/瑞龍寺+高岡","rate":5,"rg":"中部地方","en":{"name":"Zuiryu-ji Temple (National Treasure)","desc":"The family temple of the Maeda lords of Kaga, famed as the supreme masterpiece of early-Edo Zen architecture. Its outer gate, mountain gate, Buddha hall and dharma hall line up in perfect stately order."}},{"area":"富山県富山市","name":"富山城址公園（富山城跡）","desc":"（名所として）佐々成政や前田氏が治めた富山市の歴史的シンボル。神通川の旧水運を活かした城郭の歴史を伝える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://joshipark.com/&ved=2ahUKEwi-8JGbt-yVAxUHnq8BHd-OJN4QFnoECBgQAQ&usg=AOvVaw2-v06a6HV_Qr13hWIro5Vi","map":"https://www.google.com/maps/search/富山城址公園","rate":3,"rg":"中部地方","en":{"name":"Toyama Castle Park","desc":"A historic symbol of Toyama city, once ruled by Sassa Narimasa and the Maeda clan, conveying the castle's history and the old water transport of the Jinzu River."}},{"area":"石川県金沢市","name":"尾山神社","desc":"加賀藩祖・前田利家公と正室・お松の方を祀る神社。和漢洋の建築様式が融合した独特な神門（国重要文化財）で知られる。","url":"https://www.oyama-jinja.or.jp/","map":"https://www.google.com/maps/search/尾山神社","rate":5,"rg":"中部地方","en":{"name":"Oyama Shrine, Kanazawa","desc":"Dedicated to Maeda Toshiie, founder of the Kaga domain, and his wife Matsu. Its striking gate, blending Japanese, Chinese and Western styles, is a designated Important Cultural Property."}},{"area":"石川県羽咋市","name":"気多大社","desc":"能登国の一宮として、2000年以上の歴史を誇る古社。境内の「入らずの森」など神聖な自然崇拝の形を今に伝える。","url":"https://keta.jp/","map":"https://www.google.com/maps/search/気多大社","rate":5,"rg":"中部地方","en":{"name":"Keta Taisha Shrine","desc":"The principal shrine (ichinomiya) of Noto Province with over 2,000 years of history. Behind it lies the sacred primeval 'Hairu-no-mori' forest, preserving ancient nature worship to this day."}},{"area":"福井県吉田郡永平寺町","name":"大本山 永平寺","desc":"道元禅師によって開かれた曹洞宗の最高修行道場。杉木立に囲まれた広大な境内に諸堂が並び、厳粛な雰囲気が漂う世界的名刹。","url":"https://daihonzan-eiheiji.com/","map":"https://www.google.com/maps/search/永平寺","rate":5,"rg":"中部地方","en":{"name":"Eihei-ji Temple (Head Temple)","desc":"The foremost training monastery of Soto Zen, founded by Master Dogen. Its vast compound of halls rises among towering cedars in an atmosphere of solemn grandeur."}},{"area":"福井県敦賀市","name":"氣比神宮","desc":"北陸道総鎮守であり越前国一宮。「けひさん」の親称で親しまれ、佐渡産の巨木で造られた大鳥居は日本三大鳥居の一つ。","url":"https://kehijingu.jp/","map":"https://www.google.com/maps/search/氣比神宮","rate":5,"rg":"中部地方","en":{"name":"Kehi Jingu Shrine","desc":"The great guardian shrine of the Hokuriku region and ichinomiya of Echizen Province. Its colossal torii of giant Sado cedar ranks among Japan's three great torii gates."}},{"area":"山梨県甲府市","name":"武田神社","desc":"武田信玄公の館跡（躑躅ヶ崎館）に建てられた神社。信玄公を祀り、甲斐の国の歴史と戦国武将の気風を伝える。","url":"http://www.takedajinja.or.jp","map":"https://www.google.com/maps/search/武田神社+甲府","rate":5,"rg":"中部地方","en":{"name":"Takeda Shrine","desc":"Built on the site of Tsutsujigasaki, the residence of Takeda Shingen. It enshrines Shingen and conveys the history and samurai spirit of Kai Province."}},{"area":"山梨県甲州市","name":"大善寺（山梨県）","desc":"行基開基と伝わり、本堂（国宝）は県内最古の木造建築。ぶどう寺としても知られ、薬師如来信仰の歴史深い古刹。","url":"https://www.daizenji.org/","map":"https://www.google.com/maps/search/大善寺+山梨","rate":5,"rg":"中部地方","en":{"name":"Daizen-ji Temple, Yamanashi","desc":"Said to be founded by the monk Gyoki; its main hall, a National Treasure, is the oldest wooden building in the prefecture. Known as the 'Grape Temple' for its Yakushi worship and viticulture."}},{"area":"長野県長野市","name":"善光寺","desc":"宗派を問わず「一生に一度は参詣したい」と全国的な信仰を集める無宗派の古刹。日本最古と伝わる絶対秘仏の本尊を祀る日本屈指の霊場。","url":"https://www.zenkoji.jp/","map":"https://www.google.com/maps/search/善光寺+長野","rate":5,"rg":"中部地方","en":{"name":"Zenko-ji Temple","desc":"A non-sectarian ancient temple that has drawn nationwide devotion with the saying, 'everyone should visit Zenko-ji once in a lifetime.' It enshrines Japan's oldest absolutely hidden principal image (hibutsu)."}},{"area":"長野県諏訪市","name":"諏訪大社（上社本宮）","desc":"全国に数ある諏訪神社の総本社であり、日本最古級の神社のひとつ。独自の御柱祭や自然崇拝（山を御神体とする）の根源地。","url":"https://suwataisha.or.jp","map":"https://www.google.com/maps/search/諏訪大社上社本宮","rate":5,"rg":"中部地方","en":{"name":"Suwa Taisha, Kamisha Honmiya","desc":"Head shrine of the many Suwa shrines across Japan and among the oldest in the country. It is the spiritual source of the unique Onbashira festival and of mountain worship that sees the mountain itself as the deity."}},{"area":"岐阜県高山市","name":"飛騨国分寺","desc":"聖武天皇の勅願により建立された国分寺の法燈を伝える古刹。樹齢1200年を超える大イチョウや三重塔が歴史の深さを物語る。","url":"https://hidakokubunji.jp/","map":"https://www.google.com/maps/search/飛騨国分寺","rate":4,"rg":"中部地方","en":{"name":"Hida Kokubun-ji Temple","desc":"An old temple continuing the line of the provincial temple founded by imperial decree of Emperor Shomu. A great ginkgo over 1,200 years old and a three-story pagoda speak of its deep history."}},{"area":"岐阜県大垣市","name":"大垣城跡（続日本100名城）","desc":"（名所として）関ヶ原の戦いの際に西軍の拠点となった城。石田三成が籠城した歴史や、美濃の交通の要所としての背景を持つ。","url":"https://www.city.ogaki.lg.jp/0000000577.html","map":"https://www.google.com/maps/search/大垣城","rate":4,"rg":"中部地方","en":{"name":"Ruins of Ogaki Castle","desc":"A castle that served as the Western army's stronghold at the Battle of Sekigahara, where Ishida Mitsunari held out. A key point on the historic Mino routes."}},{"area":"静岡県富士宮市","name":"富士山本宮浅間大社","desc":"全国に1300余りある浅間神社の総本社。富士山を御神体とし、徳川家康が寄進した本殿（国重要文化財）など格式の高い社殿が並ぶ。","url":"http://www.fuji-hongu.or.jp/sengen/","map":"https://www.google.com/maps/search/富士山本宮浅間大社","rate":5,"rg":"中部地方","en":{"name":"Fujisan Hongu Sengen Taisha","desc":"Head shrine of the more than 1,300 Sengen shrines of Japan. It venerates Mount Fuji itself as the deity; its main hall, donated by Tokugawa Ieyasu, is an Important Cultural Property."}},{"area":"静岡県静岡市葵区","name":"静岡浅間神社（浅間・大歳御祖・神部神社）","desc":"徳川家康が元服を行った神社であり、駿府の総社。漆塗りの極彩色で見事な社殿群（国指定重要文化財）が並ぶ。","url":"http://www.shizuokasengen.net","map":"https://www.google.com/maps/search/静岡浅間神社","rate":4,"rg":"中部地方","en":{"name":"Shizuoka Sengen Shrine","desc":"The general shrine of Sunpu, where Tokugawa Ieyasu celebrated his coming of age. Its brilliantly lacquered halls are designated Important Cultural Properties."}},{"area":"愛知県名古屋市熱田区","name":"熱田神宮","desc":"三種の神器の一つである草薙神剣（くさなぎのみつるぎ）を祀る、日本屈指の格式高い大社。1900年以上の歴史を誇る。","url":"https://www.atsutajingu.or.jp/","map":"https://www.google.com/maps/search/熱田神宮","rate":5,"rg":"中部地方","en":{"name":"Atsuta Jingu Shrine","desc":"One of Japan's most venerable grand shrines, enshrining the sacred sword Kusanagi — one of the three Imperial Regalia — with a history of over 1,900 years."}},{"area":"愛知県岡崎市","name":"大樹寺","desc":"松平家・徳川将軍家の菩提寺。桶狭間の戦い後に逃げ帰った徳川家康が自害しようとしたところを住職に諭された歴史や、本堂から岡崎城を望む「ビュースポット」でも知られる。","url":"https://www.daijuji.jp/","map":"https://www.google.com/maps/search/大樹寺+岡崎","rate":4,"rg":"中部地方","en":{"name":"Daiju-ji Temple","desc":"The family temple of the Matsudaira and Tokugawa houses, where a priest dissuaded young Ieyasu from suicide after the Battle of Okehazama. Its main hall frames a famous view of Okazaki Castle."}},{"area":"新潟県新潟市中央区","name":"白山神社","desc":"新潟市総鎮守。縁結びや安産の神様として広く信仰を集め、新潟市街の中心に位置する歴史ある神社。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.niigatahakusanjinja.or.jp/&ved=2ahUKEwjU0czgsuyVAxVmU_UHHd3WIJMQFnoECEEQAQ&usg=AOvVaw3Brs9-PezCbkWRgTtYCiqt","map":"https://www.google.com/maps/search/白山神社+新潟","rate":4,"rg":"中部地方","en":{"name":"Hakusan Shrine, Niigata","desc":"The general guardian shrine of Niigata city at the heart of downtown, widely worshiped as a deity of matchmaking and safe childbirth."}},{"area":"新潟県弥彦村","name":"弥彦神社","desc":"越後国の一宮。「おやひこさま」の愛称で親しまれ、弥彦山を背に広大な社殿と厳かな雰囲気を誇る北陸屈指の大社。","url":"https://www.yahiko-jinjya.or.jp/","map":"https://www.google.com/maps/search/弥彦神社","rate":5,"rg":"中部地方","en":{"name":"Iyahiko Shrine","desc":"The ichinomiya of Echigo Province, affectionately called 'Oyahiko-sama.' One of Hokuriku's grandest shrines, set against Mt. Yahiko with a solemn, spacious precinct."}},{"area":"富山県富山市","name":"気多神社","desc":"越中国の一宮。高岡市（伏木）に鎮座し、能登の気多大社と並ぶ歴史を持ち、奈良時代からの古い信仰の歴史を伝える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://ketaweb.net/&ved=2ahUKEwikv632t-yVAxXbh68BHXAAC5wQFnoECDoQAQ&usg=AOvVaw3_gPJYxSXXSHVAvZzEv-7A","map":"https://www.google.com/maps/search/気多神社+富山","rate":4,"rg":"中部地方","en":{"name":"Keta Shrine (Toyama)","desc":"The ichinomiya of Etchu Province in Fushiki, Takaoka, with a history rivaling Keta Taisha in Noto and worship dating back to the Nara period."}},{"area":"富山県中新川郡立山町","name":"立山山麓（立山信仰・雄山神社峰本社遥拝所等）","desc":"（名所として）古くからの山岳信仰の聖地。立山登拝の歴史や雄大な自然景観が広がる日本の代表的な霊場エリア。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://www.oyamajinja.org/&ved=2ahUKEwj_tdmQuOyVAxU5s6gCHfF3EmMQFnoECD0QAQ&usg=AOvVaw0TT-32k3fTCMoIEpNtDuJY","map":"https://www.google.com/maps/search/雄山神社","rate":5,"rg":"中部地方","en":{"name":"Tateyama Foothills Sacred Area","desc":"A sacred area of mountain worship since ancient times — one of Japan's representative holy mountains, combining a long history of ascetic climbing with majestic natural scenery."}},{"area":"石川県金沢市","name":"主計町茶屋街・ひがし茶屋街周辺の「宇多須神社」","desc":"金沢の三大茶屋街の一つ、ひがし茶屋街に鎮座する古社。前田利家公を祀り、加賀藩の歴史と情緒ある町並みを伝える。","url":"https://www.kanazawa-kankoukyoukai.or.jp/spot/detail_10018.html","map":"https://www.google.com/maps/search/宇多須神社","rate":4,"rg":"中部地方","en":{"name":"Utasu Shrine (Higashi Chaya District)","desc":"An old shrine in Kanazawa's Higashi Chaya district, one of the city's three great tea-house quarters. It enshrines Maeda Toshiie and preserves the atmosphere of the Kaga domain."}},{"area":"石川県輪島市","name":"総持寺祖院（曹洞宗大本山祖院）","desc":"かつて曹洞宗の本山として栄えた壮大な寺院。能登の深い歴史と、幾多の苦難を乗り越えて受け継がれる堂宇の美しさが宿る。","url":"https://noto-soin.jp/","map":"https://www.google.com/maps/search/総持寺祖院","rate":5,"rg":"中部地方","en":{"name":"Sojiji Soin (Soto Zen Head Temple)","desc":"A vast temple that once flourished as a head temple of the Soto Zen school, its rebuilt halls embodying the deep history and endurance of Noto."}},{"area":"福井県大飯郡おおい町","name":"名田庄の歴史的街道（若狭街道・鯖街道）周辺","desc":"（名所として）若狭から京都へ海産物を運んだ「鯖街道」の宿場町として栄えた歴史と、深い山あいの美しい日本の原風景。","url":"https://www.jtb.co.jp/kokunai-guide/list/index.html?area=1805&feature=0&genre=151","map":"https://www.google.com/maps/search/鯖街道+おおい町","rate":3,"rg":"中部地方","en":{"name":"Nadasho Historic Routes (Saba Kaido)","desc":"Historic post roads along which marine products were carried from Wakasa to Kyoto — the famous 'Mackerel Road' — set amid untouched mountain scenery of old Japan."}},{"area":"福井県勝山市","name":"越前大仏（大師山清大寺）","desc":"圧倒的なスケールを誇る巨大な大仏と、奈良の大仏を超える高さを誇る五重塔がそびえる勝山の象徴的寺院。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=http://etizendaibutsu.com/&ved=2ahUKEwi0ivr7uOyVAxUYdvUHHQmTEBYQFnoECDcQAQ&usg=AOvVaw3rZiZUnBW6aJGOaZ3bPPqd","map":"https://www.google.com/maps/search/越前大仏","rate":4,"rg":"中部地方","en":{"name":"Echizen Great Buddha (Seidai-ji)","desc":"A symbol of Katsuyama city: a colossal Great Buddha and a five-story pagoda that towers even higher than the Great Buddha of Nara."}},{"area":"山梨県南巨摩郡身延町","name":"身延山久遠寺","desc":"日蓮宗の総本山。荘厳な大本堂や287段の石段（菩提梯）、樹齢数百年の杉や枝垂れ桜に囲まれた、日本仏教の至宝ともいえる大寺院。","url":"https://www.kuonji.jp/","map":"https://www.google.com/maps/search/身延山久遠寺","rate":5,"rg":"中部地方","en":{"name":"Kuon-ji Temple, Mt. Minobu","desc":"Head temple of the Nichiren school. A grand main hall, a five-story pagoda and the 287 stone steps of the Bodhi Terrace rise amid centuries-old cedars and weeping cherries."}},{"area":"山梨県甲州市","name":"恵林寺","desc":"武田信玄公の菩提寺であり、「心頭滅却すれば火もまた涼し」の語録で知られる臨済宗妙心寺派の名刹。","url":"https://erinji.jp/","map":"https://www.google.com/maps/search/恵林寺+甲州市","rate":5,"rg":"中部地方","en":{"name":"Erin-ji Temple","desc":"The family temple of Takeda Shingen, a distinguished Rinzai Zen temple of the Myoshin-ji line, known for the saying, 'If the heart is cleansed, even fire is cool.'"}},{"area":"長野県上田市","name":"上田城跡公園（上田城）","desc":"真田昌幸・幸村（信繁）親子が徳川の大軍を二度にわたり撃退したことで知られる、戦国最強の城と称される城跡。真田神社も鎮座。","url":"https://www.city.ueda.nagano.jp/site/park/5552.html","map":"https://www.google.com/maps/search/上田城跡公園","rate":5,"rg":"中部地方","en":{"name":"Ueda Castle Park","desc":"The castle where Sanada Masayuki and Yukimura twice repelled the mighty Tokugawa armies — hailed as the strongest castle of the Sengoku era. Sanada Shrine stands on the grounds."}},{"area":"長野県松本市","name":"国宝 松本城","desc":"（名所として）現存する日本最古の五重六階の天守を持つ国宝の城。黒漆の壁が美しく「烏城」の異名を持つ歴史的シンボル。","url":"https://www.matsumoto-castle.jp/","map":"https://www.google.com/maps/search/松本城","rate":5,"rg":"中部地方","en":{"name":"Matsumoto Castle (National Treasure)","desc":"A National Treasure with the oldest surviving five-story, six-level castle keep in Japan. Its black-lacquered walls have earned it the nickname 'Crow Castle.'"}},{"area":"岐阜県高山市","name":"高山市神岡町の歴史的鉱山町並み / 飛騨高山の古い町並み（三町伝統的建造物群保存地区）","desc":"（名所として）城下町の面影を色濃く残す江戸時代の商家町。歴史的な風情と伝統文化が息づく全国屈指の観光・歴史名所。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.city.takayama.lg.jp/kurashi/1000021/1000119/1000847/1001005/1001006.html&ved=2ahUKEwiv9fC8s-yVAxW7cvUHHQApFNEQFnoECBkQAQ&usg=AOvVaw33Bxb6CU73epjC1w_kz76U","map":"https://www.google.com/maps/search/
