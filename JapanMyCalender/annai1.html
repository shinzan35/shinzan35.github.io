飛騨高山古い町並み","rate":4,"rg":"中部地方","en":{"name":"Kamioka Mining Town / Hida Takayama Sanmachi","desc":"Edo-period merchant streets that retain the atmosphere of a castle town — one of Japan's foremost historic districts of tradition and culture."}},{"area":"岐阜県関市","name":"春日神社","desc":"刃物のまち・関市に鎮座し、平安時代からの歴史を持つ古社。地域の鎮守として深い信仰を集める。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.seki-kasuga.com/&ved=2ahUKEwiu6_7Ss-yVAxW3cfUHHZfWKyAQFnoECEcQAQ&usg=AOvVaw3K6ycjEFEk49Wg6UH8ku--","map":"https://www.google.com/maps/search/春日神社+関市","rate":3,"rg":"中部地方","en":{"name":"Kasuga Shrine, Seki","desc":"An old shrine in Seki, the city of blades, with a history dating to the Heian period and deep local devotion as the district's guardian shrine."}},{"area":"静岡県周智郡森町","name":"小国神社","desc":"遠江国の一宮として、1400年以上の歴史を誇る格式高い古社。大鳥居から続く鬱蒼とした杉林の参道が厳かな雰囲気を醸す。","url":"http://www.okunijinja.or.jp/","map":"https://www.google.com/maps/search/小国神社","rate":5,"rg":"中部地方","en":{"name":"Okuni Shrine","desc":"The ichinomiya of Totomi Province with 1,400 years of history. A solemn approach lined with dense cedar forest leads from the great torii gate."}},{"area":"静岡県伊豆市","name":"修禅寺","desc":"弘法大師空海が開基と伝わる伊豆の古刹。源頼家や源氏一族の悲劇の舞台としても知られ、温泉街の中心に静かに佇む。","url":"https://www.shuzenji-temple.jp/","map":"https://www.google.com/maps/search/修禅寺+伊豆","rate":4,"rg":"中部地方","en":{"name":"Shuzen-ji Temple","desc":"An ancient Izu temple founded, by tradition, by Kobo Daishi (Kukai). Known as the stage of tragedies involving Minamoto no Yoriie, it stands quietly at the heart of a hot-spring town."}},{"area":"愛知県犬山市","name":"犬山城（及び城下町）","desc":"（名所として）現存する日本最古の木造天守を持つ国宝の城。木曽川の絶壁にそびえ、城下町の歴史的町並みとともに高い価値を持つ。","url":"https://inuyama-castle.jp/","map":"https://www.google.com/maps/search/犬山城","rate":5,"rg":"中部地方","en":{"name":"Inuyama Castle & Castle Town","desc":"A National Treasure with Japan's oldest surviving wooden castle keep, towering over the cliffs of the Kiso River above a historic castle town."}},{"area":"愛知県豊川市","name":"豊川稲荷（妙厳寺）","desc":"日本三大稲荷の一つとして知られる曹洞宗の寺院。境内に祀られる数多くの霊狐像や厳かな堂宇が全国からの参拝者を集める。","url":"https://www.toyokawainari.jp/","map":"https://www.google.com/maps/search/豊川稲荷","rate":5,"rg":"中部地方","en":{"name":"Toyokawa Inari (Myogon-ji)","desc":"A Soto Zen temple counted among Japan's three great Inari shrines. Countless fox statues and solemn halls draw worshipers from all over the country."}},{"area":"新潟県上越市","name":"春日山神社","desc":"（名所として）上杉謙信公を祀る神社。春日山城の本丸跡近くに鎮座し、謙信公の銅像や周囲の中世山城の遺構が歴史を伝える。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.kasugayama-kasuga-jinja.com/&ved=2ahUKEwiLpcv0s-yVAxUwoK8BHWsfF7YQFnoECDgQAQ&usg=AOvVaw2YsC5D56VK_hbIo4Byj6U1","map":"https://www.google.com/maps/search/春日山神社","rate":4,"rg":"中部地方","en":{"name":"Kasugayama Shrine","desc":"A shrine dedicated to Uesugi Kenshin near the former main bailey of Kasugayama Castle, with Kenshin's bronze statue and the remains of a medieval mountain castle."}},{"area":"新潟県村上市","name":"村上市郷土資料館（おしゃぎり会館）周辺の「村上城跡」","desc":"（名所として）国の史跡である村上城の城跡。臥牛山に築かれた要害で、城下町の美しい町並みとともに歴史的価値が高い。","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.city.murakami.lg.jp/site/kanko/oshiroyama.html&ved=2ahUKEwjJ-OaKtOyVAxWcj68BHdEHItMQFnoECBoQAQ&usg=AOvVaw0lL69jfzmzFqx5L4qtImgl","map":"https://www.google.com/maps/search/村上城跡","rate":3,"rg":"中部地方","en":{"name":"Ruins of Murakami Castle","desc":"A National Historic Site fortress built on Mt. Gagyu, overlooking the beautiful streets of the old castle town — a place of high historic value."}},{"area":"富山県南砺市","name":"瑞泉寺（井波別院 瑞泉寺）","desc":"真宗大谷派の古刹。精緻な宮大工の彫刻が施された見事な山門や本堂がそびえ、「彫刻の町・井波」の中心をなす歴史的寺院。","url":"https://www.info-toyama.com/attractions/41019","map":"https://www.google.com/maps/search/瑞泉寺+南砺市","rate":4,"rg":"中部地方","en":{"name":"Zuisen-ji Temple, Inami","desc":"An ancient Shin Buddhist temple whose superb gate and main hall bear exquisite carvings by master temple carpenters — the heart of the 'carving town' of Inami."}},{"area":"富山県高岡市","name":"射水神社","desc":"越中国の一宮。高岡古城公園内に鎮座し、古くから越中の総鎮守として豊かな自然と深い信仰を集める格式高い古社.","url":"https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.imizujinjya.or.jp/&ved=2ahUKEwjtw4HotOyVAxWIQ_UHHXiRPbsQFnoECEgQAQ&usg=AOvVaw2_ewtthEeRAwHjIL5R8iqQ","map":"https://www.google.com/maps/search/射水神社","rate":4,"rg":"中部地方","en":{"name":"Imizu Shrine","desc":"The ichinomiya of Etchu Province, set within Takaoka Kojo Park, long revered as the great guardian of Etchu amid rich greenery."}},{"area":"福井県勝山市","name":"白山平泉寺旧境内","desc":"（名所として）白山信仰の越前側の拠点として栄えた広大な宗教都市跡（国史跡）。苔むした美しい境内に中世の歴史の深さが眠る。","url":"https://www.heisenji.jp/","map":"https://www.google.com/maps/search/白山平泉寺旧境内","rate":5,"rg":"中部地方","en":{"name":"Former Grounds of Heisen-ji","desc":"The vast remains (National Historic Site) of a great religious city that flourished as the Echizen center of Hakusan faith — moss-covered grounds sleep amid medieval history."}},{"area":"石川県金沢市","name":"金沢神社","desc":"兼六園に隣接して鎮座する古社。前田家ゆかりの学問・安全の神様として、加賀の文化と深く結びついている。","url":"https://kanazawa-jj.or.jp/","map":"https://www.google.com/maps/search/金沢神社","rate":3,"rg":"中部地方","en":{"name":"Kanazawa Shrine","desc":"An old shrine beside Kenroku-en Garden, tied to the Maeda family as a deity of learning and safety, and deeply bound up with Kaga culture."}},{"area":"福井県小浜市","name":"明通寺","desc":"国宝の本堂と三重塔を持つ若狭地方最古の古刹。平安時代の密教建築の美しさと、厳かな雰囲気を今に伝える名刹。","url":"https://wakasa-obama.jp/spot/myotuji/","map":"https://www.google.com/maps/search/明通寺+小浜","rate":5,"rg":"中部地方","en":{"name":"Myotsu-ji Temple","desc":"The oldest temple of the Wakasa region, with a National Treasure main hall and three-story pagoda conveying the beauty of Heian-period esoteric architecture."}},{"area":"福井県福井市","name":"一乗谷朝倉氏遺跡","desc":"（名所として）戦国時代に朝倉氏が栄華を極めた城下町の遺跡（特別史跡・特別名勝）。当時の武家屋敷や庭園が完全な形で発掘されている。","url":"https://asakura-museum.pref.fukui.lg.jp/","map":"https://www.google.com/maps/search/一乗谷朝倉氏遺跡","rate":5,"rg":"中部地方","en":{"name":"Ichijodani Asakura Clan Ruins","desc":"The excavated castle town where the Asakura clan flourished in the Sengoku era (Special Historic Site / Special Place of Scenic Beauty). Samurai residences and gardens survive fully excavated."}},{"area":"山梨県甲府市","name":"金櫻神社","desc":"御岳山の山頂近くに鎮座する甲斐国の一宮（の一社）。金運や開運の神として知られ、水晶発祥の地としての歴史を持つ。","url":"https://kanazakura-shrin.webnode.jp/","map":"https://www.google.com/maps/search/金櫻神社","rate":4,"rg":"中部地方","en":{"name":"Kanzakura Shrine","desc":"A shrine of Kai Province near the summit of Mt. Mitake, known as a deity of good fortune, with a history tied to the birthplace of crystal (quartz)."}},{"area":"山梨県北杜市","name":"身曾岐神社","desc":"美しい能舞台や広大な境内で知られる格式高い神社。日本の伝統文化や心身の清めを伝える現代の重要な聖地の一つ。","url":"https://www.misogi.jp","map":"https://www.google.com/maps/search/身曾岐神社","rate":3,"rg":"中部地方","en":{"name":"Misoogi Shrine","desc":"A dignified shrine known for its beautiful Noh stage and spacious grounds — an important modern sanctuary conveying Japanese tradition and purification."}},{"area":"長野県塩尻市","name":"奈良井宿（中山道宿場町）","desc":"（名所として）中山道中最長宿場町として、江戸時代の伝統的な宿場町の町並みが奇跡的に保存されている国重要伝統的建造物群保存地区。","url":"https://www.naraijuku.com","map":"https://www.google.com/maps/search/奈良井宿","rate":5,"rg":"中部地方","en":{"name":"Narai-juku Post Town","desc":"The longest post station on the Nakasendo, whose Edo-period streetscapes survive miraculously intact — a nationally designated Preservation District."}},{"area":"長野県上田市","name":"北向観音（常楽寺）","desc":"善光寺と対をなす霊場として古くから「両参り」で信仰を集める天台宗の古刹。別所温泉の象徴的な存在。","url":"https://www.kitamuki-kannon.com/","map":"https://www.google.com/maps/search/北向観音","rate":4,"rg":"中部地方","en":{"name":"Kitamuki Kannon (Joraku-ji)","desc":"A Tendai temple paired with Zenko-ji; from old times worshipers 'visit both' for blessing. A symbol of Bessho Onsen."}},{"area":"岐阜県大垣市","name":"美濃国分寺","desc":"聖武天皇の詔により創建された美濃国の一宮・国分寺の法燈を伝える古刹。歴史のロマンを伝える境内が広がる。","url":"http://www.nisimino.com/nishimino33reijyou/jouhou/33.html","map":"https://www.google.com/maps/search/美濃国分寺","rate":3,"rg":"中部地方","en":{"name":"Mino Kokubun-ji Temple","desc":"An old temple carrying on the light of the provincial temple founded by decree of Emperor Shomu; its grounds evoke the romance of history."}},{"area":"岐阜県中津川市","name":"苗木城跡","desc":"（名所として）木曽川の絶壁に築かれた天然の要塞。巨岩をそのまま利用したダイナミックな石垣群と天守跡からの眺望が絶景の史跡。","url":"https://www.pref.gifu.lg.jp/page/366187.html","map":"https://www.google.com/maps/search/苗木城跡","rate":4,"rg":"中部地方","en":{"name":"Ruins of Naegi Castle","desc":"A natural fortress built on sheer cliffs above the Kiso River, with dramatic stone walls of giant bedrock and superb views from the keep."}},{"area":"静岡県浜松市中央区","name":"浜松城公園（浜松城跡）","desc":"（名所として）徳川家康が若い頃に居城とした「出世城」。幾多の戦乱をくぐり抜けた歴史と美しい石垣が残る。","url":"https://www.entetsuassist-dms.com/hamamatsu-jyo/","map":"https://www.google.com/maps/search/浜松城跡","rate":4,"rg":"中部地方","en":{"name":"Hamamatsu Castle Park","desc":"The 'Castle of Success' where young Tokugawa Ieyasu spent his youth, its handsome stone walls having weathered many wars."}},{"area":"静岡県賀茂郡松崎町","name":"長八美術館周辺の「岩科学校（国指定重要文化財）」","desc":"（名所として）明治初期に建てられた擬洋風校舎の最高傑作。伊豆の歴史と近代教育の歩みを伝える貴重な建築遺産。","url":"https://izumatsuzakinet.com/stores_facilities/iwashina-school","map":"https://www.google.com/maps/search/岩科学校","rate":3,"rg":"中部地方","en":{"name":"Iwashina School","desc":"A masterpiece of early-Meiji pseudo-Western school architecture (Important Cultural Property), conveying the history of Izu and of modern education."}},{"area":"愛知県新城市","name":"設楽原歴史資料館周辺の「長篠城跡」","desc":"（名所として）武田勝頼と織田・徳川連合軍が激突した「長篠・設楽原の戦い」の舞台。戦国歴史ファンの必見の史跡。","url":"http://www.city.shinshiro.lg.jp/index.cfm/8,3690,152,720,html","map":"https://www.google.com/maps/search/長篠城跡","rate":4,"rg":"中部地方","en":{"name":"Ruins of Nagashino Castle","desc":"The site of the Battle of Nagashino-Shitaragahara, where Takeda Katsuyori clashed with the Oda-Tokugawa alliance. Essential viewing for Sengoku-history fans."}},{"area":"愛知県知多郡美浜町","name":"真宗大谷派 尾張三河の古寺群（野間大坊 / 大御堂寺）","desc":"源義朝の墓所があり、平家物語や鎌倉初期の源氏の悲劇の歴史を色濃く伝える由緒ある寺院。","url":"https://nomadaibou.jp/","map":"https://www.google.com/maps/search/野間大坊","rate":4,"rg":"中部地方","en":{"name":"Noma Dobo / Omido-ji Temple","desc":"Historic temples holding the tomb of Minamoto no Yoshitomo, evoking the tragedies of the Minamoto clan told in the Tale of the Heike."}},{"area":"新潟県柏崎市","name":"椎谷観音堂（妙法寺など周辺古刹）","desc":"（名所として）日本海を見下ろす景勝地に位置し、古くから海上安全や地域の信仰を集めてきた歴史ある霊場。","url":"https://www.city.kashiwazaki.lg.jp/soshikiichiran/kyoikuiinkai/bunka_shogaigakushuka/5/2/5765.html","map":"https://www.google.com/maps/search/椎谷観音堂","rate":5,"rg":"中部地方","en":{"name":"Shiiya Kannon-do Hall","desc":"A historic sanctuary on scenic heights above the Sea of Japan, long a focus of prayers for safety at sea and of local faith."}},{"area":"新潟県魚沼市","name":"西福寺（開山堂）","desc":"幕末の名工・石川雲蝶の圧倒的な彫刻群が堂内全体に施され、「北陸の日光」と称される曹洞宗の古刹。","url":"https://www.saifukuji.jp/","map":"https://www.google.com/maps/search/西福寺+魚沼","rate":5,"rg":"中部地方","en":{"name":"Saifuku-ji Temple, Uonuma","desc":"A Soto Zen temple called 'the Nikko of Hokuriku,' its halls entirely covered with the overwhelming carvings of the late-Edo master Ishikawa Uncho."}},{"area":"富山県南砺市","name":"五箇山（相倉・菅沼合掌造り集落）","desc":"（名所として）世界遺産に登録された、豪雪地帯の知恵と伝統的な合掌造り家屋が手つかずの自然の中に息づく歴史的集落。","url":"https://www.gokayama-info.jp/","map":"https://www.google.com/maps/search/五箇山合掌造り集落","rate":5,"rg":"中部地方","en":{"name":"Gokayama Gassho Villages","desc":"World Heritage gassho-style villages (Ainokura and Suganuma) where the wisdom of a heavy-snow region lives on amid untouched nature."}},{"area":"富山県滑川市","name":"櫟原神社","desc":"滑川の総鎮守として、平安時代からの歴史を持ち、地域の人々の深い信仰を集める古社。","url":"https://toyama-bunkaisan.jp/search/2518/","map":"https://www.google.com/maps/search/櫟原神社","rate":3,"rg":"中部地方","en":{"name":"Ichihara Shrine","desc":"The general guardian shrine of Namerikawa with a history dating to the Heian period, long gathering the deep devotion of local people."}},{"area":"石川県金沢市","name":"尾崎神社","desc":"東照宮として建立され、金沢城の北の守りを担った神社。絢爛豪華な社殿は国の重要文化財。","url":"https://www.ishikawa-jinjacho.or.jp/shrine/j0213/","map":"https://www.google.com/maps/search/尾崎神社+金沢","rate":4,"rg":"中部地方","en":{"name":"Ozaki Shrine","desc":"Built as a Toshogu shrine guarding the north of Kanazawa Castle; its gorgeous halls are Important Cultural Properties."}},{"area":"石川県七尾市","name":"気多本宮（御祓神社など七尾の古社群）","desc":"能登の歴史的中心地・七尾に鎮座し、能登国の政治・宗教の中心として栄えた歴史を伝える古社。","url":"https://www.city.nanao.lg.jp/","map":"https://www.google.com/maps/search/御祓神社","rate":3,"rg":"中部地方","en":{"name":"Keta Hongu (Nanao)","desc":"An old shrine in Nanao, the historic center of Noto, recalling the province's political and religious heartland."}},{"area":"福井県大飯郡高浜町","name":"青葉山（中山寺）","desc":"若狭富士と呼ばれる青葉山の麓に建つ古刹。美しい自然環境と歴史ある仏教文化が息づく霊場。","url":"https://wakasa-takahama.jp/spot/aobasan/","map":"https://www.google.com/maps/search/中山寺+高浜町","rate":4,"rg":"中部地方","en":{"name":"Mt. Aoba (Nakayama-dera)","desc":"A temple at the foot of Mt. Aoba, called 'Wakasa Fuji' — a sanctuary where beautiful nature and Buddhist culture live on."}},{"area":"福井県小浜市","name":"羽賀寺","desc":"奈良時代の養老元年（717年）に元正天皇の勅願で創建されたと伝わる古刹。本尊の十一面観音菩薩立像は国の重要文化財。","url":"https://www.hagaji.com/","map":"https://www.google.com/maps/search/羽賀寺","rate":4,"rg":"中部地方","en":{"name":"Haga-ji Temple","desc":"An ancient temple founded, as tradition holds, in 717 by imperial decree of Empress Gensho; its eleven-faced Kannon statue is an Important Cultural Property."}},{"area":"山梨県甲府市","name":"甲斐善光寺","desc":"武田信玄公が川中島の戦いの際に、信濃善光寺の焼失を恐れて本尊等を移すために創建した古刹。壮大な山門や金堂が残る。","url":"http://www.kai-zenkoji.or.jp/","map":"https://www.google.com/maps/search/甲斐善光寺","rate":5,"rg":"中部地方","en":{"name":"Kai Zenko-ji Temple","desc":"Founded by Takeda Shingen to shelter the sacred image of Shinano's Zenko-ji from the wars of Kawanakajima. A grand main gate and main hall remain."}},{"area":"山梨県南都留郡富士河口湖町","name":"浅間神社（富士御室浅間神社）","desc":"世界遺産・富士山の構成資産の一つ。本殿は現存する富士山最古の建造物で、富士山信仰の歴史を深く伝える。","url":"https://www.fujiomurosengenjinja.com/","map":"https://www.google.com/maps/search/富士御室浅間神社","rate":4,"rg":"中部地方","en":{"name":"Fuji Omuro Sengen Shrine","desc":"A component of the Mt. Fuji World Heritage site; its main hall is the oldest surviving building on Mt. Fuji, steeped in the history of Fuji worship."}},{"area":"長野県木曽郡木曽町","name":"福島関所跡（木曽福島関所）","desc":"（名所として）江戸時代の主要な関所の一つ。中山道を行き交う人々を取り締まった歴史的背景と資料を伝える。","url":"https://www.town-kiso.com/facility/100024/","map":"https://www.google.com/maps/search/福島関所跡","rate":4,"rg":"中部地方","en":{"name":"Ruins of Fukushima Checkpoint","desc":"One of Edo-period Japan's major checkpoints, which controlled travelers on the Nakasendo; exhibits convey this historic background."}},{"area":"長野県茅野市","name":"尖石縄文考古館周辺（尖石遺跡）","desc":"（名所として）国宝の「土偶（縄文のビーナス・仮面の女神）」が出土した日本を代表する縄文時代の史跡・学びの場。","url":"https://www.city.chino.lg.jp/site/togariishi/","map":"https://www.google.com/maps/search/尖石縄文考古館","rate":4,"rg":"中部地方","en":{"name":"Togariishi Jomon Site & Museum","desc":"A representative Jomon-period site where National Treasure dogu clay figures — the 'Jomon Venus' and 'Masked Goddess' — were unearthed."}},{"area":"岐阜県郡上市","name":"郡上八幡城下町（郡上八幡城）","desc":"（名所として）「日本一美しい山城」とも称される郡上八幡城と、水と踊りの歴史が息づく城下町。","url":"https://gujohachiman.com/kanko/","map":"https://www.google.com/maps/search/郡上八幡城","rate":5,"rg":"中部地方","en":{"name":"Gujo Hachiman Castle Town","desc":"Gujo Hachiman Castle, called 'Japan's most beautiful mountaintop castle,' and a town alive with the history of its pure water and folk dance."}},{"area":"岐阜県下呂市","name":"温泉寺","desc":"下呂温泉の街並みを見下ろす高台に建つ臨済宗の古刹。温泉の発見にまつわる薬師如来の伝説を伝える静かな名刹。","url":"https://onsenji.jp/","map":"https://www.google.com/maps/search/温泉寺+下呂","rate":3,"rg":"中部地方","en":{"name":"Onsen-ji Temple, Gero","desc":"A quiet Rinzai temple on a hill overlooking Gero Onsen, telling the legend of the healing Yakushi Buddha linked to the hot spring's discovery."}},{"area":"静岡県伊豆の国市","name":"韮山反射炉","desc":"（名所として）世界文化遺産に登録された、幕末に日本が建造した実用反射炉。日本の近代化の歴史を伝える貴重な遺産。","url":"http://www.city.izunokuni.shizuoka.jp/bunka_bunkazai/manabi/bunkazai/hansyaro/index.html","map":"https://www.google.com/maps/search/韮山反射炉","rate":5,"rg":"中部地方","en":{"name":"Nirayama Reverberatory Furnaces","desc":"Practical reverberatory furnaces built in the late Edo period, inscribed as World Cultural Heritage — precious monuments to Japan's modernization."}},{"area":"静岡県袋井市","name":"法多山尊永寺","desc":"厄除け観音として全国的な知名度を誇る真言宗智山派の名刹。広大な境内に堂宇が並び、名物の厄除団子でも知られる。","url":"https://www.hattasan.or.jp/","map":"https://www.google.com/maps/search/法多山尊永寺","rate":4,"rg":"中部地方","en":{"name":"Hattasan Sonei-ji Temple","desc":"A Shingon Chizan temple famed nationwide for its ward-dispelling Kannon, with spacious grounds and its famous yakuyoke dango dumplings."}},{"area":"愛知県名古屋市千種区","name":"日泰寺（覚王山日泰寺）","desc":"日本で唯一、特定の宗教宗派に属さない全日本仏教徒のための寺院。タイ王国から贈られた仏舎利（お釈迦様の遺骨）を安置する。","url":"https://www.nittaiji.or.jp/","map":"https://www.google.com/maps/search/日泰寺","rate":4,"rg":"中部地方","en":{"name":"Nittai-ji Temple","desc":"Japan's only temple belonging to no single Buddhist school, built for all Japanese Buddhists; it enshrines relics of the Buddha gifted by the Kingdom of Thailand."}},{"area":"愛知県瀬戸市","name":"定光寺","desc":"尾張徳川家の菩提寺であり、初代・徳川義直の廟所がある臨済宗妙心寺派の古刹。緑豊かな景勝地に佇む。","url":"https://seto-marutto.info/","map":"https://www.google.com/maps/search/定光寺+瀬戸","rate":4,"rg":"中部地方","en":{"name":"Joko-ji Temple","desc":"Family temple of the Owari Tokugawa with the mausoleum of the first lord Tokugawa Yoshinao — a Rinzai temple set in lush scenic greenery."}},{"area":"新潟県佐渡市","name":"佐渡金山跡（相川金山）","desc":"（名所として）江戸時代から昭和にかけて日本の財政を支えた世界最大級の金銀山。世界遺産登録でも注目される歴史的遺産。","url":"https://www.sado-kinzan.com/","map":"https://www.google.com/maps/search/佐渡金山","rate":5,"rg":"中部地方","en":{"name":"Sado Gold Mine (Aikawa)","desc":"One of the world's great gold and silver mines, which financed Japan from the Edo era into the twentieth century — now noted for World Heritage listing."}},{"area":"新潟県糸魚川市","name":"奴奈川神社","desc":"『古事記』にも登場する奴奈川姫を祀る、糸魚川の総鎮守。周辺の翡翠（ヒスイ）文化と古代神話のロマンを伝える古社。","url":"https://www.city.itoigawa.lg.jp/","map":"https://www.google.com/maps/search/奴奈川神社","rate":4,"rg":"中部地方","en":{"name":"Nunagawa Shrine","desc":"The general guardian shrine of Itoigawa, enshrining Princess Nunagawa of the Kojiki, evoking jade culture and ancient myth."}},{"area":"富山県魚津市","name":"魚津城跡（及び周辺の歴史文化スポット）","desc":"（名所として）上杉謙信と織田信長（柴田勝家等）の間で激しい攻防戦が繰り広げられた戦国の舞台。歴史ファン必見の城跡。","url":"https://uozu-kanko.jp/library/uozujyouseki/","map":"https://www.google.com/maps/search/魚津城跡","rate":3,"rg":"中部地方","en":{"name":"Ruins of Uozu Castle","desc":"The Sengoku battleground of fierce fighting between Uesugi Kenshin and the forces of Oda Nobunaga (including Shibata Katsuie) — a must for history fans."}},{"area":"富山県射水市","name":"太閤山・新湊の歴史的湊町エリア（櫛田神社など）","desc":"越中の古い湊町として栄え、延喜式内社である櫛田神社など、北前船交易の歴史と深い信仰を伝える古社寺が点在する。","url":"http://kushida.main.jp/index.html","map":"https://www.google.com/maps/search/櫛田神社+射水","rate":3,"rg":"中部地方","en":{"name":"Shinminato Historic Port Area","desc":"An old port town of Etchu dotted with ancient shrines such as Kushida Shrine of the Engi-shiki, recalling kitamaebune trade and deep faith."}},{"area":"石川県輪島市","name":"重蔵神社","desc":"輪島の総鎮守として長い歴史を持ち、例大祭の「輪島大祭」など能登の豊かな伝統文化と深い結びつきを持つ古社。","url":"https://www.wajimanavi.jp/","map":"https://www.google.com/maps/search/重蔵神社","rate":4,"rg":"中部地方","en":{"name":"Chozo Shrine","desc":"The general guardian shrine of Wajima with a long history, deeply tied to Noto's rich traditions such as the Wajima Grand Festival."}},{"area":"石川県小松市","name":"那谷寺","desc":"澄んだ自然の中に奇岩遊仙境が広がる、高野山真言宗の別格本山。1300年の歴史を持ち、松尾芭蕉も訪れて句を詠んだ名刹。","url":"https://natadera.com/","map":"https://www.google.com/maps/search/那谷寺","rate":5,"rg":"中部地方","en":{"name":"Nata-dera Temple","desc":"A special head temple of Koyasan Shingon set amid wondrous rock scenery; 1,300 years old, visited and praised by the poet Matsuo Basho."}},{"area":"福井県三方上中郡若狭町","name":"若狭神宮寺","desc":"東大寺二月堂のお水取り（お水送り）の神事が行われることで全国的に知られる、歴史的・仏教的に極めて重要な古刹。","url":"https://wakasa-obama.jp/spot/jinguji/","map":"https://www.google.com/maps/search/若狭神宮寺","rate":5,"rg":"中部地方","en":{"name":"Wakasa Jingu-ji Temple","desc":"A temple of great historical and Buddhist importance, famous nationwide for the 'Omizu-okuri' water ritual that feeds Nara's Omizutori ceremony."}},{"area":"福井県福井市","name":"足羽神社","desc":"継体天皇を祀り、福井市（足羽山）の総鎮守として深い歴史を持つ古社。境内には見事なシダレザクラがそびえる。","url":"https://asuwajinja.jp/","map":"https://www.google.com/maps/search/足羽神社","rate":4,"rg":"中部地方","en":{"name":"Asuwa Shrine","desc":"Enshrining Emperor Keitai, the general guardian shrine of Fukui city on Mt. Asuwa, with a magnificent weeping cherry rising on its grounds."}},{"area":"山梨県南都留郡鳴沢村","name":"富士山麓の洞窟群（富岳風穴・鳴沢氷穴）及び周辺の浅間信仰遺跡","desc":"（名所として）富士山の噴火によって形成された溶岩洞窟であり、古くから修験道の修行場としても利用された神秘的な自然・歴史遺産。","url":"https://www.mtfuji-cave.com/","map":"https://www.google.com/maps/search/富岳風穴","rate":4,"rg":"中部地方","en":{"name":"Lava Caves of Mt. Fuji","desc":"Lava caves formed by eruptions of Mt. Fuji (Fugaku Fuketsu and Narusawa Hyoketsu), once used for Shugendo training — a mysterious natural and historic heritage."}},{"area":"山梨県甲府市","name":"湯村温泉郷の弘法湯 / 薬王園周辺","desc":"（名所として）弘法大師空海によって発見されたと伝わる歴史ある温泉郷。武田信玄公の隠し湯としても知られる。","url":"https://koubo-yu.com/","map":"https://www.google.com/maps/search/湯村温泉","rate":3,"rg":"中部地方","en":{"name":"Yumura Onsen (Kobo-yu)","desc":"A historic hot-spring district said to have been discovered by Kobo Daishi, also known as the hidden bath of Takeda Shingen."}},{"area":"長野県下伊那郡阿智村","name":"元善光寺","desc":"善光寺の源流となった寺院。「善光寺だけでは片参り」とされ、善光寺と合わせて参拝することで功徳が増すとされる古刹。","url":"https://motozenkoji.jp/","map":"https://www.google.com/maps/search/元善光寺","rate":4,"rg":"中部地方","en":{"name":"Moto Zenko-ji Temple","desc":"The temple from which Zenko-ji originated; as 'visiting Zenko-ji alone is only half the journey,' worshipers visit both for multiplied blessings."}},{"area":"長野県木曽郡上松町","name":"赤沢自然休養林（及び周辺の木曽檜・山岳信仰の歴史）","desc":"（名所として）日本三大美林の一つであり、近代林業発祥の地。森林鉄道や木曽の山岳信仰の歴史を今に伝える貴重な森。","url":"https://www.rinya.maff.go.jp/chubu/policy/business/conservation/yuukyuu/kisoyuukyuunomori.html","map":"https://www.google.com/maps/search/赤沢自然休養林","rate":4,"rg":"中部地方","en":{"name":"Akasawa Recreational Forest","desc":"One of Japan's three great beautiful forests and the birthplace of modern forestry — a precious woodland preserving forest railways and the history of Kiso mountain faith."}},{"area":"岐阜県大垣市","name":"墨俣一夜城（歴史資料館）","desc":"（名所として）豊臣秀吉（当時・木下藤吉郎）が美濃攻めの際に長良川畔にわずか一夜で築いたと伝わる伝説の城（跡地）。","url":"https://www.city.ogaki.lg.jp/","map":"https://www.google.com/maps/search/墨俣一夜城","rate":4,"rg":"中部地方","en":{"name":"Sunomata Ichiya Castle","desc":"The legendary castle said to have been built in a single night by Toyotomi Hideyoshi (then Kinoshita Tokichiro) during the campaign for Mino."}},{"area":"岐阜県飛騨市","name":"気多若宮神社","desc":"飛騨国の古社であり、飛騨古川の美しい町並みを見下ろす高台に鎮座。重要無形民俗文化財の「起し太鼓」の舞台としても有名。","url":"https://www.hida-kankou.jp/spot/366","map":"https://www.google.com/maps/search/気多若宮神社","rate":4,"rg":"中部地方","en":{"name":"Ketawakamiya Shrine","desc":"An ancient shrine of Hida Province on a hill overlooking Hida-Furukawa, famous as the stage of the 'Okoshi Daiko' festival, an Important Intangible Folk Cultural Property."}},{"area":"静岡県賀茂郡西伊豆町","name":"堂ヶ島（天窓洞）周辺の歴史的海岸美","desc":"（名所として）伊豆の海の浸食によって生まれた神秘的な海の洞窟（天窓洞）。古くからの海の交通と美しい自然景勝地。","url":"https://www.nishiizu-kankou.com/sightseeing","map":"https://www.google.com/maps/search/堂ヶ島天窓洞","rate":4,"rg":"中部地方","en":{"name":"Dogashima (Tensodo Cave)","desc":"A mysterious sea cave carved by the erosion of the Izu coast, long tied to coastal traffic and celebrated as a scenic spot of natural beauty."}},{"area":"静岡県磐田市","name":"見付天神（矢奈比賣神社）","desc":"遠江国の見付宿に鎮座し、霊犬「早太郎」の伝説や『しっぺい太郎』の祭りで全国的に知られる格式の高い古社。","url":"https://mitsuke-tenjin.com/","map":"https://www.google.com/maps/search/見付天神","rate":4,"rg":"中部地方","en":{"name":"Mitsuke Tenjin Shrine","desc":"A dignified old shrine at the Mitsuke post town of Totomi Province, known nationwide for the legend of the divine dog 'Hayataro' and the Shippei-taro festival."}},{"area":"愛知県新城市","name":"鳳来寺山（鳳来寺）","desc":"文武天皇の勅願により開かれたと伝わる山岳寺院の古刹。美しい自然と徳川家康誕生の伝説、そして美しい仁王門（国重要文化財）で知られる。","url":"https://www.aichi-now.jp/","map":"https://www.google.com/maps/search/鳳来寺","rate":4,"rg":"中部地方","en":{"name":"Hosan-ji Temple, Mt. Houraiji","desc":"A mountain temple founded by imperial decree of Emperor Monmu, famed for its beautiful nature, the legend of Tokugawa Ieyasu's birth, and its fine Nio gate (Important Cultural Property)."}},{"area":"愛知県名古屋市昭和区","name":"八事山 興正寺","desc":"尾張徳川家の祈願所として栄えた高野山真言宗の古刹。木造の五重塔（東海地方唯一の木造五重塔）がそびえる。","url":"https://www.koushoji.or.jp/","map":"https://www.google.com/maps/search/興正寺+名古屋","rate":4,"rg":"中部地方","en":{"name":"Kosho-ji Temple, Yagoto","desc":"An ancient Koyasan Shingon temple that flourished as the prayer hall of the Owari Tokugawa; its wooden five-story pagoda is the only one in the Tokai region."}},{"area":"新潟県佐渡市","name":"蓮華峰寺","desc":"真言宗豊山派の古刹。弘法大師空海の開基と伝わり、国の重要文化財に指定された金堂や多数の貴重な文化財が残る霊場。","url":"https://www.visitsado.com/spot/detail0123/","map":"https://www.google.com/maps/search/蓮華峰寺","rate":4,"rg":"中部地方","en":{"name":"Rengeho-ji Temple, Sado","desc":"An ancient Shingon Buzan temple traditionally founded by Kobo Daishi, with an Important Cultural Property main hall and many precious cultural assets."}},{"area":"新潟県新潟市西蒲区","name":"弥彦山頂公園 / 越後一宮弥彦神社 奥宮（御神廟）","desc":"（名所として）弥彦山の山頂に鎮座し、神武天皇の御代の創祀と伝わる弥彦神社の奥宮。日本海や越後平野を見渡す絶景の聖地。","url":"https://www.yahiko-jinjya.or.jp/","map":"https://www.google.com/maps/search/弥彦神社奥宮","rate":4,"rg":"中部地方","en":{"name":"Mt. Yahiko Summit Park (Okumiya)","desc":"The inner shrine of Iyahiko on the mountain summit, said to date to the reign of Emperor Jimmu — a sacred spot with sweeping views of the Sea of Japan and the Echigo plain."}},{"area":"富山県南砺市","name":"城端の町並み（及び善徳寺）","desc":"（名所として）「越中の小京都」とも称される城端の伝統的町並みと、加賀藩主の前田家とも深い歴史を持つ浄土真宗の古刹・善徳寺。","url":"https://www.info-toyama.com/articles/shiho-johana","map":"https://www.google.com/maps/search/城端善徳寺","rate":4,"rg":"中部地方","en":{"name":"Johana Historic Streets & Zentoku-ji","desc":"The traditional streets of Johana, called 'the little Kyoto of Etchu,' together with the Shin Buddhist temple Zentoku-ji, long tied to the Maeda lords."}},{"area":"富山県富山市","name":"岩瀬の古い町並み（及び森家住宅等）","desc":"（名所として）北前船の寄港地として栄えた富山市岩瀬地区の歴史的港町。往時の繁栄を伝える豪商の屋敷や伝統的な町並みが残る。","url":"https://www.info-toyama.com/attractions/80026","map":"https://www.google.com/maps/search/富山岩瀬町並み","rate":4,"rg":"中部地方","en":{"name":"Iwase Historic Quarter","desc":"The historic port district of Iwase in Toyama city, which flourished as a stop for kitamaebune ships; mansions of wealthy merchants and old streetscapes remain."}},{"area":"石川県金沢市","name":"妙立寺（忍者寺）","desc":"加賀藩主・前田利常が外敵の侵入を防ぐためのしかけ（隠し階段、落とし穴、見張台など）を数多く組み込んで建立した、通称「忍者寺」。","url":"http://www.myouryuji.or.jp/","map":"https://www.google.com/maps/search/妙立寺+忍者寺","rate":5,"rg":"中部地方","en":{"name":"Myoryu-ji 'Ninja Temple'","desc":"Built by the Kaga lord Maeda Toshitsune with many ingenious devices — hidden stairs, trapdoors and watch platforms — to guard against intruders: the famous 'Ninja Temple.'"}},{"area":"石川県加賀市","name":"山中温泉の歴史的街道（あやとり橋・渓谷美）","desc":"（名所として）松尾芭蕉が愛した名湯・山中温泉の豊かな渓谷美と、伝統工芸（山中漆器）の歴史が息づく風情ある温泉街。","url":"https://www.yamanaka-spa.or.jp/","map":"https://www.google.com/maps/search/山中温泉","rate":4,"rg":"中部地方","en":{"name":"Yamanaka Onsen Historic Street","desc":"The beloved hot spring of the poet Matsuo Basho, where rich valley scenery, the Ayatori bridge and the history of Yamanaka lacquerware color a charming spa town."}},{"area":"福井県小浜市","name":"神宮寺（若狭国一宮等との歴史的繋がり）","desc":"（名所として小浜の古刹群）若狭の歴史と仏教文化の中心地であり、古代からの大陸文化の玄関口としての歴史を深く伝える地域。","url":"https://wakasa-obama.jp/spot/jinguji/","map":"https://www.google.com/maps/search/小浜神宮寺","rate":4,"rg":"中部地方","en":{"name":"Jingu-ji Temple, Obama","desc":"At the heart of Wakasa's history and Buddhist culture, this temple area conveys Obama's role as the ancient gateway for culture from the continent."}},{"area":"福井県大野市","name":"越前大野城（及び城下町）","desc":"（名所として）「天空の城」としても知られる、大野盆地の高台にそびえる美しい城と、武家屋敷の面影を残す小京都の町並み。","url":"https://www.city.ono.fukui.jp/","map":"https://www.google.com/maps/search/越前大野城","rate":5,"rg":"中部地方","en":{"name":"Ono Castle & Castle Town","desc":"A beautiful castle above the Ono basin, famous as the 'Castle in the Sky,' above a small-Kyoto castle town of samurai residences."}},{"area":"山梨県南都留郡富士河口湖町","name":"河口浅間神社","desc":"富士山の世界文化遺産構成資産の一つ。境内には樹齢1200年を超える巨大な杉の古木（県天然記念物）が立ち並ぶ荘厳な古社。","url":"https://www.yamanashi-kankou.jp/kankou/spot/p1_4445.html","map":"https://www.google.com/maps/search/河口浅間神社","rate":4,"rg":"中部地方","en":{"name":"Kawaguchi Asama Shrine","desc":"One of the component assets of Mt. Fuji's World Heritage listing; colossal cedars over 1,200 years old line its solemn precinct."}},{"area":"山梨県韮崎市","name":"新府城跡","desc":"（名所として）武田勝頼が織田信長との決戦に備えて築いた最後の城。戦国時代の終焉の歴史を伝える国の史跡。","url":"https://www.city.nirasaki.lg.jp/bunka_kanko_sports/bunka/3/2675.html","map":"https://www.google.com/maps/search/新府城跡","rate":4,"rg":"中部地方","en":{"name":"Ruins of Shinpu Castle","desc":"The last castle built by Takeda Katsuyori to face his decisive battle with Oda Nobunaga — a National Historic Site telling of the end of the Sengoku era."}},{"area":"長野県木曽郡木曽町","name":"妻籠宿（中山道宿場町）","desc":"（名所として）日本で最初に重要伝統的建造物群保存地区として選定された、江戸時代の宿場町の風情を完璧に残す歴史的景観。","url":"https://tsumago.jp/","map":"https://www.google.com/maps/search/妻籠宿","rate":5,"rg":"中部地方","en":{"name":"Tsumago-juku Post Town","desc":"The first place in Japan designated a Preservation District for traditional buildings, its Edo-period post-town streetscape preserved to perfection."}},{"area":"岐阜県大野郡白川村","name":"白川郷（合掌造り集落）","desc":"（名所として）世界遺産に登録された、日本の原風景を色濃く残す合掌造りの大集落。豪雪地帯の知恵と歴史的建造物が保存されている。","url":"https://shirakawa-go.gr.jp/","map":"https://www.google.com/maps/search/白川郷合掌造り集落","rate":5,"rg":"中部地方","en":{"name":"Shirakawa-go Gassho Village","desc":"A World Heritage village of great gassho-zukuri farmhouses preserving Japan's original rural landscape, built with the wisdom of a heavy-snow region."}},{"area":"岐阜県美濃市","name":"美濃国のうだつの上がる町並み","desc":"（名所として）江戸時代からの伝統的な「うだつ」が並ぶ商人の町並み。美濃和紙の歴史と伝統建築が息づく重要伝統的建造物群保存地区。","url":"https://minokanko.com/seeing/category/history-culture/p5973/","map":"https://www.google.com/maps/search/美濃市うだつの上がる町並み","rate":4,"rg":"中部地方","en":{"name":"Udatsu Streets of Mino","desc":"A merchant quarter lined with traditional 'udatsu' firewalls since the Edo period, alive with the history of Mino washi paper — a designated Preservation District."}},{"area":"静岡県賀茂郡南伊豆町","name":"石廊崎（石室神社など）","desc":"（名所として）伊豆半島最南端の岬に鎮座し、絶壁の岩肌に張り付くように建てられた神秘的な石室神社と海の安全を守る信仰の地。","url":"http://izugeopark.org/maps/area-minamiizu/irouzaki_ikenohara/iroujinja/","map":"https://www.google.com/maps/search/石室神社","rate":4,"rg":"中部地方","en":{"name":"Irozaki Cape (Iroiro Shrine)","desc":"At the southern tip of the Izu Peninsula, the mystical Iroiro Shrine clings to sheer cliffs — a place of worship for safety at sea."}},{"area":"静岡県浜松市浜名区","name":"龍潭寺","desc":"井伊家の菩提寺であり、遠州の小京都・井伊谷に位置する臨済宗妙心寺派の古刹。国指定名勝の美しい庭園で知られる。","url":"https://www.ryotanji.com/","map":"https://www.google.com/maps/search/龍潭寺+浜松","rate":5,"rg":"中部地方","en":{"name":"Ryutan-ji Temple","desc":"The family temple of the Ii clan in Iinoya, 'the little Kyoto of Enshu' — a Rinzai Myoshin-ji temple renowned for its nationally designated garden."}},{"area":"愛知県瀬戸市","name":"岩屋堂（及び岩屋山光明寺）","desc":"（名所として）紅葉の名所としても知られ、弘法大師が修行したと伝わる巨岩や岩屋に祀られた仏像が残る古くからの霊場。","url":"https://seto-marutto.info/","map":"https://www.google.com/maps/search/岩屋堂+瀬戸","rate":3,"rg":"中部地方","en":{"name":"Iwaya-do (Komyo-ji)","desc":"An ancient sanctuary known for autumn colors, where Buddhist statues are enshrined in great rocks and grottoes where Kobo Daishi is said to have trained."}},{"area":"愛知県知多郡美浜町","name":"野間灯台（野間周辺の歴史的海岸美）","desc":"（名所として）伊勢湾を望む知多半島のシンボルであり、明治から続く海の安全の歴史と美しい夕日を誇る景勝地。","url":"https://www.chitamaru.jp/","map":"https://www.google.com/maps/search/野間灯台","rate":3,"rg":"中部地方","en":{"name":"Noma Lighthouse","desc":"A symbol of the Chita Peninsula overlooking Ise Bay, with a history of maritime safety since the Meiji era and a reputation for beautiful sunsets."}},{"area":"新潟県妙高市","name":"関山神社","desc":"加賀の白山神社、立山の雄山神社と並び、妙高山の山岳信仰（妙高権現）の拠点として修験道の歴史を伝える古社。","url":"https://www.city.myoko.niigata.jp/","map":"https://www.google.com/maps/search/関山神社+妙高","rate":4,"rg":"中部地方","en":{"name":"Sekiyama Shrine","desc":"An old shrine that, together with Hakusan of Kaga and Oyama of Tateyama, formed a center of mountain worship of Mt. Myoko (Myoko Gongen) and its Shugendo history."}},{"area":"新潟県長岡市","name":"栃尾の城下町（秋葉三尺坊大権現・常安寺周辺）","desc":"（名所として）謙信公ゆかりの栃尾城跡や、火伏せの信仰として知られる秋葉三尺坊信仰の総本山・常安寺が佇む歴史の町。","url":"http://tochiokankou.jp/","map":"https://www.google.com/maps/search/常安寺+栃尾","rate":3,"rg":"中部地方","en":{"name":"Tochio Castle Town & Joan-ji","desc":"A historic town holding the castle ruins associated with Kenshin and Joan-ji, head temple of the fire-quelling Akiba faith."}},{"area":"富山県富山市","name":"八尾の町並み（越中八尾おわら風の盆）","desc":"（名所として）石垣と格子戸の街並みが美しい風情あふれる坂の町。伝統芸能「おわら風の盆」の歴史と日本情緒が息づく。","url":"https://owara-gyoujiunei.com/","map":"https://www.google.com/maps/search/八尾町並み","rate":5,"rg":"中部地方","en":{"name":"Etchu Yatsuo Historic Streets","desc":"A charming hillside town of stone walls and lattice windows, alive with the history of the traditional 'Owara Kaze no Bon' folk dance."}},{"area":"富山県砺波市","name":"庄川温泉郷（水記念公園・瓜裂清水）","desc":"（名所として）清流庄川の恵みと庄川峡の自然景観、名水百選「瓜裂清水（うりわりしょうず）」など古代からの水の信仰と自然名所。","url":"https://www.info-toyama.com/spot/80009/","map":"https://www.google.com/maps/search/瓜裂清水","rate":3,"rg":"中部地方","en":{"name":"Shogawa Onsenkyo","desc":"A place of ancient water worship and natural beauty: the clear Shogawa river, the gorge scenery of Shogawa-kyo, and spring water chosen among Japan's top 100."}},{"area":"石川県羽咋市","name":"妙成寺","desc":"日蓮宗の北陸本山。五重塔をはじめとする10棟の建造物が国の重要文化財に指定されている屈指の建造物群を誇る名刹。","url":"http://myojoji-noto.jp/","map":"https://www.google.com/maps/search/妙成寺","rate":5,"rg":"中部地方","en":{"name":"Myojo-ji Temple","desc":"The Hokuriku head temple of the Nichiren school, boasting ten Important Cultural Property buildings including a five-story pagoda."}},{"area":"石川県白山市","name":"鳥越城跡","desc":"（名所として）加賀一向一揆の最後の拠点となった山城跡。民衆が国を支配した一向一揆の歴史を深く伝える国の史跡。","url":"https://www.urara-hakusanbito.com/spot/detail_1157.html","map":"https://www.google.com/maps/search/鳥越城跡","rate":4,"rg":"中部地方","en":{"name":"Ruins of Torigoe Castle","desc":"The mountain castle that became the last stronghold of the Kaga Ikko-ikki uprisings — a National Historic Site telling of rule by the people."}},{"area":"福井県鯖江市","name":"西山公園（旧・西山長泉寺周辺）","desc":"（名所として）歴史あるツツジの名所であり、周辺には鯖江藩主間部氏の陣屋跡など伝統的な歴史遺産と自然が融合する。","url":"https://www.city.sabae.fukui.jp/kurashi_tetsuduki/doro_kasen_koen/koen/nishiyama/index.html","map":"https://www.google.com/maps/search/西山公園+鯖江","rate":4,"rg":"中部地方","en":{"name":"Nishiyama Park","desc":"A historic park famous for its azaleas, where natural beauty blends with heritage such as the former camp of the Sabae domain's Manabe lords."}},{"area":"山梨県大月市","name":"岩殿山城跡（岩殿山）","desc":"（名所として）武田二十四将の一人・小山田信茂の居城跡。断崖絶壁の天然の要害で、富士山を望む素晴らしい眺望を誇る。","url":"https://www.city.otsuki.yamanashi.jp/","map":"https://www.google.com/maps/search/岩殿山城跡","rate":4,"rg":"中部地方","en":{"name":"Ruins of Iwadono Castle","desc":"The castle of Oyamada Nobushige, one of the Twenty-Four Generals of the Takeda — a natural fortress on sheer cliffs with superb views of Mt. Fuji."}},{"area":"山梨県笛吹市","name":"大蔵経寺","desc":"行基が開山し武田氏の祈願所として栄えた真言宗の古刹。境内には甲州百名山「大蔵経寺山」への登山口もあり静寂に包まれる。","url":"http://www.daizokyoji.org/","map":"https://www.google.com/maps/search/大蔵経寺","rate":3,"rg":"中部地方","en":{"name":"Daikyo-ji Temple","desc":"A Shingon temple opened by Gyoki that flourished as a prayer temple of the Takeda clan; quiet grounds lead to the trails of Mt. Daikyo-ji."}},{"area":"長野県小諸市","name":"小諸城址 懐古園","desc":"（名所として）武田信玄の軍師・山本勘助らの見立てで築かれたとされる「穴城」。大手門や三の門（国重要文化財）など貴重な城郭遺構。","url":"https://www.city.komoro.lg.jp/kaikoen/","map":"https://www.google.com/maps/search/小諸城址懐古園","rate":5,"rg":"中部地方","en":{"name":"Komoro Castle Ruins (Kaiko-en)","desc":"The 'hollow castle' said to have been designed by Takeda Shingen's strategist Yamamoto Kansuke, with precious remains such as the main gate (Important Cultural Property)."}},{"area":"長野県伊那市","name":"高遠城址公園（高遠城跡）","desc":"（名所として）武田勝頼の弟・仁科盛信が織田信忠軍と凄絶な戦いを繰り広げた戦国史の舞台。「天下第一の桜」としても全国的に有名。","url":"https://inashi-kankoukyoukai.jp/","map":"https://www.google.com/maps/search/高遠城址公園","rate":5,"rg":"中部地方","en":{"name":"Takato Castle Ruins Park","desc":"The stage of the desperate Sengoku struggle of Nishina Morinobu against the Oda army, and nationally famous for 'the finest cherry blossoms under heaven.'"}},{"area":"岐阜県岐阜市","name":"伊奈波神社","desc":"垂仁天皇の御代の創建と伝わり、岐阜の総鎮守として「いなばさん」と親しまれる古社。岐阜城の城下町近くに鎮座。","url":"http://www.inabasan.com/","map":"https://www.google.com/maps/search/伊奈波神社","rate":5,"rg":"中部地方","en":{"name":"Inaba Shrine","desc":"Said to date from the reign of Emperor Suinin and beloved as 'Inaba-san' — the general guardian shrine of Gifu, near the castle town of Gifu Castle."}},{"area":"岐阜県不破郡関ケ原町","name":"関ケ原古戦場跡（徳川家康陣跡・石田三成陣跡など）","desc":"（名所として）天下分け目の「関ケ原の戦い」の舞台。広大なエリアに各武将の陣跡や記念館が点在する歴史ファン聖地。","url":"https://sekigahara.pref.gifu.lg.jp/","map":"https://www.google.com/maps/search/関ケ原古戦場跡","rate":5,"rg":"中部地方","en":{"name":"Sekigahara Battlefield","desc":"The stage of the decisive Battle of Sekigahara. Command posts of the warlords, monuments and museums are scattered across a broad field — a mecca for history lovers."}},{"area":"静岡県熱海市","name":"伊豆山神社","desc":"源頼朝と北条政子が忍び逢った地として知られ、強運・縁結びの神として親しまれる古社。参道の長い石段と相模湾の景色が名物。","url":"https://izusanjinjya.jp/","map":"https://www.google.com/maps/search/伊豆山神社","rate":5,"rg":"中部地方","en":{"name":"Izusan Shrine","desc":"Known as the place where Minamoto no Yoritomo and Hojo Masako first met, and worshiped as a deity of good fortune and matchmaking; its long stone steps and views of Sagami Bay are famous."}},{"area":"静岡県富士宮市","name":"人穴富士講遺跡（人穴浅間神社）","desc":"（名所として）富士講の始祖・長谷川角行が修行し入定したと伝わる洞窟と神社。世界遺産富士山の構成資産の一つ。","url":"https://www.fujinomiya.gr.jp/","map":"https://www.google.com/maps/search/人穴浅間神社","rate":4,"rg":"中部地方","en":{"name":"Hitohana Fujiko Site","desc":"A cave and shrine where Fuji-ko founder Hasegawa Kakugyo is said to have trained and entered eternal meditation — a component of the Mt. Fuji World Heritage listing."}},{"area":"愛知県清須市","name":"清洲城（清洲公園）","desc":"（名所として）織田信長公が「桶狭間の戦い」へ出陣した拠点であり、織田家の本拠地として織田信長・豊臣秀吉ゆかりの天下の銘城。","url":"https://www.city.kiyosu.aichi.jp/","map":"https://www.google.com/maps/search/清洲城","rate":5,"rg":"中部地方","en":{"name":"Kiyosu Castle","desc":"The base from which Oda Nobunaga marched to the Battle of Okehazama and the home ground of the Oda clan — a famous castle linked to Nobunaga and Hideyoshi."}},{"area":"愛知県豊田市","name":"松平郷（松平東照宮・高月院）","desc":"（名所として）徳川家康のルーツである松平氏発祥の地。松平家の菩提寺・高月院や徳川家康を祀る松平東照宮が佇む歴史の郷。","url":"http://www.matsudairagou.jp/","map":"https://www.google.com/maps/search/松平郷","rate":4,"rg":"中部地方","en":{"name":"Matsudaira Village","desc":"The birthplace of the Matsudaira clan, ancestors of Tokugawa Ieyasu, where the family temple Kogetsu-in and the Matsudaira Toshogu shrine quietly stand."}},{"area":"新潟県佐渡市","name":"長谷寺（佐渡の牡丹寺）","desc":"（名所として）長谷寺式観音菩薩像を安置し、美しい庭園と幾千株もの牡丹で知られる真言宗の古刹。佐渡の深い歴史と文化を伝える。","url":"https://www.visitsado.com/spot/detail0102/","map":"https://www.google.com/maps/search/長谷寺+佐渡","rate":4,"rg":"中部地方","en":{"name":"Hase-dera Temple, Sado","desc":"A Shingon temple housing a Hase-style Kannon statue, known for its beautiful garden and thousands of peonies, conveying the deep history and culture of Sado."}},{"area":"新潟県阿賀野市","name":"水原代官所（周辺の瓢湖）","desc":"（名所として）江戸幕府の天領を治めた水原代官所の歴史的建物（復元）と、白鳥の飛来地として名高い豊かな自然景勝地。","url":"https://niigata-kankou.or.jp/spot/7366","map":"https://www.google.com/maps/search/水原代官所","rate":3,"rg":"中部地方","en":{"name":"Mizuhara Daikansho (Hyoko Lake)","desc":"The restored building of the Edo shogunate's magistrate office at Mizuhara, beside Hyoko lake — famous as a sanctuary for migrating swans."}},{"area":"富山県射水市","name":"新湊の内川（日本のベニス）周辺の湊町歴史散歩","desc":"（名所として）漁船が並ぶ情緒ある内川の川沿いと、古くから北前船交易や漁業で栄えた湊町の歴史的景観が広がるエリア。","url":"https://www.info-toyama.com/attractions/21053","map":"https://www.google.com/maps/search/新湊内川","rate":4,"rg":"中部地方","en":{"name":"Shinminato Uchikawa Canal Stroll","desc":"A historic port area along the atmospheric Uchikawa canal — 'the Venice of Japan' — where fishing boats moor and the history of kitamaebune trade lingers."}},{"area":"富山県中新川郡立山町","name":"雄山神社（峰本社・中宮祈願殿・前立社本宮）","desc":"立山信仰の総本宮。標高3,003mの立山（雄山）山頂に峰本社を戴き、古くから修験道と自然崇拝の中心地として崇敬を集める聖地。","url":"http://www.oyamajinja.org/","map":"https://www.google.com/maps/search/雄山神社","rate":5,"rg":"中部地方","en":{"name":"Oyama Shrine, Tateyama","desc":"The head shrine of Tateyama worship, crowning the 3,003m summit of Mt. Tateyama — a holy center of Shugendo and nature worship since ancient times."}},{"area":"石川県金沢市","name":"大野の醤油蔵の町並み（及び金石の港町）","desc":"（名所として）日本三大醤油醸造地の一つとして知られ、加賀藩の御用達として発展した歴史ある醤油蔵と町並みが続く港町。","url":"https://www.kanazawa-kankoukyoukai.or.jp/","map":"https://www.google.com/maps/search/金沢大野町並み","rate":4,"rg":"中部地方","en":{"name":"Ono Soy Sauce District","desc":"One of Japan's three great soy-sauce brewing areas: a port town of historic breweries that grew up purveying to the Kaga domain."}},{"area":"福井県勝山市","name":"平泉寺白山神社（旧白山平泉寺）","desc":"白山信仰の越前側の中心として栄えた、日本屈指の苔の美しい歴史的宗教都市跡（神社）。歴史と自然が完全に調和した聖地。","url":"https://heisenji.jp/","map":"https://www.google.com/maps/search/平泉寺白山神社","rate":5,"rg":"中部地方","en":{"name":"Heisen-ji Hakusan Shrine","desc":"Japan's foremost moss-covered religious city — the Echizen center of Hakusan faith, a sanctuary where history and nature are in perfect harmony."}},{"area":"福井県小浜市","name":"多田寺","desc":"奈良時代の高僧・行基による開基と伝わる古刹。本尊の薬師如来坐像をはじめ、国指定文化財の仏像を数多く安置する若狭の名刹。","url":"http://www1.city.obama.fukui.jp/obm/rekisi/sekai_isan/Japanese/data/412.htm","map":"https://www.google.com/maps/search/多田寺+小浜","rate":4,"rg":"中部地方","en":{"name":"Tada-ji Temple","desc":"An ancient temple founded, as tradition holds, by the Nara-era monk Gyoki, enshrining many designated Buddhist statues led by the healing Yakushi Nyorai."}},{"area":"長野県諏訪郡原村 / 茅野市","name":"八ヶ岳山岳信仰の遺跡群（及び中信・諏訪の古社）","desc":"（名所として）古くから山岳信仰の対象となってきた八ヶ岳山麓に点在する、縄文から続く古代の祭祀遺跡や歴史ある社寺。","url":"https://tateshina.ne.jp/","map":"https://www.google.com/maps/search/八ヶ岳山岳信仰","rate":3,"rg":"中部地方","en":{"name":"Yatsugatake Mountain Worship Sites","desc":"Ancient ritual sites from the Jomon period onward, scattered along the foothills of the Yatsugatake range long an object of mountain worship, together with historic shrines of the Suwa region."}},{"area":"岐阜県高山市","name":"高山市街地（古い町並み・三町伝統的建造物群保存地区）","desc":"（名所として）城下町の中心として栄えた「飛騨高山」の商家町。江戸時代の伝統的な出格子や造り酒屋が並ぶ歴史的景観。","url":"https://www.hidatakayama.or.jp/","map":"https://www.google.com/maps/search/高山古い町並み","rate":5,"rg":"中部地方","en":{"name":"Takayama Old Town (Sanmachi)","desc":"The merchant quarter of Hida Takayama, where Edo-period latticed townhouses and sake breweries line the historic streets."}},{"area":"岐阜県美濃加茂市","name":"中山道太田宿（太田宿中山道会館周辺）","desc":"（名所として）木曽川の難所である「太田の渡し」で栄えた中山道の歴史的な宿場町。往時の旅籠や歴史的建造物が残る。","url":"https://www.city.minokamo.gifu.jp/","map":"https://www.google.com/maps/search/太田宿","rate":4,"rg":"中部地方","en":{"name":"Ota-juku on the Nakasendo","desc":"A post town that thrived on the treacherous 'Ota crossing' of the Kiso River, preserving old inns and historic buildings of the highway."}},{"area":"静岡県浜松市中央区","name":"浜松八幡宮","desc":"徳川家康が三方ヶ原の戦いで敗走した際、御神木に身を隠して難を逃れたという歴史的伝承を持つ、浜松の総鎮守。","url":"http://www.hamamatsuhachimangu.org/","map":"https://www.google.com/maps/search/浜松八幡宮", ict with legends that the Heian-era onmyoji Abe no Seimei calculated calendars here — a place alive with nature and ancient romance."}},{"area":"山梨県北杜市","name":"山高神代桜（及び実相寺）","desc":"（名所として）日本三大桜の一つに数えられ、日本初の天然記念物に指定された樹齢2000年とも伝わる圧倒的なエドヒガンザクラと日蓮宗の古刹。","url":"https://www.hokuto-kanko.jp/spot/sakura_jindai/","map":"https://www.google.com/maps/search/山高神代桜","rate":5,"rg":"中部地方","en":{"name":"Yamataka Jindai-zakura & Jisso-ji","desc":"An overwhelming Edohigan cherry — counted among Japan's three great cherries and the nation's first designated Natural Monument, said to be 2,000 years old — with the Nichiren temple Jisso-ji."}},{"area":"山梨県南都留郡富士河口湖町","name":"西湖いやしの里根場","desc":"（名所として）かつて「日本一美しい茅葺き集落」と称された西湖畔の集落を復元した景勝地。富士山を背景に伝統的な景観が広がる。","url":"https://www.yamanashi-kankou.jp/","map":"https://www.google.com/maps/search/西湖いやしの里根場","rate":4,"rg":"中部地方","en":{"name":"Saiko Iyashi-no-Sato Nenba","desc":"A restored thatched-roof village on Lake Sai once hailed as 'Japan's most beautiful thatched village,' with traditional scenery framed by Mt. Fuji."}},{"area":"長野県松本市","name":"松本神社（及び旧開智学校周辺の城下町景観）","desc":"（名所として）松本城の旧城下町に鎮座し、歴代城主の崇敬を集めた古社と、日本の近代教育の歴史を伝える歴史的建造物群。","url":"https://www.city.matsumoto.nagano.jp/soshiki/134/3855.html","map":"https://www.google.com/maps/search/松本神社","rate":4,"rg":"中部地方","en":{"name":"Matsumoto Shrine & Kaichi School","desc":"An old shrine honored by the successive castle lords of Matsumoto's old castle town, alongside buildings conveying the history of modern education in Japan."}},{"area":"岐阜県飛騨市","name":"飛騨古川の白壁土蔵街","desc":"（名所として）瀬戸川沿いに白壁の土蔵と艶やかな鯉が泳ぐ風情ある町並み。伝統的な匠の技と飛騨の歴史的景観が美しく残る。","url":"https://www.hida.jp/","map":"https://www.google.com/maps/search/飛騨古川白壁土蔵街","rate":4,"rg":"中部地方","en":{"name":"Hida-Furukawa White-walled District","desc":"An atmospheric town along the Setsu river with white-walled storehouses and gliding carp, beautifully preserving traditional craftsmanship and historic scenery."}},{"area":"岐阜県恵那市","name":"岩村城跡（岩村城下町）","d
